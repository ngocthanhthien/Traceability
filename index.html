    "HANDOFF.md": "# HANDOFF CHO CLAUDE AI — iLD Process Flow Traceability\n\nNgày bàn giao: 08/10/2026. Đây là tài liệu hiện hành. `HANDOFF_LEGACY.md` chỉ dùng tham khảo lịch sử của app offline.\n\n## 1. Yêu cầu người dùng đã chốt\n\n- Process Flow là nơi trung tâm để thực hiện truy xuất tại nhà máy cà phê iLD.\n- Mỗi đại diện dùng máy riêng, truy cập web server nội bộ, đăng nhập và nhập dữ liệu công đoạn được giao.\n- Một công đoạn có nhiều mẻ/PO. Một mẻ có nhiều đầu vào và nhiều đầu ra, bao gồm rework.\n- Kết nối đầu ra công đoạn trước với đầu vào công đoạn sau; tính mass balance và truy ngược/xuôi từ vị trí đã có thông tin.\n- Giao diện được gộp trong **một file HTML duy nhất** để bàn giao và tiếp tục chỉnh sửa.\n- Một HTML không thay thế backend: giữ server cho đăng nhập, phân quyền và dữ liệu chung. Không biến đăng nhập thành kiểm tra mật khẩu bằng JavaScript hoặc LocalStorage.\n- Ngôn ngữ giao diện tiếng Việt, nhận diện iLD Crafted nâu/kem. Không yêu cầu chuyển framework hay dùng dịch vụ cloud.\n\n## 2. Bàn giao những gì\n\nChỉ cần gửi cho Claude **`index.html` và `HANDOFF.md`** để đọc toàn bộ nguồn hiện tại. HTML chứa cả giao diện legacy, template giao diện web và gói mã nguồn backend/tài liệu/tests nhúng trong JSON. Không chứa dữ liệu nhà máy, DB hay thông tin đăng nhập thực tế.\n\n| Thành phần trong HTML | Vai trò và cách sửa |\n|---|---|\n| HTML/CSS/JS ngoài template | Các tab legacy: dashboard, exercise, email, checklist, trace, mass, report, settings và sơ đồ tham chiếu |\n| `\u003ctemplate id=\"ild-lan-template\">` | Nguồn giao diện Process Flow Web; CSS/JS nội bộ được cách ly trong iframe |\n| `BEGIN ILD LAN FRAGMENT` / `END ILD LAN FRAGMENT` | Marker server dùng để trích giao diện web. Giữ nguyên, mỗi marker xuất hiện một lần ở dạng literal |\n| `\u003cscript id=\"ild-backend-bundle\" type=\"application/json\">` | Gói nguồn bổ trợ: `files` là mapping đường dẫn tương đối → nội dung UTF-8. Không phải script thực thi |\n| `downloadServerBundle()` | Nút Tải bộ server tạo ZIP từ nguồn nhúng qua ZIP writer có sẵn, không lấy DOM đang chạy hoặc dữ liệu LocalStorage |\n\n**Không còn dùng `lan/app.html`.** Khi làm việc trong repo, sửa UI tại template trong `index.html`; sửa backend ở `lan/server.py`. Sau khi sửa file bổ trợ, chạy `python tools/sync_handoff_bundle.py` để cập nhật bản nhúng. Không sửa độc lập cả backend nhúng lẫn file server gây lệch phiên bản. Script chỉ đóng gói danh sách file nguồn cố định, không quét/thêm thư mục data.\n\n## 3. Khôi phục repo từ HTML bàn giao\n\nCách dễ nhất: mở HTML bằng trình duyệt, bấm **Tải bộ server**, giải nén ZIP, rồi đặt **file index.html gốc** cạnh `START_WEB.cmd`. Giữ tên `index.html` vì server đọc đúng tên này. Đọc `lan/README.md`.\n\nNếu Claude có môi trường xử lý file, có thể trích JSON giữa thẻ script `ild-backend-bundle`, parse bằng JSON rồi ghi từng `files[name]` dưới một thư mục đầu ra. Trước khi ghi, kiểm tra đường dẫn đã resolve vẫn nằm trong thư mục đó; không ghi đè repo khác hoặc file người dùng mà chưa kiểm tra. Không dùng regex lấy toàn bộ mọi script làm JavaScript vì có script JSON.\n\nGói đi kèm gồm server, hai file CMD, tài liệu nghiệp vụ/handoff, tests và script đồng bộ gói. Sau khi trích, dùng file HTML nhận được làm `index.html`. DB được tạo khi setup, không được gửi kèm gói.\n\n## 4. Chạy và các URL\n\nYêu cầu Python 3.12+, thư viện chuẩn. Không cần npm/framework để vận hành.\n\n```powershell\npython lan/server.py --init-admin\npython lan/server.py\n```\n\nHoặc chạy `SETUP_ADMIN.cmd` rồi `START_WEB.cmd`. Không có mật khẩu mặc định. Tạo tài khoản đầu tiên bằng terminal, nhập mật khẩu ẩn ít nhất 12 ký tự. Nếu DB đã có người dùng, không khởi tạo lại.\n\n- `/`, `/lan`, `/lan/`: server trích template trong index.html và phục vụ giao diện Process Flow Web độc lập.\n- `/legacy`: toàn bộ giao diện cũ; tab Process Flow dùng iframe srcdoc từ cùng template, không fetch một HTML thứ hai.\n- Mở index.html trực tiếp bằng file://: các tab offline vẫn hoạt động; Process Flow Web chỉ xem trước màn hình đăng nhập, có thông báo cách chạy server và không cho gửi đăng nhập qua file://. Nút Sơ đồ tham chiếu offline mở sơ đồ kéo thả cũ.\n- Localhost mặc định: http://127.0.0.1:8080.\n- Dùng mạng nội bộ cần HTTPS/reverse proxy hoặc `--host 0.0.0.0 --cert ... --key ...`. Server không cho bind LAN HTTP thuần. Xem README cho proxy Host và backup.\n\nChưa cấu hình DNS, HTTPS, firewall, dịch vụ Windows hay triển khai cho máy trạm nhà máy. Không tự xem pilot là đã triển khai production.\n\n## 5. Backend và mô hình dữ liệu hiện có\n\n`lan/server.py` dùng ThreadingHTTPServer và SQLite WAL trên đĩa cục bộ server. Ghi qua BEGIN IMMEDIATE để kiểm tra phiên bản và tổng phân bổ trong cùng transaction. Không đặt SQLite trên SMB hoặc mở nhiều server từ các máy khác nhau vào một file mạng.\n\nBảng DB:\n\n- `users`: id, username, name, role (`admin`, `qa`, `operator`), stages (JSON), password scrypt, active.\n- `sessions`: hash token, user_id, expires. Token bearer ngẫu nhiên, phiên 8 giờ. UI chỉ giữ token trong bộ nhớ.\n- `cases`: id, name, version, status (`open`, `closed`), created, snapshot.\n- `events`: id, case_id, version, status, author, data JSON, updated.\n- `history`: thời gian, người, action, entity, before/after JSON. Không giới hạn 500 dòng như legacy.\n- `login_attempts`: giới hạn thử đăng nhập sai theo địa chỉ và username.\n\nPhiếu `event.data`:\n\n```text\nstage, title, po, pic, equipment, start, end,\nevidence, note, customer, limit, limitReason,\ninputs[], outputs[], contexts[]\n```\n\nMỗi dòng vật liệu: `id, material, batch, sscc, location, qty, unit, basis, factor, factorEvidence, kind`. Input liên kết thêm `sourceEvent, sourceLine`. Input kind: external/linked/opening. Output kind: product/rework/reject/sample/loss/stock. `contexts` là các ID phiếu Utility/CIP được đại diện chọn.\n\nStages: incoming, tipping, roasting, extraction, evaporation, liquid, drying, packing, warehouse, packaging, ingredients, rework, utility. Khi thêm stage phải cập nhật STAGES/STAGE_IDS backend và positions/route trong template UI.\n\nID nội bộ mới là định danh liên kết. Không tự nối lô bằng chuỗi batch; nhiều mã giống nhau có thể thuộc nguồn khác nhau. Dữ liệu sự kiện hiện được giới hạn trong từng đợt, chưa dùng lại genealogy giữa các đợt.\n\n## 6. API chính\n\nTất cả trả JSON; request ghi dùng Content-Type application/json. Ngoài login, API yêu cầu Authorization: Bearer token. Origin nếu có phải phù hợp Host. Không có CORS mở rộng.\n\n| Endpoint | Chức năng |\n|---|---|\n| POST /api/login | username/password → token/user |\n| POST /api/logout | Xóa session |\n| GET /api/state?case=ID | User, stages, cases, case, users, events kèm balance |\n| POST /api/users | Admin tạo người dùng và công đoạn |\n| POST /api/cases | QA/admin tạo đợt |\n| POST /api/events | `{id?, caseId, version, data}`; kiểm quyền, phiên bản, nguồn và phân bổ |\n| POST /api/transition | `{id, version, action, reason?}`; submit/verify/reopen |\n| POST /api/close | `{id, version}`; snapshot và khóa đợt |\n| GET /api/export?case=ID | JSON đợt hoặc snapshot đã đóng |\n| GET /api/audit | QA/admin xem 200 thao tác gần nhất; DB vẫn giữ toàn bộ |\n\n## 7. Quy tắc đang thực thi\n\n- Operator sửa công đoạn trong stages được giao; QA/admin sửa toàn bộ, xác minh và đóng đợt. Tên PIC là người được phân công, khác người thực sự thao tác trong audit.\n- Nháp → gửi xác nhận → verified. Sửa verified phải QA reopen có lý do. Cập nhật/reopen nguồn làm phiếu phụ thuộc đã gửi/xác minh chuyển needs_review.\n- Kiểm `version` khi lưu/chuyển trạng thái; stale version trả 409, không ghi đè.\n- Liên kết nguồn chỉ nhận output product/rework/stock, giữ material/batch/SSCC/unit. Tổng cấp cho mọi phiếu không vượt lượng output. Phiếu đang nháp cũng giữ phần phân bổ.\n- Không xóa output đang có người nhận, đổi định danh của nguồn đang dùng hoặc tạo vòng giao dịch. Rework nhiều thế hệ phải là sự kiện mới dù mã batch có thể giữ nguyên.\n- Truy bằng `traceSet()`: BFS/visited ID theo edges(). Cả hai = hợp của truy ngược và truy xuôi riêng từ cùng mẻ gốc; không duyệt đồ thị vô hướng làm lan sang mọi nhánh cùng tổ tiên.\n- Search Batch/PO/SSCC neo vào phiếu/mẻ chứa thông tin tìm được. Chưa truy chính xác riêng từng phần của một output trong mẻ trộn.\n- Balance: Σ(qty × factor) input/output từng basis. Thiếu factor/căn cứ hoặc thiếu một phía → incomplete. Từng basis kiểm sai lệch riêng, không bù chéo nhóm. Utility → not_applicable. QA verify cần balance ok, căn cứ ngưỡng và nguồn/context verified.\n- Input external là ranh giới truy xuất/chứng từ ngoài app; không có nghĩa đã chứng minh đủ nguồn gốc.\n- Poll 15 giây khi không đang nhập. Dirty form giữ nguyên; người dùng lưu rõ ràng. Refresh có xác nhận bỏ bản chưa lưu.\n- Đóng đợt cần mọi phiếu verified, lưu snapshot và cấm thay đổi. Chưa có reopen đợt đã đóng.\n\n## 8. Tình trạng legacy và các lỗi nghiệp vụ còn tồn tại\n\nLegacy dùng `ild_trace_v1` trong LocalStorage, khác DB server. Các tab trace/mass/report legacy không tự tổng hợp dữ liệu Process Flow mới. Không xóa/migrate tự động dữ liệu này.\n\nCác phát hiện đã có trong DE_XUAT_CAI_TIEN_TRUY_XUAT.md, **chưa được sửa trong logic legacy**:\n\n- evalExercise coi đủ hồ sơ khi có ít nhất 1 yes và không có no, bỏ qua ô chưa đánh dấu.\n- Báo cáo coi liên kết công đoạn đạt chỉ dựa vào cs.done > 0.\n- Unknown deviation = |1 − N1×N2| có thể che hai sai lệch bù trừ.\n- Chưa kiểm đủ dữ liệu cầu nối GC/Solid. Ngày receipt/production có chỗ lấy ngày đợt.\n- Balance phụ thuộc dòng đầu/cuối trong khi cho thêm/xóa; mảng rỗng có thể lỗi.\n- Quy tắc GC khác nhau giữa slide training và batch coding; không tự chuẩn hóa mã lịch sử khi chưa có SOP hiện hành.\n- `reworkAddSolid` chú thích là dry solid nhưng công thức nhân lại fgSolid; phải kiểm Excel gốc/định nghĩa trước khi đổi.\n\nTài liệu 4 PPTX có tổng 63 slide đã được đọc trong phiên trước, nhưng không nhúng file PPTX vào HTML. Các Excel/Word/PDF được handoff cũ nhắc tới chưa được kiểm chứng ở vòng triển khai này. Không tuyên bố đạt tiêu chuẩn/audit dựa trên phiên bản ghi trong legacy.\n\n## 9. Việc Claude cần ưu tiên hoàn thiện\n\n1. Quản trị tài khoản: đổi/reset mật khẩu, vô hiệu hóa tài khoản, thu hồi phiên, quy trình cấp quyền và kiểm thử phân quyền. Hiện UI mới có tạo tài khoản.\n2. Làm rõ phạm vi đợt và các công đoạn không áp dụng; mọi phiếu hiện verified chưa đủ chứng minh không bỏ sót công đoạn.\n3. Bàn giao hai bên: lượng xuất và lượng thực nhận độc lập, trạng thái xác nhận và lý do chênh lệch. Hiện mới kiểm tổng phân bổ/tiêu hao.\n4. Quản lý file chứng cứ an toàn, phiên bản, gắn event/lot; hiện chỉ mã/tham chiếu file.\n5. Chuẩn hóa mass balance với QA: units, basis, solid/moisture/yield, tồn đầu/cuối, nhánh liquid/powder, PM, rework, hệ số có phê duyệt. Không áp dụng 0.84/0.97 mù quáng.\n6. Cải thiện đồ thị: drill-down từ công đoạn tới mẻ và output cụ thể, xem lượng/chứng cứ trên cạnh, tránh đường chồng và không dùng vị trí mũi tên làm dữ liệu nguồn gốc.\n7. Cân nhắc genealogy dùng chung giữa đợt, import SAP/CSV chống trùng, migration legacy có xem trước/map/đối chiếu và backup.\n8. Báo cáo chính thức QA.F.029/030 từ DB mới. Giữ báo cáo cũ để đối chiếu; chưa tuyên bố hai hệ thống dữ liệu đã hợp nhất.\n9. Triển khai và nghiệm thu với IT: HTTPS, backup/restore, vận hành dịch vụ, đo tải và thử từ nhiều máy thực. Chưa triển khai production.\n\nKhông cần làm tất cả trong một lần. Trước mỗi thay đổi, kiểm mã đang có, chọn phạm vi theo yêu cầu tiếp theo của người dùng và giữ migration dữ liệu cũ.\n\n## 10. Kiểm thử và bàn giao lại\n\n```powershell\npython -m unittest discover -s tests -p test_lan.py -v\npython tests/serve_fixture.py\n# Trong terminal khác, nếu có Playwright và Chrome:\nnode tests/browser_lan.cjs\npython tools/sync_handoff_bundle.py\n```\n\nCó thể đặt PLAYWRIGHT_MODULE là đường dẫn module Playwright sẵn có và BROWSER_CHANNEL là chrome/edge phù hợp. Fixture ở localhost:8097, DB test mới trong .test-output, không dùng tài khoản fixture cho dữ liệu thật. Dừng fixture sau kiểm thử. Không cần Playwright để vận hành ứng dụng.\n\nĐã kiểm sau gộp: 11 test server đạt; tất cả JavaScript thực thi kiểm cú pháp đạt; Chrome kiểm login/save/verify/liên kết/truy hai chiều/report/audit/tài khoản/phân quyền/mobile; thêm login thật trong iframe srcdoc, 9 tab legacy file://, trạng thái preview offline và chuyển sang sơ đồ tham chiếu.\n\nKhi sửa thêm cần kiểm export ZIP nguồn nhúng, parse JSON bundle và so từng file với source repo. Không đưa data/, .test-output/, mật khẩu hoặc TLS key vào file bàn giao. Sau thay đổi backend/docs/tests, chạy sync bundle rồi mới gửi HTML.\n\n## 11. Prompt tiếp tục cho Claude\n\n> Đọc HANDOFF.md này trước và kiểm tra index.html. Người dùng muốn Process Flow làm trung tâm truy xuất đa người dùng trên web nội bộ, mỗi đại diện đăng nhập và nhập phiếu công đoạn, nối nhiều đầu vào/đầu ra, mass balance và truy ngược/xuôi. Giao diện chỉ có một index.html; backend Python/SQLite được nhúng dưới dạng gói nguồn JSON và cũng có thể trích ra để chạy. Giữ phân quyền thực ở server, không giả lập bằng LocalStorage. Xác định phần nào đã có, nêu rõ giới hạn pilot, rồi tiếp tục theo yêu cầu mới của người dùng. Ưu tiên giữ dữ liệu, kiểm phiên bản đồng thời, chứng cứ và cân bằng đúng basis. Không tuyên bố đã triển khai LAN hoặc đạt yêu cầu QA khi chưa nghiệm thu. Đồng bộ gói nguồn trong HTML trước khi bàn giao lại.\n",
    "HANDOFF_LEGACY.md": "# HAND-OFF — iLD Coffee Traceability App\n\n## Cập nhật 07/10/2026 — Process Flow Web nội bộ\n\nNgười dùng đã chọn mỗi đại diện dùng máy riêng, đăng nhập web và cập nhật qua mạng nội bộ. Ràng buộc một file/offline bên dưới chỉ còn áp dụng bản legacy; Process Flow mới dùng Python server + SQLite tập trung.\n\n- Hướng dẫn chạy và giới hạn pilot: `lan/README.md`.\n- Server/API: `lan/server.py`; giao diện mới: `lan/app.html`.\n- Khởi tạo quản trị: `SETUP_ADMIN.cmd`; chạy localhost: `START_WEB.cmd`.\n- `/` và `/lan/` là giao diện mới. `/legacy` mở `index.html`, tab Process Flow nhúng giao diện mới. Các tab legacy khác vẫn là dữ liệu LocalStorage riêng, chưa được hợp nhất.\n- Dữ liệu mới ở `data/traceability.sqlite3` (Git ignore). Không seed tài khoản mặc định. Không commit DB, mật khẩu hoặc khóa TLS.\n- Kiểm thử server: `python -m unittest discover -s tests -p test_lan.py -v`; kiểm thử browser có fixture riêng.\n- Đã kiểm tra 11 bài server và thao tác Chrome. Chưa triển khai server vào LAN thật hoặc di chuyển dữ liệu nghiệp vụ cũ.\n\nPhần bàn giao dưới đây mô tả bản offline trước nâng cấp và không thay thế tài liệu vận hành web mới.\n\nTài liệu bàn giao để một AI/model khác (hoặc chat mới) tiếp tục chỉnh sửa ứng dụng mà không cần lịch sử hội thoại. Đọc hết phần này trước khi sửa code.\n\n---\n\n## 1. Tổng quan\n\n- **Sản phẩm:** Một ứng dụng web **1 file HTML duy nhất**, chạy **offline**, lưu dữ liệu bằng **LocalStorage**, phục vụ hệ thống **Truy xuất nguồn gốc (Traceability)** cho nhà máy cà phê hòa tan sấy thăng hoa **iLD Coffee Vietnam**.\n- **File chính (deliverable):** `D:\\14_TRACEABILITY\\Traceability App\\iLD_Traceability_App.html`\n- **Người dùng:** 1 QA coordinator, dùng trên PC (Windows, Chrome). Không cần server, không cần internet.\n- **Chuẩn tham chiếu:** FSSC 22000 v5.1 · BRC issue 9 · IFS Food v7.\n- **Ngôn ngữ UI:** Tiếng Việt (có song ngữ Anh ở báo cáo).\n- **Phong cách giao diện:** \"Industrial Dashboard — Light\", màu chủ đạo xanh dương `--brand:#0b5cab`.\n\n### Ràng buộc kỹ thuật BẮT BUỘC giữ nguyên\n1. **Chỉ 1 file HTML** — toàn bộ CSS + JS inline, KHÔNG tách file, KHÔNG thư viện ngoài, KHÔNG CDN.\n2. **Offline tuyệt đối** — không fetch mạng. Lưu trữ = LocalStorage (key `ild_trace_v1`).\n3. Vanilla JS thuần (ES6+), không framework. Vẫn chia module rõ bằng comment vùng mã.\n4. Dùng được trên Chrome/Edge hiện đại. `localStorage`, `btoa`, `Blob`, `URL.createObjectURL` đều OK.\n\n---\n\n## 2. Cách chạy & kiểm thử\n\n- **Chạy:** double-click file HTML → mở bằng Chrome. Script đặt cuối `\u003cbody>`, boot ngay (`if(document.readyState==='loading') addEventListener('DOMContentLoaded',boot); else boot();`).\n- **Kiểm thử (không mở trình duyệt):** dùng **jsdom** trong môi trường Node (sandbox Linux).\n  - Cài: `cd /tmp && npm install jsdom` (lưu ý: `/tmp` reset giữa các lần chạy bash → cài lại nếu mất).\n  - Nạp file, `runScripts:'dangerously'`, rồi `w.eval('boot()')` (jsdom không tự fire DOMContentLoaded đúng lúc — gọi boot() tay để test).\n  - Biến/hàm **khai báo bằng `function`** là global (gọi được qua `w.eval`); biến `const`/`let` top-level KHÔNG lên window — test qua `dom.window.eval('...')`.\n  - **Kiểm cú pháp nhanh:** trích `\u003cscript>` ra file .js rồi `node --check`.\n  - **Kiểm .xlsx:** ghi bytes ra file, mở bằng `openpyxl` (python) để xác nhận Excel đọc được.\n  - **Kiểm .eml:** parse bằng `email` (python) để xác nhận header + body UTF-8 giải mã đúng.\n- Sau mỗi chỉnh sửa: chạy lại smoke test điều hướng 8 tab + `node --check`.\n\n---\n\n## 3. Kiến trúc & bố cục code (theo thứ tự trong `\u003cscript>`)\n\nCác vùng mã đánh dấu bằng comment `[TÊN]`:\n\n- `[CONFIG]` — `CFG` (KEY, MAX_HOURS=4, DEV_LIMIT=0.5, RETAIN_YEARS=5) + `defaultSender()`.\n- `[SEED]` — dữ liệu hạt giống:\n  - `SEED_CONTACTS` (To), `SEED_CC` (Cc) — danh bạ PIC/email.\n  - `SEED_BACKWARD`, `SEED_FORWARD` — danh mục biểu mẫu Annex 1 theo công đoạn/PIC.\n  - `TRACE_SPEC`, `TRACE_ORDER`, `newTrace()`, `newTraceRow()` — tab Chi tiết truy xuất.\n  - `MB_STAGES` (cũ, còn khai báo nhưng KHÔNG dùng nữa — có thể xóa).\n  - Mass balance: `mkStageRow()`, `newMass()`, `stageSummary()`, `massCalc()`.\n  - `evalExercise()` — đánh giá đạt/không.\n- `[STORE]` — `Store` (save/load/defaults/exportJSON/importJSON).\n- `[STATE]` — `DB` (toàn bộ dữ liệu), `State`, `currentEx()`, `logAct()`.\n- `[UTILS]` — `$ $$ esc uid fmtDate fmtDay toast flashSaved confirmBox`.\n- `[LOGIC]` — helpers: `buildChecklist checklistStats picProgress timeStatus fmtDur massCalc evalExercise`.\n- `[UI]` — `Nav` (điều hướng tab) + các `render*()` cho từng tab + module hành vi.\n- `[XLSX]` — module `Xlsx` tự sinh file .xlsx (zip + OOXML) không cần thư viện.\n- `[BOOT]` — `boot()` + migration + đăng ký sự kiện.\n\n### 8 Tab (sidebar)\n`dashboard, exercise, email, checklist, trace, mass, report, settings`\nMap trong `Nav.go()`: `{dashboard:renderDashboard, exercise:renderExercise, email:renderEmail, checklist:renderChecklist, trace:renderTrace, mass:renderMass, report:renderReport, settings:renderSettings}`.\n\nMỗi tab có `\u003csection id=\"tab-XXX\" class=\"page\">`. Mỗi module hành vi là một object: `Ex` (đợt), `Cl` (checklist), `Tr` (chi tiết truy xuất), `Mb` (mass balance), `Email`, `Rep`, `Set`, `Xlsx`.\n\n---\n\n## 4. Data model (LocalStorage `DB`)\n\n```\nDB = {\n  exercises: [ Exercise ],   // danh sách đợt truy xuất\n  contacts:  [ {name,email,dept} ],      // To\n  ccContacts:[ {name,email,dept} ],      // Cc\n  catalog:   { backward:[{stage,pic,forms:[...]}], forward:[...] }, // khuôn checklist\n  settings:  { maxHours:4, devLimit:0.5, sender:{...} },\n  current:   \"\u003cexerciseId>\" | null,      // đợt đang chọn\n  log:       [ {t,msg} ]                 // audit log\n}\n\nsettings.sender = { name, short, title, mobile, email, company, address }\n  // 'short' = tên gọi dùng ở câu mở đầu email (\"\u003cshort> xin gửi yêu cầu...\")\n\nExercise = {\n  id, createdAt, status:'draft'|'running'|'closed',\n  batch, material, matNo, purpose, scenario,\n  dir:'backward'|'forward',\n  startAt, finishAt,          // epoch ms; đồng hồ đếm ngược 4h\n  checklist: [ {stage,pic,items:[{id,form,status:''|'yes'|'no'|'na',receivedAt,remark}]} ],\n  mass:  Mass,                // xem mục 6\n  trace: Trace,               // xem mục 5\n  capa, conclusion\n}\n```\n\nMigration (trong `boot()`): tự thêm `trace`, `mass` (model mới), `ccContacts`, `settings.sender`, và merge liên hệ seed còn thiếu (Grasso/WTP) cho DB cũ. **Khi thêm field mới vào model, PHẢI thêm migration tương ứng ở boot() để DB cũ không vỡ.**\n\n---\n\n## 5. Tab \"Chi tiết truy xuất\" (trace) — theo mẫu QA.F.029 / QA.F.030\n\nNguồn: `D:\\14_TRACEABILITY\\QA.F.029 Forward Traceability Report.xlsx`, `QA.F.029-030 Traceability report,v2.xlsx`, `Traceability Report - 29.05_42080028F1.xlsx`.\n\n```\nTrace = {\n  reason, participants:[{name,dept}] (8 dòng),\n  incoming:[row], tipping:[row], process:[row], packing:[row], fgs:[row]\n}\n```\n- `TRACE_SPEC` định nghĩa cột mỗi section. Có 2 loại:\n  - `kind:'flat'` (incoming, fgs): bảng phẳng (Material No, Supplier, Batch, SSCC, dates, Qty, Customer...).\n  - `kind:'io'` (tipping, process, packing): có nhóm cột **INPUT / OUTPUT** + cột **Gap tự tính = inQty − outQty**.\n- `TRACE_ORDER.forward = [incoming,tipping,process,packing,fgs]`; `backward` đảo ngược. Report & tab tự đảo theo `ex.dir`.\n- Báo cáo (`renderReport`) layout chính thức **8 mục**: 1 Thời gian · 2 Người tham gia · 3 Loại · 4 Lý do · 5 Thông tin truy xuất · 6 Kết quả (các section + Mass Balance) · 7 Kết luận (4 tiêu chí BRC) · 8 Điểm cải thiện + ký duyệt.\n\n---\n\n## 6. Tab \"Mass Balance\" — LOGIC ILD (quan trọng, bám sát file thực tế)\n\nNguồn logic: `D:\\14_TRACEABILITY\\ORGANIC MASSBALANCE SUMMARY_ILD.xlsx` (sheet **\"ILD summary\"** chứa công thức gốc) và `..._Olam.xlsx` (tham khảo logic cơ bản).\n\n### Mô hình (`newMass()`)\n```\nMass = {\n  factors:{ roastYield:0.84, fgSolid:0.97 },\n  solidFromExtraction:'',   // M9 — Tổng Solid từ Extraction thực tế (kg)\n  reworkAddSolid:'',        // cộng thêm vào Output thực tế FGs (basis solid)\n  unknownLimit:0.5,         // % ngưỡng\n  stage1:[ row(Nhập hàng,roasted:false), row(Tipping,false), row(Roaster,roasted:true), row(Grinder,roasted:true) ],\n  stage2:[ row(Extraction,isFG:false), row(Evaporation,false), row(FMT,false), row(FGs,isFG:true) ],\n  note:''\n}\nrow = {stage,batch,nsx,po,input,downgrade,loss,sampling,instock,actualOut,record,remark, roasted?|isFG?}\n```\n\n### Công thức (`massCalc()` — đã kiểm khớp 100% với sheet ILD)\nMỗi dòng có **hệ số quy đổi về basis nhóm**:\n- Stage 1 quy về **GC (Green Coffee)**: dòng `roasted:true` (Roaster, Grinder) nhân `1/roastYield` (tức ÷0.84).\n- Stage 2 quy về **Total Solid**: dòng `isFG:true` (FGs) nhân `fgSolid` (×0.97).\n\nCho mỗi nhóm:\n```\nOutput lý thuyết (theo) = INPUT(dòng đầu) − Σ(downgrade·k) − Σ(loss·k) − Σ(sampling·k) − Σ(instock·k)\nOutput thực tế (actual) = actualOut(dòng cuối) · k(dòng cuối)   // stage2 cộng thêm reworkAddSolid trước khi ×k\nTỉ lệ thu hồi (recovery)= actual / theo\nGap = 1 − recovery\n```\nNối 2 stage:\n```\nN9 (GC→Solid) = solidFromExtraction / s1.actual\nHệ số chuyển đổi tổng (overall) = s1.recovery × N9 × s2.recovery   // range tham khảo 25–53%\nUnknown deviation (%) = |1 − s1.recovery × s2.recovery| × 100      // mục tiêu \u003c 0.5%\nhasData = (stage1[0].input>0 && grinder.actualOut>0)\n```\n`evalExercise().massOk = hasData && unknownDev \u003c= unknownLimit`.\n\n**Số liệu demo trong sheet ILD để đối chiếu khi test** (phải ra đúng): INPUT=30000, Tipping instock=9700, Grinder downgrade=252 & actualOut=8116, M9≈14002.857, Extraction input=3624, FGs downgrade=100/sampling=1/actualOut=3475, reworkAddSolid=380 → **N1=48.31%, N9=144.93%, N2=106.05%, overall=74.25%, unknownDev=48.77%** (demo cố ý không cân bằng).\n\n> Lưu ý: model mass balance hiện FIXED 2 stage đặc thù cà phê (coffee-specific). Hệ số 0.84/0.97 chỉnh được trong tab Cài đặt-mass.\n\n---\n\n## 7. Tab \"Soạn email\" — khởi động quy trình truy xuất\n\nNguồn mẫu: `D:\\14_TRACEABILITY\\QA_DIEN_TAP_TRUY_XUAT_NGUON_GOC_BATCH_52610103F1.txt`, `QA_TRUY_XUAT_NGUON_GOC_CHO_ORGANIC_BATCH_52800075F1.txt`. Mẫu file .eml đích: `...Email-OE-Overview-ILD0016 (3).eml` (trong uploads).\n\n- `buildEmail(ex)` sinh nội dung bám verbatim mẫu QA (câu mở đầu, bảng Batch/Material, phân công từng bộ phận, Note 3 mục, chữ ký). Câu mở đầu + chữ ký lấy từ `DB.settings.sender` (đã cho cấu hình được).\n- `emailSubject(ex)` đổi tiêu đề theo `purpose`: Organic / Recall / mặc định \"DIỄN TẬP\".\n- **Tạo email Outlook (.eml):** `Email.eml()` → `Email.buildEML()` sinh file RFC822 với:\n  - Header **`X-Unsent: 1`** (Outlook mở ra = thư nháp CHƯA gửi, chỉ bấm Send).\n  - Subject mã hóa `=?UTF-8?B?\u003cbase64>?=`; body `Content-Transfer-Encoding: base64`, `charset=UTF-8` (tiếng Việt chuẩn).\n  - To/Cc lấy từ textarea `#emTo`/`#emCc` (người dùng sửa được trước khi tạo).\n  - Tải xuống dạng `message/rfc822`, tên `QA_TruyXuat_\u003cbatch>.eml`.\n- `Email.mailto()` giữ làm phương án dự phòng.\n- **Chưa làm (gợi ý tiếp):** nhúng sẵn attachment (Annex 1 hoặc file .xlsx của đợt) vào .eml — hiện phải đính kèm tay.\n\n---\n\n## 8. Module `Xlsx` — xuất Excel .xlsx offline (không thư viện)\n\n- Tự build **ZIP (store, no compression) + CRC32** + các part OOXML (`[Content_Types].xml`, `_rels`, `workbook.xml`, `styles.xml`, `worksheets/sheet1.xml`).\n- Cell dùng `inlineStr` (không shared strings); hỗ trợ `mergeCells`, `cols` width, vài style (bold/title/header/section) qua `styles.xml`.\n- `Xlsx.report(id)` xuất báo cáo 1 đợt theo layout QA.F.029/030 (gồm cả Mass Balance ILD). Tên file `QA.F.029_Forward_\u003cbatch>.xlsx` / `QA.F.030_Backward_...`.\n- Helper nội bộ: `Sheet`, `cell()`, `sheetXML()`, `buildSection()` (trace), `buildMassStage()` (mass), `bytes(ex)` (đóng gói), `report(id)` (tải).\n- Đã verify mở được bằng openpyxl. Khi sửa: giữ CRC32 + cấu trúc zip chuẩn, test lại bằng openpyxl.\n\n---\n\n## 9. Trạng thái hiện tại (ĐÃ xong)\n\n- [x] 8 tab đầy đủ, style Industrial Light, auto-save LocalStorage, backup/restore JSON.\n- [x] Dashboard KPI + nhắc việc (2 đợt/năm, quá hạn 4h, thiếu hồ sơ).\n- [x] Đợt truy xuất: thông tin lô, chọn chiều, đồng hồ đếm ngược 4h, nhân bản/xóa, đóng & đánh giá.\n- [x] Soạn email: template bám mẫu QA, To/Cc, tạo .eml (X-Unsent), người gửi cấu hình được.\n- [x] Checklist hồ sơ: seed Annex 1 (Backward ~94 form / Forward ~13), Có/Không/N/A, % theo bộ phận, xuất CSV.\n- [x] Chi tiết truy xuất: 5 section theo QA.F.029/030, Gap tự tính, đảo chiều.\n- [x] Mass Balance: logic ILD 2-stage, hệ số chỉnh được, khớp công thức file ILD.\n- [x] Báo cáo: layout chính thức 8 mục + in/PDF + xuất .xlsx.\n- [x] Cài đặt: thông số, người gửi email, danh bạ To/Cc, danh mục Annex 1, audit log, reset.\n\n## 10. Gợi ý việc tiếp theo (chưa làm)\n- Nhúng attachment (Annex 1 / .xlsx) trực tiếp vào .eml.\n- Xuất Excel 2 sheet (Forward + Backward) hoặc khung viền đậm hơn cho giống biểu mẫu in.\n- QR/Barcode cho batch; đa ngôn ngữ EN/VI; PWA cài như app.\n- Xóa `MB_STAGES` (code chết). Cân nhắc cho phép cấu hình số stage/hệ số của mass balance linh hoạt hơn (hiện fixed 2 stage).\n\n---\n\n## 11. Quy ước khi sửa code\n- Giữ comment vùng `[TÊN]` và phong cách module-object (`Ex`, `Mb`, `Tr`...).\n- Mỗi lần đổi dữ liệu → gọi `Store.save()`; thao tác đáng ghi → `logAct()`.\n- Input số: lưu `oninput`, rerender `onchange` (tránh mất focus khi gõ).\n- Thêm field vào model → thêm migration ở `boot()`.\n- Escape mọi chuỗi đưa vào HTML bằng `esc()`.\n- Tiếng Việt: dùng số định dạng `fmtNum` (vi-VN, dấu `.` ngăn nghìn) nhưng LƯU số thực.\n- Sau sửa: `node --check` + smoke test 8 tab (+ openpyxl nếu đụng Xlsx).\n\n## 12. File nguồn tham chiếu (trong D:\\14_TRACEABILITY)\n- Quy trình: `QA.P.00X TRACEABILITY PROCEDURE - 002.docx`, `6589.QA.P.009 TRACEABILITY PROCEDURE.pdf`\n- Training: `iLD_Traceability System Training.pptx`\n- Danh mục hồ sơ: `Annex 1 List of records, documents for traceability sytem.xlsx`\n- Report mẫu: `QA.F.029 Forward Traceability Report.xlsx`, `QA.F.029-030 Traceability report,v2.xlsx`, `Traceability Report - 29.05_42080028F1.xlsx`\n- Mass balance: `ORGANIC MASSBALANCE SUMMARY_ILD.xlsx` (logic gốc + công thức), `..._Olam.xlsx`\n- Email mẫu: 2 file `QA_..._BATCH_*.txt` + `...Email-OE-Overview-ILD0016 (3).eml`\n\n---\n*Hand-off tạo ngày 2026-10-07. App do QA iLD Coffee đặt làm; mọi chỉnh sửa giữ nguyên ràng buộc 1-file / offline / LocalStorage.*\n",
    "PROCESS_FLOW_DESIGN.md": "# Process Flow làm trung tâm truy xuất\n\nTrạng thái: người dùng đã chọn web server nội bộ, mỗi đại diện đăng nhập từ máy riêng. Đã có bản pilot tại `lan/server.py` và template LAN trong `index.html`; xem `lan/README.md` để phân biệt chức năng đã triển khai với thiết kế mục tiêu dưới đây. Dữ liệu tập trung SQLite, chưa di chuyển dữ liệu cũ hoặc triển khai lên LAN nhà máy.\n\n## Màn hình chính\n\nThanh trên: Đợt truy xuất, tìm Batch/PO/SSCC, điểm bắt đầu, Truy ngược, Truy xuôi, Cả hai, bộ lọc trạng thái.\n\nVùng giữa: sơ đồ công đoạn. Mỗi khối hiển thị tên công đoạn, PIC, số mẻ liên quan, trạng thái nhập/xác minh, trạng thái cân bằng và số liên kết chưa hoàn tất. Một khối công đoạn có thể chứa nhiều lần sản xuất, không đồng nhất công đoạn với một batch duy nhất.\n\nBảng bên phải mở khi chọn khối: danh sách mẻ/PO và biểu mẫu nhập liệu. Khi chưa chọn mẻ cụ thể, kết quả là tổng quan công đoạn, chưa phải phạm vi truy xuất một lô.\n\nVùng kết quả: lô nguồn, lô nhận, lượng và vị trí, khách hàng, các liên kết chưa có chứng cứ. Bấm kết quả để chuyển điểm bắt đầu truy xuất.\n\n## Phiếu công đoạn\n\n| Nhóm | Trường dữ liệu |\n|---|---|\n| Định danh | ID sự kiện, công đoạn, PO, lần chạy/mẻ, line/thiết bị/bồn, bắt đầu và kết thúc |\n| Trách nhiệm | Bộ phận, đại diện được giao, người nhập, người xác nhận, thời điểm gửi/xác minh |\n| Đầu vào | Nhiều dòng: nguồn sự kiện, material, lot ID, batch hiển thị, SSCC/bin, lượng, đơn vị, basis |\n| Đầu ra | Nhiều dòng: material, lot ID, batch hiển thị, SSCC/bin, lượng, đơn vị, basis, nơi nhận |\n| Phân bổ khác | Tồn trong phạm vi, mẫu, reject, loss đã giải trình, rework tạo ra; các lượng không được tính trùng |\n| Thông số quy đổi | Solid/moisture/yield phù hợp, giá trị, đơn vị, nguồn chứng cứ và phiên bản công thức |\n| Hồ sơ | Mã chứng từ, tham chiếu file, khoảng thời gian áp dụng, trạng thái xác minh và ghi chú |\n\nTrạng thái phiếu: Chưa nhập → Nháp → Gửi xác nhận → Đã xác minh. Phiếu cần bổ sung quay về trạng thái có lý do. Sửa phiếu đã xác minh tạo phiên bản mới và yêu cầu kiểm tra lại phần bị ảnh hưởng.\n\n## Liên kết công đoạn\n\nĐầu ra của mẻ trước được chọn làm đầu vào của mẻ sau. Hệ thống kế thừa định danh, đơn vị và thông tin nguồn. Người nhận khai lượng thực nhận/tiêu hao tương ứng. Lượng đề nghị chuyển và lượng đã xác nhận được lưu riêng khi có chênh lệch.\n\nMột đầu ra có thể cấp cho nhiều mẻ; một mẻ nhận nhiều lô. Kiểm tổng lượng phân bổ không vượt lượng nguồn còn khả dụng, cùng đơn vị và cùng cơ sở đo. Nguồn chưa nhập được đánh dấu Chờ đối chiếu và không được coi là liên kết đã xác minh.\n\nĐịnh danh liên kết bằng ID nội bộ, không chỉ ghép chuỗi batch hoặc dựa trên vị trí mũi tên. Không tự nối những lô cùng ngày hoặc cùng tên sản phẩm. Kéo sơ đồ chỉ thay bố cục; tạo quan hệ vật liệu phải chọn đúng dòng nguồn/đích và lượng.\n\nSơ đồ quy trình chuẩn lưu tách khỏi dữ liệu giao dịch. Khi hiển thị một đợt, sơ đồ chiếu các giao dịch thuộc phạm vi lên các công đoạn. Dữ liệu nguồn gốc có thể được dùng lại ở nhiều đợt, kèm phiên bản để giữ lịch sử báo cáo.\n\n## Truy từ bất kỳ điểm nào\n\n1. Tìm batch, PO hoặc SSCC. Nếu có nhiều kết quả, hiển thị material, ngày và site để chọn đúng đối tượng.\n2. Chọn lô hoặc lần sản xuất làm điểm bắt đầu.\n3. Truy ngược theo các dòng vật liệu đầu vào; truy xuôi theo mọi lần phân bổ/tiêu hao đầu ra.\n4. Tô sáng đường liên quan, làm mờ phần ngoài phạm vi. Hiển thị đường có chứng cứ và đường chờ xác minh bằng nhãn/nét khác nhau.\n5. Khi một liên kết thiếu, dừng kết luận xác nhận ở ranh giới đó và liệt kê dữ liệu cần bổ sung. Có thể hiển thị phạm vi có khả năng ảnh hưởng riêng.\n\nVí dụ giả định: từ mẻ Extraction EXT-A, truy ngược tới các mẻ Roasting và GC đã cấp; truy xuôi tới Evaporation, cả nhánh Liquid và Powder nếu có giao dịch, sau đó tới pallet và giao hàng. Chỉ đi theo nhánh có dữ liệu, không mặc định mọi đường trên sơ đồ đều được sử dụng.\n\nĐối với trộn nhiều lô, khi không có chứng cứ phân bổ chi tiết thì toàn bộ đầu ra của sự kiện có thể liên quan đến từng đầu vào. Không tự suy diễn số kg của một nguồn trong từng sản phẩm. Sau truy ngược, người dùng có thể chọn lô nguồn nghi ngờ làm điểm truy xuôi mới để mở rộng điều tra.\n\nRework cần sự kiện phát sinh và tiêu hao riêng, kể cả khi giữ batch gốc. Thuật toán duyệt ghi nhận các ID đã thăm để không lặp vô hạn nhưng vẫn đi đủ các nhánh liên quan.\n\nUtility/CIP gắn thiết bị, line và khoảng thời gian ảnh hưởng. Đây là quan hệ điều kiện sản xuất, phân biệt với dòng vật liệu định lượng. PM có thể cân đối theo cái/cuộn, không cộng với kg cà phê.\n\n## Mass balance gắn công đoạn\n\nTrạng thái luôn phân biệt Chưa đủ dữ liệu, Trong ngưỡng và Vượt ngưỡng. Không lấy ô trống thành số 0 để kết luận đã cân bằng.\n\nSau khi định nghĩa ranh giới công đoạn và quy đổi cùng basis, cân bằng có thể biểu diễn:\n\nTồn đầu + vật liệu vào = sản phẩm ra + rework ra + reject + mẫu + loss đã giải trình + tồn cuối + chênh lệch chưa giải trình.\n\nMỗi lượng chỉ thuộc một vế/phân loại trong cùng phạm vi. Công đoạn biến đổi cần phương pháp theo GC hoặc dry solid được QA xác nhận. Balance bao bì và utility không dùng chung công thức cà phê. Chuyển nội bộ bị loại khỏi tổng thu/chi khi tổng hợp toàn phạm vi, tránh đếm hai lần.\n\nTách hai kiểm tra: balance bên trong công đoạn và đối chiếu lượng bàn giao giữa hai công đoạn. Không dùng sai lệch dương của công đoạn này bù cho sai lệch âm của công đoạn khác để kết luận tất cả đạt.\n\nMass Balance và báo cáo lấy dữ liệu từ phiếu công đoạn đã chọn phiên bản. Không yêu cầu nhập lại cùng số liệu ở ba tab. Dữ liệu mass/trace cũ giữ nguyên để đối chiếu cho đến khi map và kiểm chứng xong, không tự ghi đè.\n\n## Trách nhiệm\n\nPIC công đoạn nhập và xác nhận dữ liệu thuộc phạm vi của mình. Đại diện công đoạn nhận xác nhận liên kết bàn giao. QA theo dõi điểm thiếu, yêu cầu bổ sung, xác minh kết quả và đóng đợt. Quản trị cấu hình process, danh bạ và quy tắc có hiệu lực.\n\nNếu giữ bản offline một máy, các tên PIC là thông tin nghiệp vụ do người vận hành khai báo, chưa phải tài khoản được xác thực. Nếu mỗi người nhập trên máy riêng vào dữ liệu chung, cần xác thực, phân quyền ghi tại server, kiểm soát phiên bản/xung đột và nhật ký.\n\n## Các bước triển khai\n\n1. Giữ sơ đồ hiện tại, thêm chọn công đoạn, PIC và phiếu nhiều đầu vào/đầu ra theo mẻ.\n2. Thêm liên kết từ dòng nguồn, đối chiếu lượng và truy ngược/xuôi từ đối tượng được chọn.\n3. Tính balance theo công đoạn và sinh báo cáo từ cùng dữ liệu, kèm migration/đối chiếu dữ liệu cũ.\n4. Hoàn thiện nhập theo đại diện theo mô hình chia sẻ được người dùng chọn; không mô tả LocalStorage riêng trên mỗi máy là dữ liệu dùng chung.\n\n## Nghiệm thu tối thiểu\n\n- Hai nguồn vào một mẻ, một đầu ra chia sang hai mẻ: truy ngược/xuôi đủ đường và không nhân đôi lượng.\n- Chọn giữa quy trình vẫn truy được cả nguồn lẫn đích.\n- Hai batch trùng chuỗi nhưng khác material/site được phân biệt.\n- Rework qua nhiều thế hệ không làm mất liên kết hay lặp vô hạn.\n- Utility có sự cố theo thời gian chỉ tạo liên kết ảnh hưởng với các mẻ phù hợp.\n- Công đoạn có số liệu thiếu không đạt balance; chuyển giao lệch lượng được cảnh báo riêng.\n- Sửa dữ liệu nguồn đánh dấu các kết quả phụ thuộc cần kiểm tra lại; báo cáo đã đóng giữ phiên bản cũ.\n- Bản import/dữ liệu cũ không bị ghi đè hay nối lô tự động thiếu căn cứ.\n",
    "DE_XUAT_CAI_TIEN_TRUY_XUAT.md": "# Đề xuất cải tiến ứng dụng truy xuất iLD Coffee\n\nNgày đánh giá: 07/10/2026. Phạm vi: đọc và đề xuất, chưa thay đổi ứng dụng.\n\n## 1. Cơ sở đánh giá\n\nĐã đọc 6 file trong thư mục dự án: `index.html`, `HANDOFF.md` và 4 PowerPoint, tổng cộng 63 slide. Với PowerPoint, đã trích nội dung slide, notes, SmartArt và xem các hình/sơ đồ nhúng liên quan. Không coi các tài liệu Excel/Word/PDF chỉ được nhắc đến trong handoff là tài liệu đã kiểm chứng.\n\n| Nguồn | Nội dung dùng để đánh giá |\n|---|---|\n| iLD_Traceability System Training - Copy.pptx, 20 slide | Phạm vi, 4 tiêu chí hiệu quả, trách nhiệm, hồ sơ, mã lô, nhánh liquid/powder và rework |\n| iLD_Traceability requirements & Batch coding regulation.pptx, 14 slide | Quy tắc định danh, yêu cầu liên kết và cân bằng khối lượng |\n| iLD_Traceability Kick Off.pptx, 24 slide | Mục tiêu, luồng triển khai và các hướng truy xuất; có nội dung FB mapping cần phân biệt với yêu cầu truy xuất |\n| Traceability Flowchart.pptx, 5 slide | Truy xuôi RM, PM, phụ liệu và truy ngược, gồm nhánh rework/other site |\n| index.html | Mã nguồn thực tế, mô hình dữ liệu, tính toán và xuất báo cáo |\n| HANDOFF.md | Ý định thiết kế, ràng buộc offline, công thức tham chiếu và hướng bàn giao |\n\nHandoff chưa theo kịp mã hiện tại: ghi tên file `iLD_Traceability_App.html`, 8 tab và giao diện xanh; thực tế là `index.html`, 9 tab gồm Process Flow, giao diện Crafted có tùy chỉnh. Handoff gọi mass balance là fixed stage, nhưng HTML cho thêm/xóa dòng công đoạn. Cần cập nhật handoff cùng mỗi phiên bản.\n\nCác mốc 4 giờ, ngưỡng 0,5%, tần suất 2 đợt/năm và lưu 5 năm được xem là cấu hình/yêu cầu đang thể hiện trong tài liệu hoặc app. Báo cáo này không xác nhận chúng là yêu cầu chung của mọi phiên bản tiêu chuẩn hiện hành.\n\n## 2. Nguyên tắc nghiệp vụ cần giữ\n\nMột đợt truy xuất cần trả lời được: vật liệu đến từ đâu, đã đi qua quá trình nào, nằm ở đâu hoặc giao cho ai, bao nhiêu và chứng cứ nào xác nhận.\n\n- Truy ngược từ FGs/pallet tới bán thành phẩm, GC, PM, phụ liệu, nhà cung cấp và điều kiện sản xuất liên quan.\n- Truy xuôi từ RM/PM/phụ liệu tới mọi lô đầu ra, rework, tồn kho, hàng giữ lại và khách hàng bị ảnh hưởng.\n- Quan hệ thực tế có nhiều đầu vào và nhiều đầu ra: trộn lô, chia lô, đóng gói lại, chuyển bồn, dùng một phần lô, tái sử dụng rework.\n- Nhánh liquid kết thúc sau evaporation và filling; nhánh powder đi qua freeze drying. Checklist và balance phải phù hợp nhánh thực tế.\n- Hồ sơ utility, CIP, vệ sinh, CCP/OPRP cần gắn với thiết bị và khoảng thời gian sản xuất liên quan. Có đủ tên biểu mẫu chưa chứng minh chúng thuộc đúng lô.\n- Chuyển kho là thay đổi vị trí của cùng lượng vật liệu. Không tính thành một đầu ra sản phẩm mới khi tổng hợp toàn nhà máy.\n- Hiệu quả gồm đủ bốn tiêu chí trong training: thời gian, đầy đủ hồ sơ, liên kết rõ, số lượng hợp lý.\n\n## 3. Các điểm cần sửa trước khi mở rộng\n\n| Ưu tiên | Phát hiện từ HTML | Ảnh hưởng và đề xuất |\n|---|---|---|\n| P0 | `evalExercise`, dòng 949: `cs.miss===0 && cs.done>0` | Ô chưa đánh dấu không tính là thiếu. Cần mọi hồ sơ bắt buộc được xác minh, N/A có lý do và người chấp nhận. |\n| P0 | Báo cáo dòng 1771 và Excel dòng 1927 dùng `cs.done>0` cho liên kết công đoạn | Có một hồ sơ đã được xem là liên kết rõ. Tạo tiêu chí `linksOk` độc lập, kiểm tra định danh đầu vào/đầu ra và chứng cứ từng liên kết. |\n| P0 | `pass` chỉ kết hợp ba biến ở dòng 951 | Bổ sung kiểm tra liên kết vào đánh giá tổng. Phân biệt chưa đủ dữ liệu, không đạt và đạt. |\n| P0 | Dòng 938: unknown deviation dựa vào tích hai tỷ lệ thu hồi | Hai sai lệch ngược chiều có thể bù trừ. Giữ chỉ số ILD để đối chiếu, bổ sung kiểm soát từng nhóm/công đoạn với ngưỡng QA phê duyệt. |\n| P0 | `hasData` chỉ kiểm tra input Stage 1 và output dòng cuối Stage 1 | Có thể đánh giá đạt khi thiếu cầu nối Extraction. Xác định dữ liệu bắt buộc theo tuyến sản phẩm, cùng đơn vị và phạm vi thời gian. |\n| P0 | Balance lấy input dòng đầu, output dòng cuối; UI cho thêm/xóa | Thêm dòng sau FGs làm đổi điểm kết thúc tính toán; xóa hết dòng gây lỗi. Dùng vai trò công đoạn/ID ổn định và bảo vệ điểm đầu/cuối. |\n| P1 | Báo cáo dòng 1753, Excel dòng 1910 lấy ngày đợt truy xuất làm Receipt / Prod date | Thêm trường ngày nhận/ngày sản xuất thật. Không suy từ ngày diễn tập. |\n| P1 | `settings.devLimit` không phải ngưỡng mà `massCalc` sử dụng | Thống nhất cấu hình; chụp ngưỡng và phiên bản quy tắc vào từng đợt để thay cài đặt không đổi kết quả lịch sử. |\n| P1 | Email nói giờ bắt đầu tính khi gửi yêu cầu; app bắt đầu khi bấm nút | Lưu riêng thời điểm gửi được người dùng xác nhận, thời điểm nhận đủ và thời điểm QA xác minh. Tạo .eml chưa chứng minh thư đã gửi. |\n| P1 | Đợt đóng vẫn sửa được; log tối đa 500 dòng, không có trước/sau | Tạo phiên bản đóng, ghi lý do mở lại, người thao tác và thay đổi. LocalStorage không tạo audit trail chống sửa. |\n| P1 | Restore chỉ kiểm tra `exercises` và `catalog` rồi thay DB | Kiểm schema, migrate dữ liệu trước khi dùng, xem trước dữ liệu nhập, giữ bản sao trước phục hồi và báo lỗi lưu rõ ràng. |\n| P1 | `Ex.duplicate` giữ số liệu trace/mass/CAPA của đợt cũ | Tách “tạo từ mẫu” khỏi “sao chép dữ liệu”; mặc định không mang chứng cứ và số liệu cũ vào đợt mới. |\n| P2 | Nút FGs sau FD/F&P mang nhãn Liquid ở dòng 2030 | Đối chiếu và sửa thành Powder theo training; Process Flow hiện là sơ đồ chung, chưa liên kết dữ liệu lô. |\n\nĐã chạy kiểm tra trực tiếp hàm JavaScript trong môi trường Node cô lập, không nạp dữ liệu người dùng:\n\n1. Checklist gồm 1 mục Có và 1 mục chưa đánh dấu, thời gian hợp lệ, balance hai nhóm 100%: `pct=50`, `complete=true`, `pass=true`, dù `solidFromExtraction` trống.\n2. Stage 1 thu hồi 80%, Stage 2 thu hồi 125%: `unknownDev` gần 0% do tích bằng 1.\n3. Stage 1 rỗng: lỗi đọc thuộc tính `input` của `undefined`.\n\nĐây là kiểm tra logic có mục tiêu, chưa phải nghiệm thu toàn bộ giao diện hay xác nhận công thức Excel gốc.\n\n## 4. Thiết kế chức năng nên phát triển\n\n### A. Hồ sơ lô và mạng liên kết lô\n\nTạo ô tìm kiếm chung theo batch, material, PO hoặc SSCC. Kết quả mở một hồ sơ lô có nguồn gốc, sản xuất, chứng cứ, số lượng, vị trí, trạng thái chất lượng và nơi giao hàng. Cho chọn truy xuôi hoặc truy ngược trên cùng dữ liệu.\n\nProcess Flow giữ vai trò mô tả quy trình chuẩn. Bổ sung chế độ “Luồng của lô này”, sinh từ giao dịch thực tế, tô rõ điểm thiếu chứng cứ hoặc chưa xác minh. Không cho thao tác kéo mũi tên sơ đồ quy trình tự thay quan hệ nguồn gốc hàng hóa.\n\nMô hình tối thiểu:\n\n| Đối tượng | Trường chính |\n|---|---|\n| Lot | ID nội bộ, site, material, batch gốc, batch nhà cung cấp, ngày sản xuất/hạn dùng, loại vật liệu, thuộc tính chứng nhận |\n| Handling unit | SSCC hoặc mã bin/bag/pallet, lot, lượng, đơn vị, vị trí |\n| Event | ID, loại nhận/chuyển/tiêu hao/sản xuất/đóng gói/rework/xuất hàng, thời gian, thiết bị, PO, nguồn dữ liệu |\n| Event input/output | Event ID, lot/unit ID, lượng, đơn vị, cơ sở quy đổi; nhiều dòng mỗi phía |\n| Evidence | ID hồ sơ, phiên bản, lô/event/thiết bị liên quan, thời gian áp dụng, người kiểm, trạng thái xác minh |\n| Shipment | Delivery, khách hàng/địa điểm nhận, pallet, lượng giao, thời gian, container và chứng từ |\n| Exercise | Phạm vi, kịch bản, các lô gốc, quy tắc chụp tại thời điểm bắt đầu, đánh giá và bản báo cáo đóng |\n\nLưu số lượng ở dòng input/output của sự kiện để tránh nhân đôi khi một sự kiện có nhiều lô đầu vào và đầu ra. Nếu hồ sơ chưa cho biết cách phân bổ, chỉ ghi nhận quan hệ có thể ảnh hưởng, không tự chia lượng theo tỷ lệ giả định.\n\nMô hình này có thể tham khảo TransformationEvent của GS1 EPCIS, vốn mô tả nhiều đối tượng tiêu hao đầu vào và sản phẩm đầu ra. Đây là hướng thiết kế, chưa phải cam kết triển khai đầy đủ chuẩn: https://ref.gs1.org/epcis/TransformationEvent\n\n### B. Rework và phạm vi ảnh hưởng\n\nLưu lần phát sinh rework, lô nguồn, loại wet/dry, lượng, vị trí, trạng thái cho phép sử dụng, lần tiêu hao và lô nhận. Theo dõi rework qua nhiều thế hệ. Nếu downgraded giữ batch cũ theo quy định, vẫn cần ID nội bộ cho từng lần phát sinh/tiêu hao để phân biệt sự kiện.\n\nKhi xác định nguyên nhân ở một lô RM từ truy ngược, cho truy xuôi tiếp từ lô RM đó để tìm các lô thành phẩm khác cùng dùng nguồn này. Tách phạm vi “đã xác nhận” và “có thể ảnh hưởng do thiếu liên kết”. QA quyết định loại trừ dựa trên chứng cứ.\n\n### C. Mass balance có cơ sở tính rõ\n\n- Mỗi dòng phải có đơn vị và basis: kg GC, kg roasted, kg liquid, kg dry solid, kg FG hoặc số lượng bao bì.\n- Nhập kết quả solid/moisture và nguồn kiểm nghiệm khi áp dụng; 0,84 và 0,97 là hệ số có phiên bản, không mặc định đúng cho mọi lô.\n- Tách balance vật liệu cà phê, balance bao bì, balance tồn kho và balance thành phẩm xuất hàng.\n- Xác định tồn đầu/cuối, nhận vào/đưa ra, tiêu hao, sản xuất, lấy mẫu, reject và mất mát trong cùng phạm vi. Không cộng tồn của nhiều thời điểm thành tồn cuối.\n- Không tính rework vừa là output loại ra vừa là loss; phân biệt rework phát sinh với rework cấp trở lại quá trình.\n- Kiểm tra thiếu dữ liệu, số âm không hợp lệ, output lý thuyết không dương, tỷ lệ bất thường và khoảng thời gian không trùng.\n- Chỉ cộng hoặc so sánh số lượng sau khi quy về cùng basis. `inQty − outQty` hiện tại không đủ ý nghĩa khi so GC với powder hay liquid có nồng độ khác.\n\nĐiểm cần QA xác nhận từ Excel gốc: `reworkAddSolid` được chú thích basis solid nhưng code tính `(FG + reworkAddSolid) × fgSolid`. Nếu giá trị rework đã là dry solid thì cách quy đổi khác với trường hợp nó là kg sản phẩm. Chưa tự đổi công thức khi chưa kiểm chứng định nghĩa.\n\n### D. Thu thập hồ sơ theo trách nhiệm\n\nChecklist được sinh theo loại đối tượng RM/PM/phụ liệu, nhánh liquid/powder, organic và kịch bản. Cho trạng thái Chưa yêu cầu, Đã yêu cầu, Đã nhận, Cần bổ sung, Đã xác minh, N/A có lý do.\n\nMỗi yêu cầu có người phụ trách, hạn xử lý và chứng cứ. Dashboard ưu tiên việc còn thiếu và lô chưa nối được. Email sinh theo vai trò/danh bạ thay cho tên người cố định; loại bỏ nội dung cố định như “TIP 2 mẻ này” khi không phù hợp phạm vi.\n\nBản offline có thể xuất gói yêu cầu theo bộ phận và nhập phản hồi bằng file có cấu trúc. Không mô tả thao tác xuất email là gửi thư, hoặc nhập phản hồi là xác minh QA tự động.\n\n### E. Thu hồi, phê duyệt và CAPA\n\nTừ các lô ảnh hưởng, tổng hợp số lượng theo trạng thái: tồn tại nhà máy, đang vận chuyển, đã giao, đã trả/thu hồi, đã hủy và chưa xác định. Tránh đếm lại cùng pallet qua nhiều lần chuyển.\n\nHiển thị riêng “đề nghị hold” và “đã xác nhận hold trong hệ thống kho”. App offline không tự chặn xuất hàng trong SAP. Mọi hành động vận hành phải có xác nhận thực hiện và chứng cứ.\n\nCAPA nên là danh sách có vấn đề, nguyên nhân, hành động, PIC, hạn hoàn thành và xác minh hiệu lực. Báo cáo đóng lưu phiên bản dữ liệu, kết quả từng tiêu chí, người lập/soát/duyệt và danh mục chứng cứ.\n\n### F. Thu thập dữ liệu tại hiện trường\n\nƯu tiên import CSV từ nguồn xuất SAP được phê duyệt, có xem trước mapping, phát hiện trùng và danh sách dòng lỗi. Import lại cùng một giao dịch không tạo giao dịch mới. Ghi nguồn file, số chứng từ và thời điểm nhập.\n\nSau đó bổ sung quét barcode/SSCC tại nhận hàng, cấp liệu, tạo bin/pallet và xuất kho. Màn hình từng điểm chỉ hỏi các trường cần thiết: quét nguồn, quét đích/PO, số lượng và xác nhận. Chất lượng liên kết vẫn phụ thuộc ghi nhận đúng thời điểm và đúng giao dịch.\n\n## 5. Quy tắc mã lô cần làm rõ\n\n- Requirements slide 11 mô tả GC có hậu tố N/R/G; tổng thành phần là 10 ký tự dù câu mô tả nói 9.\n- Training slide 15 dùng GC + YY + DDD + NN, tổng 9 ký tự và không có hậu tố.\n- Quy tắc incoming dùng `\u003c10` và `>10`, chưa nêu rõ trường hợp đúng 10 ký tự.\n- Finished/semi dùng một chữ số năm và 4 số cuối PO; không nên coi chuỗi batch là khóa duy nhất toàn hệ thống qua nhiều thập kỷ/material/site.\n\nĐề xuất lưu nguyên mã nguồn và ID nội bộ riêng. Bộ kiểm mã lô có phiên bản, ngày hiệu lực, loại vật liệu và ví dụ đã được QA/WH thống nhất. Trong giai đoạn chuyển tiếp, cảnh báo quy tắc chưa rõ thay vì tự sửa mã lịch sử.\n\n## 6. Lộ trình và điều kiện nghiệm thu\n\n| Bước | Phạm vi | Điều kiện hoàn thành |\n|---|---|---|\n| 1. Tin cậy bản offline | Sửa đánh giá, dữ liệu bắt buộc, ngày báo cáo, ngưỡng, hàng đầu/cuối balance, restore, handoff | Các trường hợp P0 không còn đạt sai hoặc làm app lỗi; dữ liệu cũ migrate được; HTML/Excel cùng kết quả |\n| 2. Truy xuất dựa trên giao dịch | Lot/event, import CSV, nhiều đầu vào/đầu ra, rework, chứng cứ, sơ đồ theo lô | Tái dựng một đợt thật, so với hồ sơ gốc, không thiếu lô và không đếm trùng |\n| 3. Điều phối QA | Yêu cầu theo PIC, phạm vi ảnh hưởng, hold có xác nhận, CAPA, báo cáo có phiên bản | Diễn tập RM, PM, rework và khiếu nại; xác định được lượng/vị trí/khách hàng và điểm thiếu chứng cứ |\n| 4. Dùng chung tại nhà máy | Server nội bộ, DB tập trung, tài khoản, phân quyền, chứng cứ, đồng bộ và quét tại điểm phát sinh | Kiểm thử đồng thời, mất kết nối, nhập trùng, xung đột, phục hồi backup và giới hạn truy cập |\n\nBước 1–3 có thể triển khai tăng dần trong bản HTML offline, với quy mô phù hợp LocalStorage và chứng cứ quản lý ngoài ứng dụng. Muốn lưu nhiều file chứng cứ hoặc nhiều người cập nhật trực tiếp cần thay đổi kiến trúc. Server nội bộ vẫn có thể hoạt động không cần Internet, nhưng khác ràng buộc một HTML/LocalStorage của handoff. Chưa thay đổi ràng buộc này trong lần đánh giá.\n\nBộ tình huống nghiệm thu cần có: 2 GC trộn thành 1 bán thành phẩm; 1 bán thành phẩm chia nhiều FGs; 1 PM dùng nhiều PO; rework từ A sang B rồi C; một pallet giao một phần; chuyển kho nhiều lần; liquid không qua FD; utility có sự cố trong một khoảng thời gian; thiếu hồ sơ; N/A không lý do; nhập trùng; restore bản cũ; sửa cấu hình sau khi đóng đợt.\n\nKPI nên đo sau khi có đường cơ sở: thời gian xác định phạm vi ảnh hưởng, tỷ lệ giao dịch có liên kết hợp lệ, thời gian chờ từng PIC, tỷ lệ chứng cứ được xác minh, lượng chưa giải trình, lỗi nhập liệu, tỷ lệ CAPA đúng hạn và tỷ lệ phục hồi backup thành công. Tách diễn tập với sự cố thật và chỉ tính tỷ lệ đạt trên tập đợt đã kết thúc phù hợp.\n\n## 7. Khuyến nghị triển khai\n\nƯu tiên sửa P0, rồi xây liên kết lô và import dữ liệu. Đây là nền tảng cho sơ đồ tương tác, quét mã và thu hồi có phạm vi rõ. Phần nhận diện giao diện hiện tại đã đủ để tiếp tục; lợi ích lớn hơn nằm ở giảm nhập lại, phát hiện đứt liên kết và bảo đảm kết luận dựa trên chứng cứ.\n\nCác nội dung cần chốt trước khi lập trình quy tắc nghiệp vụ: SOP mã lô hiện hành, Excel balance gốc và đơn vị rework, nguồn xuất SAP, phạm vi pilot, người xác minh từng loại hồ sơ và tiêu chí chấp nhận cho từng tuyến sản phẩm.\n",
    "tests/test_lan.py": "import copy\nimport json\nimport sys\nimport tempfile\nimport threading\nimport unittest\nimport uuid\nimport urllib.error\nimport urllib.request\nfrom concurrent.futures import ThreadPoolExecutor\nfrom pathlib import Path\nsys.path.insert(0,str(Path(__file__).resolve().parents[1]/'lan'))\nfrom server import Store, Problem, balance, handler, ThreadingHTTPServer\n\n\nclass TraceTests(unittest.TestCase):\n    def setUp(self):\n        self.tmp=Path(__file__).resolve().parents[1]/'.test-output'/uuid.uuid4().hex\n        self.tmp.mkdir(parents=True)\n        self.store=Store(self.tmp/'test.sqlite3')\n        self.admin=self.store.create_user(None,dict(username='qa',name='QA',password='test-password-only',role='admin',stages=[]))\n        self.op=self.store.create_user(self.admin,dict(username='roa',name='ROA',password='test-password-only',role='operator',stages=['roasting']))\n        self.case=self.store.create_case(self.admin,{'name':'Test'})['id']\n\n    def tearDown(self):\n        pass  # Keep test artifacts inside the ignored, known workspace directory.\n\n    def data(self,stage='roasting',title='Mẻ A',qty=100):\n        def line(ident,kind):\n            return dict(id=ident,material='COFFEE',batch='BATCH-A',sscc='',location='',qty=qty,unit='kg',basis='solid',factor=1,factorEvidence='Same dry solid',kind=kind)\n        return dict(stage=stage,title=title,po='PO-1',pic=self.admin['id'],equipment='LINE-1',start='2026-10-07T08:00',end='2026-10-07T09:00',\n            evidence='DOC-1',note='',customer='',limit=.5,limitReason='Test SOP',inputs=[line('in','external')],outputs=[line('out','product')],contexts=[])\n\n    def save(self,data,old=None,user=None):\n        return self.store.save_event(user or self.admin,{'id':old['id'] if old else None,'version':old['version'] if old else 0,'caseId':self.case,'data':data})\n\n    def get(self,ident):\n        return next(e for e in self.store.state(self.admin,self.case)['events'] if e['id']==ident)\n\n    def linked(self,source,qty=100,title='B'):\n        data=self.data('extraction',title,qty)\n        data['inputs'][0].update(kind='linked',sourceEvent=source['id'],sourceLine='out')\n        return data\n\n    def verify(self,event):\n        self.store.transition(self.admin,dict(id=event['id'],version=self.get(event['id'])['version'],action='submit'))\n        self.store.transition(self.admin,dict(id=event['id'],version=self.get(event['id'])['version'],action='verify'))\n\n    def test_permissions_and_login(self):\n        login=self.store.login(dict(username='roa',password='test-password-only'),'local')\n        self.assertEqual(self.store.authenticate(login['token'])['id'],self.op['id'])\n        with self.assertRaises(Problem): self.store.authenticate('invalid')\n        self.save(self.data(),user=self.op)\n        with self.assertRaises(Problem) as e:self.save(self.data('packing'),user=self.op)\n        self.assertEqual(e.exception.status,403)\n        with self.assertRaises(Problem):self.store.create_case(self.op,{'name':'no'})\n        with self.assertRaises(Problem):self.store.create_user(self.op,dict(username='bad',name='bad',password='test-password-only',role='admin',stages=[]))\n\n    def test_conflict_and_concurrent_writers(self):\n        event=self.save(self.data())\n        def update(i):\n            data=self.data(title='writer '+str(i))\n            try: self.save(data,event); return 200\n            except Problem as e:return e.status\n        with ThreadPoolExecutor(2) as pool: results=list(pool.map(update,[1,2]))\n        self.assertEqual(sorted(results),[200,409])\n\n    def test_allocation_atomic_and_split(self):\n        src=self.save(self.data())\n        self.save(self.linked(src,60))\n        self.save(self.linked(src,40,'C'))\n        with self.assertRaises(Problem):self.save(self.linked(src,1,'D'))\n        self.assertEqual(len(self.store.state(self.admin,self.case)['events']),3)\n\n    def test_concurrent_allocation(self):\n        src=self.save(self.data())\n        def consume(i):\n            try:self.save(self.linked(src,60,str(i))); return 200\n            except Problem as e:return e.status\n        with ThreadPoolExecutor(2) as pool:results=list(pool.map(consume,[1,2]))\n        self.assertEqual(sorted(results),[200,409])\n\n    def test_source_cannot_delete_or_rename_allocated_output(self):\n        src=self.save(self.data());self.save(self.linked(src))\n        d=self.data();d['outputs']=[]\n        with self.assertRaises(Problem):self.save(d,src)\n        d=self.data();d['outputs'][0]['batch']='NEW'\n        with self.assertRaises(Problem):self.save(d,src)\n\n    def test_cycle_rejected(self):\n        a=self.save(self.data());b=self.save(self.linked(a))\n        d=self.linked(b);d['stage']='roasting'\n        with self.assertRaises(Problem):self.save(d,a)\n\n    def test_balance_missing_and_basis_separation(self):\n        d=self.data();d['inputs'][0]['factor']=None\n        self.assertEqual(balance(d)['state'],'incomplete')\n        d=self.data();d['outputs'][0]['qty']=99\n        self.assertEqual(balance(d)['state'],'deviation')\n        d=self.data();d['outputs'][0]['basis']='product'\n        self.assertEqual(balance(d)['state'],'deviation')\n        d=self.data();d['inputs'][0]['qty']=-1\n        with self.assertRaises(Problem):self.save(d)\n        d=self.data();d['outputs'][0]['qty']=float('nan')\n        with self.assertRaises(Problem):self.save(d)\n\n    def test_verification_dependencies_and_invalidation(self):\n        a=self.save(self.data());b=self.save(self.linked(a))\n        self.store.transition(self.admin,dict(id=b['id'],version=b['version'],action='submit'))\n        with self.assertRaises(Problem):self.store.transition(self.admin,dict(id=b['id'],version=self.get(b['id'])['version'],action='verify'))\n        self.verify(a)\n        self.store.transition(self.admin,dict(id=b['id'],version=self.get(b['id'])['version'],action='verify'))\n        with self.assertRaises(Problem):self.save(self.data(),self.get(a['id']))\n        self.store.transition(self.admin,dict(id=a['id'],version=self.get(a['id'])['version'],action='reopen',reason='Check record'))\n        self.assertEqual(self.get(b['id'])['status'],'needs_review')\n\n    def test_utility_dependency(self):\n        u=self.data('utility');u['inputs']=[];u['outputs']=[]\n        source=self.save(u);self.verify(source)\n        d=self.data();d['contexts']=[source['id']]\n        e=self.save(d);self.verify(e)\n        self.store.transition(self.admin,dict(id=source['id'],version=self.get(source['id'])['version'],action='reopen',reason='CIP changed'))\n        self.assertEqual(self.get(e['id'])['status'],'needs_review')\n\n    def test_closed_snapshot_and_audit(self):\n        e=self.save(self.data());self.verify(e)\n        self.store.close_case(self.admin,dict(id=self.case,version=1))\n        export=self.store.export(self.admin,self.case)\n        self.assertEqual(export['events'][0]['status'],'verified')\n        with self.assertRaises(Problem):self.save(self.data(),self.get(e['id']))\n        with self.store.connect() as db:\n            self.assertGreater(db.execute('SELECT COUNT(*) FROM history').fetchone()[0],4)\n            out=self.tmp/'backup.sqlite3'\n            import sqlite3\n            with sqlite3.connect(out) as dest:db.backup(dest)\n        self.assertEqual(Store(out).export(self.admin,self.case),export)\n\n    def test_http_auth_origin_and_no_database_static(self):\n        server=ThreadingHTTPServer(('127.0.0.1',0),handler(self.store));thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()\n        base='http://127.0.0.1:'+str(server.server_address[1])\n        try:\n            with urllib.request.urlopen(base+'/') as r:self.assertIn('Process Flow',r.read().decode())\n            with self.assertRaises(urllib.error.HTTPError) as e:urllib.request.urlopen(base+'/api/state')\n            self.assertEqual(e.exception.code,401)\n            req=urllib.request.Request(base+'/api/login',data=json.dumps(dict(username='qa',password='test-password-only')).encode(),headers={'Content-Type':'application/json','Origin':'http://evil.invalid'})\n            with self.assertRaises(urllib.error.HTTPError) as e:urllib.request.urlopen(req)\n            self.assertEqual(e.exception.code,403)\n            login=self.store.login(dict(username='qa',password='test-password-only'),'local')\n            req=urllib.request.Request(base+'/data/traceability.sqlite3',headers={'Authorization':'Bearer '+login['token']})\n            with self.assertRaises(urllib.error.HTTPError) as e:urllib.request.urlopen(req)\n            self.assertEqual(e.exception.code,404)\n        finally:\n            server.shutdown();server.server_close();thread.join()\n\n\nif __name__=='__main__':unittest.main()\n",
    "tests/serve_fixture.py": "\"\"\"Disposable local fixture for browser tests; never use for factory data.\"\"\"\nimport sys\nimport uuid\nfrom pathlib import Path\nsys.path.insert(0,str(Path(__file__).resolve().parents[1]/'lan'))\nfrom server import Store, ThreadingHTTPServer, handler\nroot=Path(__file__).resolve().parents[1]\nstore=Store(root/'.test-output'/('browser-'+uuid.uuid4().hex)/'test.sqlite3')\nadmin=store.create_user(None,dict(username='test-qa',name='QA kiểm thử',password='browser-test-only-2026',role='admin',stages=[]))\nstore.create_user(admin,dict(username='test-roa',name='Đại diện Roasting',password='browser-test-only-2026',role='operator',stages=['roasting']))\nstore.create_case(admin,{'name':'KIỂM THỬ · Không phải dữ liệu nhà máy'})\nserver=ThreadingHTTPServer(('127.0.0.1',8097),handler(store))\nprint('Fixture http://127.0.0.1:8097',flush=True)\ntry:server.serve_forever()\nfinally:server.server_close()\n",
    "tests/browser_lan.cjs": "const assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst {chromium}=require(process.env.PLAYWRIGHT_MODULE||'playwright');\n(async()=>{\n const browser=await chromium.launch({headless:true,channel:process.env.BROWSER_CHANNEL||'chrome'});\n try{\n  const page=await browser.newPage({viewport:{width:1600,height:1000}}),errors=[];\n  page.on('pageerror',e=>errors.push(e.message));\n  await page.goto('http://127.0.0.1:8097');\n  await page.locator('#login-form [name=username]').fill('test-qa');\n  await page.locator('#login-form [name=password]').fill('browser-test-only-2026');\n  await page.locator('#login-form button').click();\n  await page.locator('#app').waitFor({state:'visible'});\n  assert.equal(await page.locator('[data-stage]').count(),13);\n  await page.locator('[data-stage=roasting]').click();\n  await page.locator('#add-event').click();\n  await page.locator('[name=title]').fill('ROA-TEST');\n  await page.locator('[name=po]').fill('PO-100');\n  await page.locator('[name=start]').fill('2026-10-07T08:00');\n  await page.locator('[name=end]').fill('2026-10-07T09:00');\n  await page.locator('[name=evidence]').fill('TEST RECORD');\n  await page.locator('[name=limitReason]').fill('TEST SOP');\n  for(const side of ['inputs','outputs']){\n   for(const [key,value] of Object.entries({material:'COFFEE',batch:'BATCH-ROA',qty:'100',factor:'1',factorEvidence:'dry solid'}))\n    await page.locator(`[name=\"${side}.0.${key}\"]`).fill(value);\n  }\n  await page.locator('#event-form button[type=submit]').click();\n  await page.getByText('Đang xem dữ liệu đã lưu trên server',{exact:true}).waitFor();\n  await page.locator('[data-transition=submit]').click();\n  await page.locator('[data-transition=verify]').waitFor();\n  await page.locator('[data-transition=verify]').click();\n  await page.locator('[data-transition=reopen]').waitFor();\n  const sourceId=await page.evaluate(()=>selected);\n  await page.locator('[data-stage=extraction]').click();\n  await page.locator('#add-event').click();\n  await page.locator('[name=title]').fill('EXT-TEST');\n  await page.locator('[name=\"inputs.0.kind\"]').selectOption('linked');\n  await page.locator('[name=\"inputs.0.source\"]').selectOption({index:1});\n  assert.equal(await page.locator('[name=\"inputs.0.batch\"]').inputValue(),'BATCH-ROA');\n  for(const [key,value] of Object.entries({qty:'60',factor:'1',factorEvidence:'dry solid'}))await page.locator(`[name=\"inputs.0.${key}\"]`).fill(value);\n  for(const [key,value] of Object.entries({material:'EXTRACT',batch:'EXT-BATCH',qty:'60',factor:'1',factorEvidence:'dry solid'}))await page.locator(`[name=\"outputs.0.${key}\"]`).fill(value);\n  await page.locator('#event-form button[type=submit]').click();\n  await page.getByText('Đang xem dữ liệu đã lưu trên server',{exact:true}).waitFor();\n  const targetId=await page.evaluate(()=>selected);\n  await page.locator('#trace-current').click();\n  await page.locator('[data-dir=backward]').click();\n  assert.deepEqual((await page.evaluate(()=>[...traceSet()])).sort(),[sourceId,targetId].sort());\n  await page.locator('[data-dir=forward]').click();\n  assert.deepEqual(await page.evaluate(()=>[...traceSet()]),[targetId]);\n  await page.locator('[data-dir=both]').click();\n  // Unsaved edits survive normal background refresh and cannot be submitted.\n  await page.locator('[name=note]').fill('UNSAVED');\n  await page.evaluate(()=>load(state.case.id,{preserve:true}));\n  assert.equal(await page.locator('[name=note]').inputValue(),'UNSAVED');\n  await page.locator('[data-transition=submit]').click();\n  assert.match(await page.locator('#message').textContent(),/Lưu phiếu trước/);\n  await page.locator('#event-form button[type=submit]').click();\n  await page.getByText('Đang xem dữ liệu đã lưu trên server',{exact:true}).waitFor();\n  await page.locator('#search').fill('EXT-BATCH');\n  assert.equal(await page.locator('[data-find]').count(),1);\n  fs.mkdirSync('.test-output',{recursive:true});\n  await page.screenshot({path:'.test-output/process-flow-desktop.png',fullPage:true});\n  await page.locator('[data-view=report]').click();\n  assert.equal(await page.locator('.report-event').count(),2);\n  await page.locator('[data-view=audit]').click();\n  await page.locator('.audit-item').first().waitFor();\n  await page.locator('[data-view=accounts]').click();\n  await page.locator('#user-form [name=username]').fill('test-new');\n  await page.locator('#user-form [name=name]').fill('Đại diện đóng gói');\n  await page.locator('#user-form [name=password]').fill('browser-test-only-new');\n  await page.locator('#user-form [name=stage][value=packing]').check();\n  await page.locator('#user-form button[type=submit]').click();\n  await page.getByRole('cell',{name:'test-new',exact:true}).waitFor();\n  const operator=await browser.newPage();\n  await operator.goto('http://127.0.0.1:8097');\n  await operator.locator('[name=username]').fill('test-roa');\n  await operator.locator('[name=password]').fill('browser-test-only-2026');\n  await operator.locator('#login-form button').click();\n  await operator.locator('#app').waitFor({state:'visible'});\n  await operator.locator('[data-stage=packing]').click();\n  assert.equal(await operator.locator('#add-event').isDisabled(),true);\n  assert.equal(await operator.locator('#accounts-tab').isVisible(),false);\n  await operator.locator('[data-stage=roasting]').click();\n  assert.equal(await operator.locator('#add-event').isDisabled(),false);\n  await page.locator('[data-view=workspace]').click();\n  await page.setViewportSize({width:390,height:844});\n  await page.screenshot({path:'.test-output/process-flow-mobile.png',fullPage:true});\n  assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth\u003c=innerWidth),true);\n  const legacy=await browser.newPage();await legacy.goto('http://127.0.0.1:8097/legacy');\n  await legacy.locator('[data-tab=flow]').click();\n  assert.equal(await legacy.locator('iframe[title=\"Process Flow nội bộ\"]').count(),1);\n  const embedded=legacy.frameLocator('iframe[title=\"Process Flow nội bộ\"]');\n  await embedded.locator('#login-form [name=username]').fill('test-roa');\n  await embedded.locator('#login-form [name=password]').fill('browser-test-only-2026');\n  await embedded.locator('#login-form button').click();\n  await embedded.locator('#app').waitFor({state:'visible'});\n  assert.equal(await embedded.locator('[data-stage]').count(),13);\n  const offline=await browser.newPage();\n  offline.on('pageerror',e=>errors.push('offline: '+e.message));\n  const {pathToFileURL}=require('node:url');\n  await offline.goto(pathToFileURL(require('node:path').resolve('index.html')).href);\n  for(const tab of ['dashboard','exercise','email','checklist','trace','mass','report','settings','flow']){\n    await offline.locator(`[data-tab=\"${tab}\"]`).click();\n    assert.equal(await offline.locator('#tab-'+tab).isVisible(),true);\n  }\n  const preview=offline.frameLocator('iframe[title=\"Process Flow nội bộ\"]');\n  await preview.locator('#login-form button').waitFor();\n  assert.equal(await preview.locator('#login-form button').isDisabled(),true);\n  await offline.getByRole('button',{name:'Sơ đồ tham chiếu offline',exact:true}).click();\n  assert.equal(await offline.locator('#flowSvg').count(),1);\n  await offline.getByRole('button',{name:'Mở Process Flow Web',exact:true}).click();\n  assert.equal(await offline.locator('iframe').count(),1);\n  const downloading=offline.waitForEvent('download');\n  await offline.getByRole('button',{name:'Tải bộ server'}).click();\n  const downloaded=await downloading;\n  await downloaded.saveAs('.test-output/handoff-server.zip');\n  assert.deepEqual(errors,[]);\n  console.log('Browser checks passed: login, save, verify, linked input, trace directions, dirty form, search, report, audit, account creation, operator scope, mobile, legacy tab.');\n }finally{await browser.close()}\n})().catch(e=>{console.error(e);process.exitCode=1});\n",
    "tools/sync_handoff_bundle.py": "\"\"\"Refresh source-only backend attachments embedded in the single HTML handoff.\"\"\"\nimport json\nimport re\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nFILES = [\n    'lan/server.py', 'lan/README.md', 'START_WEB.cmd', 'SETUP_ADMIN.cmd',\n    'HANDOFF.md', 'HANDOFF_LEGACY.md', 'PROCESS_FLOW_DESIGN.md',\n    'DE_XUAT_CAI_TIEN_TRUY_XUAT.md', 'tests/test_lan.py',\n    'tests/serve_fixture.py', 'tests/browser_lan.cjs',\n    'tools/sync_handoff_bundle.py', '.gitignore',\n]\n\n\ndef main():\n    bundle = {'format': 'ild-source-bundle-v1', 'ui': 'index.html',\n              'files': {name: (ROOT/name).read_text(encoding='utf-8') for name in FILES}}\n    # Never enumerate directories: no database, passwords, TLS keys or browser profiles.\n    payload = json.dumps(bundle, ensure_ascii=False, indent=2).replace('\u003c', '\\\\u003c')\n    block = '\u003cscript id=\"ild-backend-bundle\" type=\"application/json\">\\n' + payload + '\\n\u003c/script>'\n    path = ROOT/'index.html'\n    source = path.read_text(encoding='utf-8')\n    pattern = r'\u003cscript id=\"ild-backend-bundle\" type=\"application/json\">[\\s\\S]*?\u003c/script>'\n    if re.search(pattern, source):\n        source = re.sub(pattern, lambda _: block, source, count=1)\n    else:\n        prefix, suffix = source.rsplit('\u003c/body>', 1)\n        source = prefix + block + '\\n\u003c/body>' + suffix\n    path.write_text(source, encoding='utf-8')\n    print('Embedded', len(FILES), 'source files; no factory data.')\n\n\nif __name__ == '__main__':\n    main()\n",
