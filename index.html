<header><div class="mark">iLD</div><div><h1>Process Flow · Truy xuất</h1><small>Dữ liệu dùng chung · Đại diện công đoạn · Liên kết lô</small></div><span class="spacer"></span><span id="identity" class="muted"></span><button id="logout" hidden>Đăng xuất</button></header>
<section id="login" class="panel"><h2>Đăng nhập nhà máy</h2><p class="muted" style="margin-top:8px">Dùng tài khoản được quản trị cấp cho công đoạn của bạn.</p><form id="login-form"><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" role="alert"></div><button class="primary" type="submit">Đăng nhập</button></form></section>
<main id="app" hidden>
<div class="toolbar"><label>Đợt truy xuất<select id="case-select"></select></label><button id="new-case">+ Đợt mới</button><span class="badge" id="case-status"></span><span class="spacer"></span><span id="sync" class="muted" aria-live="polite"></span><button id="refresh">Tải lại</button><button id="export">Xuất dữ liệu đợt</button></div>
<nav class="tabs"><button data-view="workspace" class="active">Process Flow</button><button data-view="report">Báo cáo</button><button data-view="accounts" id="accounts-tab">Tài khoản</button><button data-view="audit" id="audit-tab">Nhật ký</button></nav>
<section id="workspace" class="workspace"><div class="left"><div class="panel"><div class="row"><h2>Luồng truy xuất</h2><span class="spacer"></span><button id="clear-trace">Toàn bộ</button></div><p class="muted" style="margin-top:6px">Chọn công đoạn để nhập phiếu. Chọn mẻ, Batch hoặc SSCC để truy xuất từ điểm đó.</p><label style="margin-top:12px">Tìm Batch / PO / SSCC / mẻ<input id="search" placeholder="Nhập thông tin đã biết…" autocomplete="off"></label><div id="search-results" class="search-result"></div><div class="row" style="margin-top:10px"><button class="direction active" data-dir="both">Cả hai</button><button class="direction" data-dir="backward">Truy ngược</button><button class="direction" data-dir="forward">Truy xuôi</button></div><div id="trace-info" class="notice" hidden></div><div id="graph" class="graph"></div><div class="legend"><span><i class="line-example"></i> Tuyến tham khảo</span><span><i class="line-example actual"></i> Có giao dịch</span><span><i class="line-example context"></i> Utility / CIP</span></div><div class="filter-count" id="coverage"></div></div><div class="panel" style="margin-top:14px"><div class="row"><h2 id="stage-title">Phiếu công đoạn</h2><span class="spacer"></span><button id="add-event" class="primary">+ Phiếu</button></div><div id="event-list" class="list"></div></div></div><aside id="editor" class="panel editor"><div class="empty">Chọn công đoạn để bắt đầu.</div></aside></section>
<section id="report" class="view" hidden></section><section id="accounts" class="view" hidden></section><section id="audit" class="view" hidden></section>
</main><div id="message" role="status" hidden></div>
<script>
'use strict';
// A standalone HTML can preview the UI; shared login/data require the Python API.
if (window.parent.location.protocol === 'file:') {
  document.querySelector('#login-error').textContent='Bản xem giao diện. Chạy SETUP_ADMIN.cmd, START_WEB.cmd rồi mở http://127.0.0.1:8080 để đăng nhập và lưu dữ liệu chung.';
  document.querySelectorAll('#login-form input,#login-form button').forEach(el=>el.disabled=true);
}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
const clone=x=>JSON.parse(JSON.stringify(x));
const num=n=>n==null?'—':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:3});
const date=t=>new Date(t*1000).toLocaleString('vi-VN');
const labels={draft:'Nháp',submitted:'Chờ xác minh',verified:'Đã xác minh',needs_review:'Cần xem lại',ok:'Trong ngưỡng',deviation:'Vượt ngưỡng',incomplete:'Chưa đủ dữ liệu',not_applicable:'Điều kiện SX'};
const basisLabels={GC:'kg GC',solid:'kg dry solid',product:'kg sản phẩm',packaging:'cái bao bì'};
let token='', state=null, stage='incoming', selected='', draft=null, dirty=false, direction='both', anchor='', busy=false, currentView='workspace', pollBusy=false;
let messageTimer;
function message(t,error=false){$('#message').textContent=t;$('#message').className=error?'error':'';$('#message').hidden=false;clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('#message').hidden=true,7000)}
function badge(s){return `<span class="badge ${['verified','ok'].includes(s)?'ok':['deviation','needs_review'].includes(s)?'bad':s==='submitted'?'blue':''}">${esc(labels[s]||s)}</span>`}
function canWrite(s){return state&&state.case?.status==='open'&&(state.user.role!=='operator'||state.user.stages.includes(s))}
function isQA(){return state&&['admin','qa'].includes(state.user.role)}
async function api(path,body){const res=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const value=await res.json();if(!res.ok){if(res.status===401&&token){token='';$('#app').hidden=true;$('#login').hidden=false;$('#logout').hidden=true;$('#login-error').textContent='Session hết hạn. Đăng nhập lại; phiếu đang nhập vẫn giữ trong trang.'}throw new Error(value.error||'Lỗi kết nối')}return value}
async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){message(e.message,true)}finally{busy=false}}
function discard(){return !dirty||confirm('Phiếu có thay đổi chưa lưu. Bỏ thay đổi để tiếp tục?')}
async function load(caseId=state?.case?.id||'',options={}){const next=await api('/api/state?case='+encodeURIComponent(caseId));state=next;$('#identity').textContent=state.user.name+' · '+({admin:'Quản trị',qa:'QA',operator:'Đại diện công đoạn'}[state.user.role]);$('#case-select').innerHTML=state.cases.length?state.cases.map(c=>`<option value="${esc(c.id)}" ${c.id===state.case?.id?'selected':''}>${esc(c.name)}</option>`).join(''):'<option>Chưa có đợt</option>';$('#case-status').textContent=state.case?(state.case.status==='closed'?'Đã đóng · chỉ đọc':'Đang mở'):'';$('#new-case').hidden=!isQA();$('#accounts-tab').hidden=state.user.role!=='admin';$('#audit-tab').hidden=!isQA();$('#export').disabled=!state.case;$('#sync').textContent='Đã đồng bộ '+new Date().toLocaleTimeString('vi-VN');if(!options.preserve){const e=state.events.find(e=>e.id===selected);draft=e?clone(e):null;selected=e?.id||'';dirty=false}renderGraph();renderEvents();renderSearch();if(!options.preserve)renderEditor();if(currentView==='report')renderReport();if(currentView==='accounts')renderAccounts()}
const positions={incoming:[20,25],tipping:[255,25],roasting:[490,25],extraction:[725,25],evaporation:[725,160],liquid:[725,295],drying:[490,160],packing:[255,160],warehouse:[255,295],packaging:[20,160],ingredients:[20,295],rework:[490,295],utility:[490,430]};
const route=[['incoming','tipping'],['tipping','roasting'],['roasting','extraction'],['extraction','evaporation'],['evaporation','drying'],['drying','packing'],['packing','warehouse'],['evaporation','liquid'],['liquid','warehouse'],['packaging','packing'],['ingredients','packing']];
function edges(){const es=[];for(const e of state.events){for(const l of e.data.inputs)if(l.kind==='linked')es.push({from:l.sourceEvent,to:e.id,line:l.sourceLine,context:false});for(const c of e.data.contexts||[])es.push({from:c,to:e.id,context:true})}return es}
function traceSet(){if(!anchor)return null;const es=edges();function walk(back){const found=new Set([anchor]),pending=[anchor];while(pending.length){const n=pending.pop();for(const e of es){const from=back?e.to:e.from,to=back?e.from:e.to;if(from===n&&!found.has(to)){found.add(to);pending.push(to)}}}return found}const result=new Set([anchor]);if(direction!=='forward')for(const x of walk(true))result.add(x);if(direction!=='backward')for(const x of walk(false))result.add(x);return result}
function renderGraph(){const traced=traceSet();let svg=`<svg viewBox="0 0 970 550" role="img" aria-label="Sơ đồ công đoạn truy xuất"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>`;function edge(a,b,color,width,dash=''){if(a===b)return '';const p=positions[a],q=positions[b];if(!p||!q)return '';const x=p[0]+105,y=p[1]+48,xx=q[0]+105,yy=q[1]+48;const dx=xx-x,dy=yy-y;const horizontal=Math.abs(dx)>Math.abs(dy);const ax=x+(horizontal?Math.sign(dx)*105:0),ay=y+(horizontal?0:Math.sign(dy)*48),bx=xx-(horizontal?Math.sign(dx)*110:0),by=yy-(horizontal?0:Math.sign(dy)*53);return `<path d="M${ax},${ay} L${bx},${by}" stroke="${color}" stroke-width="${width}" ${dash?'stroke-dasharray="'+dash+'"':''} fill="none" marker-end="url(#arrow)"/>`}
for(const [a,b] of route)svg+=edge(a,b,'#ddd3c4',1.5);const drawn=new Set();for(const e of edges()){if(traced&&(!traced.has(e.from)||!traced.has(e.to)))continue;const a=state.events.find(x=>x.id===e.from),b=state.events.find(x=>x.id===e.to);if(!a||!b)continue;const key=a.data.stage+'|'+b.data.stage+'|'+e.context;if(drawn.has(key))continue;drawn.add(key);svg+=edge(a.data.stage,b.data.stage,e.context?'#925caf':'#245a9c',2.5,e.context?'5 4':'')}
for(const [key,name] of state.stages){const [x,y]=positions[key],items=state.events.filter(e=>e.data.stage===key),related=!traced||items.some(e=>traced.has(e.id)),verified=items.filter(e=>e.status==='verified').length;const pics=[...new Set(items.map(e=>state.users.find(u=>u.id===e.data.pic)?.name||'—'))];const hasBad=items.some(e=>e.balance.state==='deviation');svg+=`<g class="node ${key===stage?'selected':''} ${related?'':'dim'}" data-stage="${key}" tabindex="0" role="button" aria-label="${esc(name)}"><rect x="${x}" y="${y}" width="210" height="96" rx="9" fill="${key===stage?'#fff2dd':'white'}" stroke="#c9bca9"/><text x="${x+12}" y="${y+24}" font-size="14" font-weight="600" fill="#2a2018">${esc(name)}</text><text x="${x+12}" y="${y+46}" font-size="11" fill="#6b5842">${items.length} phiếu · ${verified} đã xác minh</text><text x="${x+12}" y="${y+65}" font-size="10" fill="#6b5842">${esc(pics.join(', ').slice(0,30)||'Chưa có phiếu')}</text><text x="${x+12}" y="${y+83}" font-size="10" fill="${hasBad?'#b42318':'#6b5842'}">${hasBad?'Có sai lệch balance':items.length?'Bấm để xem và cập nhật':'Bấm để nhập dữ liệu'}</text></g>`}svg+='</svg>';$('#graph').innerHTML=svg;$('#coverage').textContent=`${state.events.length} phiếu · ${state.events.filter(e=>e.status==='verified').length} đã xác minh · ${edges().length} liên kết`;const a=state.events.find(e=>e.id===anchor);$('#trace-info').hidden=!a;if(a){const related=state.events.filter(e=>traced.has(e.id));$('#trace-info').textContent=`Điểm bắt đầu: ${a.data.title}. ${related.length} phiếu liên quan; ${related.filter(e=>e.status!=='verified').length} chưa xác minh. Kết quả dựa trên liên kết đã nhập; nguồn chưa liên kết không được tự suy diễn.`}}
function renderEvents(){const traced=traceSet();const items=state.events.filter(e=>e.data.stage===stage&&(!traced||traced.has(e.id)));$('#stage-title').textContent=state.stages.find(s=>s[0]===stage)?.[1]||'Phiếu công đoạn';$('#add-event').disabled=!canWrite(stage);$('#event-list').innerHTML=items.length?items.map(e=>`<button class="event ${e.id===selected?'chosen':''}" data-event="${esc(e.id)}"><div class="row"><b>${esc(e.data.title)}</b>${badge(e.status)}</div><small>PO ${esc(e.data.po||'—')} · ${esc(state.users.find(u=>u.id===e.data.pic)?.name||'—')} · v${e.version}</small><div class="row" style="margin-top:5px">${badge(e.balance.state)}<span class="muted">${e.data.inputs.length} vào / ${e.data.outputs.length} ra</span></div></button>`).join(''):'<div class="empty">Chưa có phiếu trong phạm vi đang xem.</div>'}
function renderSearch(){const q=$('#search').value.trim().toLowerCase();if(!q){$('#search-results').innerHTML='';return}const found=state.events.filter(e=>[e.data.title,e.data.po,...e.data.inputs.flatMap(l=>[l.batch,l.sscc,l.material]),...e.data.outputs.flatMap(l=>[l.batch,l.sscc,l.material])].join(' ').toLowerCase().includes(q));$('#search-results').innerHTML=found.slice(0,30).map(e=>`<button class="result-button" data-find="${esc(e.id)}">${esc(e.data.title)}<small>${esc(state.stages.find(s=>s[0]===e.data.stage)?.[1])} · PO ${esc(e.data.po||'—')} · ${esc(e.data.outputs.map(l=>l.batch).join(', '))}</small></button>`).join('')||'<p class="muted">Không tìm thấy trong đợt này.</p>'}
function newLine(side){return {id:id(),material:'',batch:'',sscc:'',location:'',qty:'',unit:'kg',basis:'solid',factor:'',factorEvidence:'',kind:side==='inputs'?'external':'product'}}
function inputField(label,name,value,extra=''){return `<label>${label}<input name="${name}" value="${esc(value)}" ${extra}></label>`}
function options(values,value){return values.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}
function lineHTML(l,side,i){const prefix=side+'.'+i+'.',linked=side==='inputs'&&l.kind==='linked';const kinds=side==='inputs'?[['external','Nguồn ngoài / chưa liên kết'],['linked','Nhận từ phiếu nguồn'],['opening','Tồn đầu phạm vi']]:[['product','Sản phẩm'],['rework','Rework phát sinh'],['reject','Reject'],['sample','Lấy mẫu'],['loss','Loss đã giải trình'],['stock','Tồn cuối phạm vi']];let src='';if(linked){const pool=state.events.filter(e=>e.id!==draft.id).flatMap(e=>e.data.outputs.filter(o=>['product','rework','stock'].includes(o.kind)).map(o=>[e.id+'|'+o.id,`${e.data.title} / ${o.material} / ${o.batch} / ${num(o.qty)} ${o.unit}`]));src=`<label class="full">Chọn đầu ra nguồn<select name="${prefix}source" data-source="${i}"><option value="">— Chọn nguồn —</option>${options(pool,(l.sourceEvent||'')+'|'+(l.sourceLine||''))}</select></label>`}return `<div class="material ${linked?'source':''}"><div class="row"><b>${side==='inputs'?'Đầu vào':'Đầu ra'} ${i+1}</b><span class="spacer"></span><button type="button" class="remove danger" data-remove="${side}:${i}">Xóa dòng</button></div><div class="grid three"><label>Phân loại<select name="${prefix}kind" data-kind="${side}:${i}">${options(kinds,l.kind)}</select></label>${src}${inputField('Material',prefix+'material',l.material,linked?'readonly':'required')}${inputField('Batch',prefix+'batch',l.batch,linked?'readonly':'required')}${inputField('SSCC / Bin',prefix+'sscc',l.sscc,linked?'readonly':'')}${inputField('Vị trí / nơi nhận',prefix+'location',l.location)}${inputField('Số lượng',prefix+'qty',l.qty,'type="number" min="0.000000001" step="any" required')}<label>Đơn vị<select name="${prefix}unit" ${linked?'disabled':''}>${options([['kg','kg'],['ea','cái'],['L','L']],l.unit)}</select></label><label>Quy về basis<select name="${prefix}basis">${options(Object.entries(basisLabels),l.basis)}</select></label>${inputField('Hệ số nhân về basis',prefix+'factor',l.factor??'','type="number" min="0.000000001" step="any" placeholder="VD 0.97"')}${inputField('Căn cứ quy đổi',prefix+'factorEvidence',l.factorEvidence,'placeholder="VD COA, đo solid; cùng basis: 1"')}</div></div>`}
function balanceHTML(b){if(!b)return '';return `<div class="row">${badge(b.state)}<span class="muted">${esc(b.reason||'Từng basis được đánh giá riêng')}</span></div>${b.groups.length?`<table class="balance-table"><thead><tr><th>Basis</th><th>Vào</th><th>Ra / phân bổ</th><th>Gap</th><th>|Gap| %</th></tr></thead><tbody>${b.groups.map(g=>`<tr><td>${esc(basisLabels[g.basis])}</td><td>${num(g.input)}</td><td>${num(g.output)}</td><td>${num(g.gap)}</td><td style="color:${g.ok?'var(--good)':'var(--bad)'}">${num(g.percent)}</td></tr>`).join('')}</tbody></table>`:''}`}
function renderEditor(){if(!draft){$('#editor').innerHTML='<div class="empty">Chọn phiếu để xem hoặc bấm “+ Phiếu” tại công đoạn được giao.</div>';return}const d=draft.data,stored=state.events.find(e=>e.id===draft.id),editable=canWrite(d.stage)&&draft.status!=='verified';const pics=state.users.filter(u=>u.active&&(u.role!=='operator'||u.stages.includes(d.stage)));$('#editor').innerHTML=`<div class="editor-head"><div><h2>${draft.id?'Phiếu công đoạn':'Phiếu mới'}</h2><span class="muted">${esc(state.stages.find(s=>s[0]===d.stage)?.[1])} · ${draft.id?'v'+draft.version:'Chưa lưu'}</span></div>${badge(draft.status)}</div>${draft.id?`<button type="button" id="trace-current">Truy xuất từ mẻ này</button>`:''}<form id="event-form"><fieldset style="border:0;padding:0;margin:12px 0 0" ${editable?'':'disabled'}><div class="grid">${inputField('Tên mẻ / phiếu *','title',d.title,'required')}${inputField('Process Order','po',d.po)}<label>Đại diện / PIC<select name="pic" required><option value="">— Chọn —</option>${options(pics.map(u=>[u.id,u.name]),d.pic)}</select></label>${inputField('Line / bồn / thiết bị','equipment',d.equipment)}${inputField('Bắt đầu (giờ nhà máy)','start',d.start,'type="datetime-local"')}${inputField('Kết thúc','end',d.end,'type="datetime-local"')}${inputField('Khách hàng / nơi giao','customer',d.customer)}<label>Chứng từ tham chiếu<textarea name="evidence" placeholder="Mã hồ sơ, tên file và vị trí lưu">${esc(d.evidence)}</textarea></label></div>${d.stage==='utility'?'<div class="notice">Phiếu Utility/CIP dùng thiết bị và thời gian để đại diện xác định mẻ liên quan. Không cộng vào khối lượng cà phê.</div>':`<div class="form-section"><div class="row"><h3>Đầu vào</h3><span class="spacer"></span><button type="button" data-add="inputs">+ Đầu vào</button></div><p class="muted">Chọn nguồn từ công đoạn trước để tạo liên kết. Nguồn ngoài phải có chứng từ để QA xác minh.</p>${d.inputs.map((l,i)=>lineHTML(l,'inputs',i)).join('')}</div><div class="form-section"><div class="row"><h3>Đầu ra và phân bổ</h3><span class="spacer"></span><button type="button" data-add="outputs">+ Đầu ra</button></div><p class="muted">Khai riêng sản phẩm, rework, reject, mẫu, loss và tồn cuối. Mỗi lượng chỉ tính một lần.</p>${d.outputs.map((l,i)=>lineHTML(l,'outputs',i)).join('')}</div><div class="form-section grid">${inputField('Ngưỡng sai lệch (%)','limit',d.limit,'type="number" min="0" max="100" step="any" required')}${inputField('Căn cứ ngưỡng','limitReason',d.limitReason,'placeholder="SOP / phê duyệt QA"')}</div>`}<div class="form-section"><h3>Utility / CIP liên quan</h3><p class="muted">Chọn theo đúng thiết bị và khoảng thời gian; app không tự suy ra phạm vi ảnh hưởng.</p>${state.events.filter(e=>e.data.stage==='utility'&&e.id!==draft.id).map(e=>`<label class="check"><input type="checkbox" name="context" value="${esc(e.id)}" ${(d.contexts||[]).includes(e.id)?'checked':''}>${esc(e.data.title)} · ${esc(e.data.equipment)} · ${esc(e.data.start)} — ${esc(e.data.end)}</label>`).join('')||'<p class="muted">Chưa có phiếu Utility/CIP.</p>'}</div><label class="form-section">Ghi chú<textarea name="note">${esc(d.note)}</textarea></label></fieldset><div id="editor-dirty" class="status-bar">${dirty?'Có thay đổi chưa lưu':stored?'Đang xem dữ liệu đã lưu trên server':'Phiếu chưa lưu'}</div><div class="actions sticky-actions">${editable?'<button type="submit" class="primary">Lưu phiếu</button>':''}${draft.id&&editable&&['draft','needs_review'].includes(draft.status)?'<button type="button" data-transition="submit">Gửi xác nhận</button>':''}${draft.id&&isQA()&&state.case.status==='open'&&draft.status==='submitted'?'<button type="button" data-transition="verify" class="primary">QA xác minh</button>':''}${draft.id&&isQA()&&state.case.status==='open'&&['verified','submitted'].includes(draft.status)?'<button type="button" data-transition="reopen">Yêu cầu xem lại</button>':''}</div></form><div class="form-section"><h3>Mass balance đã lưu</h3>${stored?balanceHTML(stored.balance):'<p class="muted">Lưu phiếu để server tính balance.</p>'}</div>${stored?sourceCheckHTML(stored):''}`;$('#event-form').addEventListener('input',()=>{dirty=true;$('#editor-dirty').textContent='Có thay đổi chưa lưu; kết quả balance bên dưới là bản đã lưu.'});$('#event-form').addEventListener('submit',ev=>{ev.preventDefault();action(saveDraft)})}
function sourceCheckHTML(e){const linked=e.data.inputs.filter(l=>l.kind==='linked'),external=e.data.inputs.filter(l=>l.kind==='external');return `<div class="form-section"><h3>Đối chiếu nguồn</h3>${linked.map(l=>{const src=state.events.find(s=>s.id===l.sourceEvent),out=src?.data.outputs.find(o=>o.id===l.sourceLine);const assigned=state.events.flatMap(s=>s.data.inputs).filter(i=>i.sourceEvent===l.sourceEvent&&i.sourceLine===l.sourceLine).reduce((n,i)=>n+i.qty,0);return `<p class="muted" style="margin-top:6px">${esc(l.batch)}: phiếu này nhận ${num(l.qty)} ${esc(l.unit)}; tổng đã phân bổ ${num(assigned)} / ${num(out?.qty)}. Nguồn ${esc(src?.data.title||'không tìm thấy')} ${badge(src?.status||'needs_review')}</p>`}).join('')}${external.length?`<div class="notice">${external.length} dòng nguồn ngoài / chưa liên kết. QA cần kiểm tra chứng từ và ranh giới truy xuất trước khi xác minh.</div>`:''}</div>`}
function collect(){const form=$('#event-form');if(!form||!draft)return;const f=new FormData(form),d=draft.data;for(const k of ['title','po','pic','equipment','start','end','customer','evidence','note','limit','limitReason'])if(f.has(k))d[k]=f.get(k);d.contexts=f.getAll('context');for(const side of ['inputs','outputs'])for(let i=0;i<d[side].length;i++){const l=d[side][i];for(const k of ['material','batch','sscc','location','qty','unit','basis','factor','factorEvidence','kind'])if(f.has(side+'.'+i+'.'+k))l[k]=f.get(side+'.'+i+'.'+k)} }
async function saveDraft(){collect();const result=await api('/api/events',{id:draft.id,caseId:state.case.id,version:draft.version,data:draft.data});selected=result.id;dirty=false;await load();message('Đã lưu trên server; balance đã cập nhật.')}
function renderReport(){if(!state.case){$('#report').innerHTML='<div class="empty">Chưa chọn đợt.</div>';return}const es=state.events;$('#report').innerHTML=`<div class="panel"><div class="row"><h2>Báo cáo Process Flow · ${esc(state.case.name)}</h2><span class="spacer"></span><button class="no-print" id="print-report">In / PDF</button>${isQA()&&state.case.status==='open'?'<button class="primary no-print" id="close-case">Đóng đợt</button>':''}</div><p class="muted">${state.case.status==='closed'?'Đợt đã đóng, dữ liệu được khóa':'Bản đang làm việc'} · ${es.length} phiếu · ${es.filter(e=>e.status==='verified').length} đã xác minh</p><div class="notice">Báo cáo theo dữ liệu công đoạn đã nhập. Các khối chưa có phiếu không chứng minh đã nằm ngoài phạm vi. QA xác nhận phạm vi và chứng cứ trước khi đóng đợt.</div>${es.map(e=>`<article class="report-event"><h3>${esc(e.data.title)} · ${esc(state.stages.find(s=>s[0]===e.data.stage)?.[1])}</h3><p class="muted">PO ${esc(e.data.po)} · PIC ${esc(state.users.find(u=>u.id===e.data.pic)?.name)} · ${esc(e.data.start)} đến ${esc(e.data.end)} · v${e.version}</p>${badge(e.status)}${balanceHTML(e.balance)}<table class="data"><thead><tr><th>Phía / loại</th><th>Material / Batch</th><th>SSCC</th><th>Lượng</th><th>Liên kết / vị trí</th></tr></thead><tbody>${['inputs','outputs'].flatMap(side=>e.data[side].map(l=>`<tr><td>${side==='inputs'?'Vào':'Ra'} / ${esc(l.kind)}</td><td>${esc(l.material)}<br>${esc(l.batch)}</td><td>${esc(l.sscc)}</td><td>${num(l.qty)} ${esc(l.unit)}</td><td>${esc(l.sourceEvent?(state.events.find(s=>s.id===l.sourceEvent)?.data.title||'Nguồn chưa tìm thấy'):l.location)}</td></tr>`)).join('')}</tbody></table><p class="muted">Chứng từ: ${esc(e.data.evidence)} · Khách hàng: ${esc(e.data.customer||'—')}</p><p class="muted">Ngưỡng: ${num(e.data.limit)}% · Căn cứ: ${esc(e.data.limitReason||'—')}</p><p class="muted">Ghi chú: ${esc(e.data.note)}</p></article>`).join('')}</div>`}
function renderAccounts(){if(state.user.role!=='admin')return;$('#accounts').innerHTML=`<div class="panel"><h2>Tài khoản & công đoạn được giao</h2><p class="muted">Đại diện xem luồng chung và sửa công đoạn được giao. QA xác minh và đóng đợt.</p><form id="user-form" style="margin-top:16px"><div class="grid three">${inputField('Tên đăng nhập','username','','required autocomplete="off"')}${inputField('Họ tên','name','','required')}${inputField('Mật khẩu ban đầu (≥12 ký tự)','password','','required type="password" minlength="12" autocomplete="new-password"')}<label>Vai trò<select name="role"><option value="operator">Đại diện công đoạn</option><option value="qa">QA</option><option value="admin">Quản trị</option></select></label></div><div class="form-section grid three">${state.stages.map(s=>`<label class="check"><input type="checkbox" name="stage" value="${s[0]}">${esc(s[1])}</label>`).join('')}</div><button type="submit" class="primary" style="margin-top:14px">Tạo tài khoản</button></form><table class="data account-list"><thead><tr><th>Tên</th><th>Đăng nhập</th><th>Vai trò</th><th>Công đoạn</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${esc(u.stages.map(s=>state.stages.find(x=>x[0]===s)?.[1]).join(', ')||'Toàn bộ (QA / quản trị)')}</td></tr>`).join('')}</tbody></table></div>`;$('#user-form').onsubmit=e=>{e.preventDefault();action(async()=>{const f=new FormData(e.target);await api('/api/users',{username:f.get('username'),name:f.get('name'),password:f.get('password'),role:f.get('role'),stages:f.getAll('stage')});await load('',{preserve:true});message('Đã tạo tài khoản')})}}
async function showView(view){if(currentView==='workspace'&&view!=='workspace'&&dirty){message('Phiếu đang nhập được giữ lại. Lưu trước khi xác minh hoặc đóng đợt.')}currentView=view;for(const name of ['workspace','report','accounts','audit'])$('#'+name).hidden=name!==view;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='report')renderReport();if(view==='accounts')renderAccounts();if(view==='audit'){const rows=await api('/api/audit');$('#audit').innerHTML=`<div class="panel"><h2>Nhật ký server</h2><p class="muted">200 thao tác gần nhất. Server giữ toàn bộ lịch sử thay đổi trong cơ sở dữ liệu.</p>${rows.map(r=>`<div class="audit-item"><b>${esc(r.action)}</b> · ${esc(r.name)}<p class="muted">${date(r.at)} · ${esc(r.entity)}</p><details><summary>Trước / sau</summary><pre>${esc(JSON.stringify({before:JSON.parse(r.before_json),after:JSON.parse(r.after_json)},null,2))}</pre></details></div>`).join('')}</div>`}}

$('#case-select').onchange=e=>action(async()=>{if(!discard()){e.target.value=state.case?.id||'';return}selected='';anchor='';draft=null;dirty=false;await load(e.target.value)});
$('#new-case').onclick=()=>action(async()=>{if(!discard())return;const name=prompt('Tên đợt truy xuất:');if(!name?.trim())return;const r=await api('/api/cases',{name});selected='';anchor='';draft=null;dirty=false;await load(r.id)});
$('#refresh').onclick=()=>action(async()=>{if(!discard())return;await load()});
$('#export').onclick=()=>action(async()=>{const data=await api('/api/export?case='+encodeURIComponent(state.case.id));const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ild_process_'+state.case.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});

$('#add-event').onclick=()=>{if(!discard()||!canWrite(stage))return;selected='';anchor='';const pic=state.user.role==='operator'?state.user.id:state.users.find(u=>u.role==='operator'&&u.stages.includes(stage))?.id||state.user.id;draft={id:null,version:0,status:'draft',data:{stage,title:'',po:'',pic,equipment:'',start:'',end:'',evidence:'',note:'',customer:'',limit:0.5,limitReason:'',inputs:stage==='utility'?[]:[newLine('inputs')],outputs:stage==='utility'?[]:[newLine('outputs')],contexts:[]}};dirty=true;renderGraph();renderEvents();renderEditor()};
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-stage]');if(!b||!b.matches('[data-view],[data-dir],[data-stage],[data-event],[data-find],[data-add],[data-remove],[data-transition],#trace-current,#print-report,#close-case'))return;action(async()=>{if(b.dataset.view){await showView(b.dataset.view);return}if(b.dataset.dir){direction=b.dataset.dir;$$('[data-dir]').forEach(x=>x.classList.toggle('active',x.dataset.dir===direction));renderGraph();renderEvents();return}if(b.dataset.stage){if(!discard())return;stage=b.dataset.stage;selected='';draft=null;dirty=false;renderGraph();renderEvents();renderEditor();return}const eid=b.dataset.event||b.dataset.find;if(eid){if(!discard())return;const ev=state.events.find(x=>x.id===eid);selected=eid;stage=ev.data.stage;draft=clone(ev);dirty=false;if(b.dataset.find)anchor=eid;renderGraph();renderEvents();renderEditor();return}if(b.id==='trace-current'){anchor=draft.id;renderGraph();renderEvents();return}if(b.dataset.add){collect();draft.data[b.dataset.add].push(newLine(b.dataset.add));dirty=true;renderEditor();return}if(b.dataset.remove){collect();const [side,i]=b.dataset.remove.split(':');draft.data[side].splice(+i,1);dirty=true;renderEditor();return}if(b.dataset.transition){if(dirty){message('Lưu phiếu trước khi chuyển trạng thái.',true);return}let reason='';if(b.dataset.transition==='reopen'){reason=prompt('Lý do yêu cầu xem lại:');if(!reason?.trim())return}await api('/api/transition',{id:draft.id,version:draft.version,action:b.dataset.transition,reason});await load();message('Đã cập nhật trạng thái');return}if(b.id==='print-report'){window.print();return}if(b.id==='close-case'){if(dirty){message('Còn phiếu chưa lưu. Lưu và xác minh trước khi đóng.',true);return}if(!confirm('Đã xác nhận đủ phạm vi, chứng từ và các phiếu? Đóng đợt sẽ khóa dữ liệu.'))return;await api('/api/close',{id:state.case.id,version:state.case.version});await load();message('Đã đóng đợt và lưu phiên bản');return}})});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-stage]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{if(!e.target.closest('#event-form'))return;dirty=true;collect();if(e.target.dataset.kind){const [side,i]=e.target.dataset.kind.split(':');if(draft.data[side][+i].kind!=='linked'){delete draft.data[side][+i].sourceEvent;delete draft.data[side][+i].sourceLine}renderEditor()}else if(e.target.dataset.source!==undefined){const i=+e.target.dataset.source,[eventId,lineId]=e.target.value.split('|'),source=state.events.find(x=>x.id===eventId)?.data.outputs.find(x=>x.id===lineId);const l=draft.data.inputs[i];l.sourceEvent=eventId;l.sourceLine=lineId;if(source)for(const k of ['material','batch','sscc','unit'])l[k]=source[k];renderEditor()}});

    "lan/server.py": "\"\"\"iLD process traceability pilot. Python 3.12+, standard library only.\"\"\"\nimport argparse\nimport base64\nimport getpass\nimport hashlib\nimport hmac\nimport json\nimport math\nimport os\nimport secrets\nimport sqlite3\nimport ssl\nimport time\nimport uuid\nfrom contextlib import contextmanager\nfrom datetime import datetime\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib import Path\nfrom urllib.parse import urlparse, parse_qs\n\nROOT = Path(__file__).resolve().parent.parent\n\n\ndef lan_document():\n    \"\"\"The sole HTML source contains both legacy UI and the editable LAN template.\"\"\"\n    source = (ROOT/'index.html').read_text(encoding='utf-8')\n    fragment = source.split('\u003c!-- BEGIN ILD LAN FRAGMENT -->', 1)[1].split('\u003c!-- END ILD LAN FRAGMENT -->', 1)[0]\n    return ('\u003c!doctype html>\u003chtml lang=\"vi\">\u003chead>\u003cmeta charset=\"utf-8\">'\n            '\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">'\n            '\u003ctitle>iLD · Process Flow\u003c/title>\u003c/head>\u003cbody>' + fragment + '\u003c/body>\u003c/html>').encode()\nSTAGES = [\n    ('incoming', 'Kho nguyên liệu', 'WH'), ('tipping', 'Tipping', 'TIP'),\n    ('roasting', 'Roasting', 'ROA'), ('extraction', 'Extraction', 'EXT'),\n    ('evaporation', 'Evaporation', 'EVAP'), ('liquid', 'F&P Liquid', 'F&P'),\n    ('drying', 'Freeze Drying', 'FD'), ('packing', 'F&P Powder', 'F&P'),\n    ('warehouse', 'Kho thành phẩm / giao hàng', 'WH/LOG'),\n    ('packaging', 'Kho bao bì', 'WH PM'), ('ingredients', 'Phụ liệu', 'WH'),\n    ('rework', 'Rework', 'PRO'), ('utility', 'Utility / CIP', 'UTI')]\nSTAGE_IDS = {s[0] for s in STAGES}\nUNITS = {'kg', 'ea', 'L'}\nBASES = {'GC', 'solid', 'product', 'packaging'}\n\n\nclass Problem(Exception):\n    def __init__(self, message, status=400):\n        super().__init__(message)\n        self.status = status\n\n\ndef encoded(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',', ':'))\n\n\ndef password_hash(password, salt=None):\n    salt = salt or secrets.token_hex(16)\n    digest = hashlib.scrypt(password.encode(), salt=salt.encode(), n=16384, r=8, p=1).hex()\n    return salt + ':' + digest\n\n\ndef verify_password(password, stored):\n    return hmac.compare_digest(password_hash(password, stored.split(':')[0]), stored)\n\n\ndef text_field(value, label, required=True, maximum=500):\n    if not isinstance(value, str) or len(value) > maximum or (required and not value.strip()):\n        raise Problem('Kiểm tra ' + label)\n    return value.strip()\n\n\ndef number(value, label, positive=False):\n    if isinstance(value, bool) or value is None or value == '':\n        raise Problem('Chưa nhập ' + label)\n    try:\n        result = float(value)\n    except (ValueError, TypeError):\n        raise Problem('Sai số: ' + label)\n    if not math.isfinite(result) or result \u003c 0 or (positive and result == 0):\n        raise Problem('Giá trị không hợp lệ: ' + label)\n    return result\n\n\ndef balance(data):\n    \"\"\"Separate balances for each basis; blank values remain incomplete.\"\"\"\n    if data['stage'] == 'utility':\n        return {'state': 'not_applicable', 'groups': [], 'reason': 'Quan hệ điều kiện sản xuất'}\n    if not data.get('inputs') or not data.get('outputs'):\n        return {'state': 'incomplete', 'groups': [], 'reason': 'Cần khai đủ đầu vào và đầu ra'}\n    groups = {}\n    for side in ('inputs', 'outputs'):\n        for line in data[side]:\n            key = line['basis']\n            if line.get('factor') in ('', None) or not line.get('factorEvidence'):\n                return {'state': 'incomplete', 'groups': [], 'reason': 'Thiếu hệ số hoặc căn cứ quy đổi'}\n            g = groups.setdefault(key, {'basis': key, 'input': 0, 'output': 0})\n            g['input' if side == 'inputs' else 'output'] += line['qty'] * line['factor']\n    for g in groups.values():\n        g['gap'] = g['input'] - g['output']\n        g['percent'] = abs(g['gap']) / g['input'] * 100 if g['input'] > 0 else None\n        g['ok'] = g['percent'] is not None and g['percent'] \u003c= data['limit'] + 1e-9\n    return {'state': 'ok' if all(g['ok'] for g in groups.values()) else 'deviation', 'groups': list(groups.values())}\n\n\nclass ClosingConnection(sqlite3.Connection):\n    def __exit__(self, *args):\n        try:\n            return super().__exit__(*args)\n        finally:\n            self.close()\n\n\nclass Store:\n    def __init__(self, path):\n        self.path = str(path)\n        Path(path).parent.mkdir(parents=True, exist_ok=True)\n        with self.connect() as db:\n            db.executescript('''\n            PRAGMA journal_mode=WAL;\n            CREATE TABLE IF NOT EXISTS users(id TEXT PRIMARY KEY, username TEXT UNIQUE NOT NULL,\n              name TEXT NOT NULL, role TEXT NOT NULL, stages TEXT NOT NULL, password TEXT NOT NULL, active INTEGER NOT NULL DEFAULT 1);\n            CREATE TABLE IF NOT EXISTS sessions(token TEXT PRIMARY KEY, user_id TEXT NOT NULL, expires REAL NOT NULL);\n            CREATE TABLE IF NOT EXISTS cases(id TEXT PRIMARY KEY, name TEXT NOT NULL, version INTEGER NOT NULL, status TEXT NOT NULL, created REAL NOT NULL, snapshot TEXT);\n            CREATE TABLE IF NOT EXISTS events(id TEXT PRIMARY KEY, case_id TEXT NOT NULL, version INTEGER NOT NULL,\n              status TEXT NOT NULL, author TEXT NOT NULL, data TEXT NOT NULL, updated REAL NOT NULL);\n            CREATE TABLE IF NOT EXISTS history(seq INTEGER PRIMARY KEY AUTOINCREMENT, at REAL NOT NULL,\n              user_id TEXT NOT NULL, action TEXT NOT NULL, entity TEXT NOT NULL, before_json TEXT, after_json TEXT);\n            CREATE TABLE IF NOT EXISTS login_attempts(key TEXT PRIMARY KEY, count INTEGER NOT NULL, until REAL NOT NULL);\n            ''')\n\n    def connect(self):\n        db = sqlite3.connect(self.path, timeout=15, factory=ClosingConnection)\n        db.row_factory = sqlite3.Row\n        return db\n\n    @contextmanager\n    def transaction(self):\n        db = self.connect()\n        try:\n            db.execute('BEGIN IMMEDIATE')\n            yield db\n            db.commit()\n        except Exception:\n            db.rollback()\n            raise\n        finally:\n            db.close()\n\n    def audit(self, db, user, action, entity, before=None, after=None):\n        db.execute('INSERT INTO history(at,user_id,action,entity,before_json,after_json) VALUES(?,?,?,?,?,?)',\n                   (time.time(), user['id'], action, entity, encoded(before), encoded(after)))\n\n    def public_user(self, row):\n        return {k: (json.loads(row[k]) if k == 'stages' else row[k]) for k in ('id','username','name','role','stages','active')}\n\n    def create_user(self, user, data):\n        if user and user['role'] != 'admin':\n            raise Problem('Chỉ quản trị được tạo tài khoản', 403)\n        username = text_field(data.get('username'), 'tên đăng nhập', maximum=80).lower()\n        name = text_field(data.get('name'), 'họ tên', maximum=120)\n        password = text_field(data.get('password'), 'mật khẩu', maximum=200)\n        if len(password) \u003c 12:\n            raise Problem('Mật khẩu cần ít nhất 12 ký tự')\n        role = data.get('role')\n        stages = data.get('stages', [])\n        if role not in ('admin','qa','operator') or not isinstance(stages, list) or not set(stages) \u003c= STAGE_IDS:\n            raise Problem('Vai trò hoặc công đoạn không hợp lệ')\n        with self.transaction() as db:\n            if user is None and db.execute('SELECT COUNT(*) FROM users').fetchone()[0]:\n                raise Problem('Đã có tài khoản; tạo thêm bằng quản trị')\n            ident = uuid.uuid4().hex\n            try:\n                db.execute('INSERT INTO users VALUES(?,?,?,?,?,?,1)', (ident, username, name, role, encoded(stages), password_hash(password)))\n            except sqlite3.IntegrityError:\n                raise Problem('Tên đăng nhập đã tồn tại', 409)\n            result = self.public_user(db.execute('SELECT * FROM users WHERE id=?', (ident,)).fetchone())\n            self.audit(db, user or result, 'Tạo tài khoản', ident, after=result)\n            return result\n\n    def login(self, data, address):\n        username = text_field(data.get('username'), 'tên đăng nhập', maximum=80).lower()\n        password = text_field(data.get('password'), 'mật khẩu', maximum=200)\n        key = address + ':' + username\n        error = None\n        with self.transaction() as db:\n            now = time.time()\n            attempt = db.execute('SELECT * FROM login_attempts WHERE key=?', (key,)).fetchone()\n            if attempt and attempt['count'] >= 8 and attempt['until'] > now:\n                raise Problem('Thử lại sau 15 phút', 429)\n            row = db.execute('SELECT * FROM users WHERE username=? AND active=1', (username,)).fetchone()\n            if not row or not verify_password(password, row['password']):\n                count = attempt['count'] + 1 if attempt and attempt['until'] > now else 1\n                db.execute('INSERT OR REPLACE INTO login_attempts VALUES(?,?,?)', (key, count, now+900))\n                error = Problem('Sai tên đăng nhập hoặc mật khẩu', 401)\n            else:\n                db.execute('DELETE FROM login_attempts WHERE key=?', (key,))\n                db.execute('DELETE FROM sessions WHERE expires\u003c?', (now,))\n                token = secrets.token_urlsafe(32)\n                db.execute('INSERT INTO sessions VALUES(?,?,?)', (hashlib.sha256(token.encode()).hexdigest(), row['id'], now+8*3600))\n                result = {'token': token, 'user': self.public_user(row)}\n        if error:\n            raise error\n        return result\n\n    def authenticate(self, token):\n        with self.connect() as db:\n            row = db.execute('SELECT u.* FROM users u JOIN sessions s ON s.user_id=u.id WHERE s.token=? AND s.expires>? AND u.active=1',\n                (hashlib.sha256(token.encode()).hexdigest(), time.time())).fetchone()\n            if not row:\n                raise Problem('Phiên đã hết hạn. Vui lòng đăng nhập.', 401)\n            return self.public_user(row)\n\n    def event(self, row):\n        return {'id': row['id'], 'caseId': row['case_id'], 'version': row['version'], 'status': row['status'],\n                'author': row['author'], 'updated': row['updated'], 'data': json.loads(row['data'])}\n\n    def events(self, db, case_id):\n        return [self.event(r) for r in db.execute('SELECT * FROM events WHERE case_id=? ORDER BY updated,id', (case_id,))]\n\n    def state(self, user, case_id):\n        with self.connect() as db:\n            cases = [dict(r) for r in db.execute('SELECT id,name,version,status,created FROM cases ORDER BY created DESC')]\n            selected = next((c for c in cases if c['id'] == case_id), cases[0] if cases else None)\n            events = self.events(db, selected['id']) if selected else []\n            return {'user': user, 'stages': STAGES, 'cases': cases, 'case': selected,\n                    'users': [self.public_user(r) for r in db.execute('SELECT * FROM users ORDER BY name')],\n                    'events': [dict(e, balance=balance(e['data'])) for e in events]}\n\n    def create_case(self, user, data):\n        if user['role'] not in ('qa','admin'):\n            raise Problem('QA tạo đợt truy xuất', 403)\n        name = text_field(data.get('name'), 'tên đợt', maximum=160)\n        ident = uuid.uuid4().hex\n        with self.transaction() as db:\n            db.execute('INSERT INTO cases VALUES(?,?,1,?,?,NULL)', (ident,name,'open',time.time()))\n            self.audit(db,user,'Tạo đợt',ident,after={'name':name})\n        return {'id': ident}\n\n    def validate(self, data, ident, events, users):\n        if not isinstance(data, dict) or data.get('stage') not in STAGE_IDS:\n            raise Problem('Chọn công đoạn')\n        d = {'stage': data['stage']}\n        for k in ('title','po','equipment','start','end','evidence','note','customer'):\n            d[k] = text_field(data.get(k,''), k, required=k=='title', maximum=4000 if k in ('evidence','note') else 200)\n        for k in ('start','end'):\n            if d[k]:\n                try:\n                    datetime.strptime(d[k], '%Y-%m-%dT%H:%M')\n                except ValueError:\n                    raise Problem('Thời gian không hợp lệ: '+k)\n        if d['start'] and d['end'] and d['start'] > d['end']:\n            raise Problem('Thời gian kết thúc phải sau bắt đầu')\n        d['pic'] = text_field(data.get('pic'), 'người phụ trách')\n        pic = next((u for u in users if u['id']==d['pic'] and u['active']), None)\n        if not pic or (pic['role']=='operator' and d['stage'] not in pic['stages']):\n            raise Problem('PIC chưa được giao công đoạn này')\n        d['limit'] = number(data.get('limit'), 'ngưỡng %')\n        if d['limit'] > 100:\n            raise Problem('Ngưỡng không được vượt 100%')\n        d['limitReason'] = text_field(data.get('limitReason',''), 'căn cứ ngưỡng', False)\n        existing = {e['id']:e for e in events if e['id'] != ident}\n        output_map = {(e['id'], x['id']):x for e in existing.values() for x in e['data']['outputs']}\n        seen = set()\n        for side in ('inputs','outputs'):\n            lines = data.get(side, [])\n            if not isinstance(lines,list) or len(lines)>100:\n                raise Problem('Tối đa 100 dòng mỗi phía')\n            d[side] = []\n            for raw in lines:\n                if not isinstance(raw,dict):\n                    raise Problem('Dòng vật liệu không hợp lệ')\n                line = {}\n                for k in ('id','material','batch','sscc','location','factorEvidence'):\n                    line[k] = text_field(raw.get(k,''), k, required=k in ('id','material','batch'), maximum=500)\n                if line['id'] in seen:\n                    raise Problem('ID dòng bị trùng')\n                seen.add(line['id'])\n                line['qty'] = number(raw.get('qty'), 'số lượng', True)\n                line['unit'] = raw.get('unit')\n                line['basis'] = raw.get('basis')\n                if line['unit'] not in UNITS or line['basis'] not in BASES:\n                    raise Problem('Đơn vị / basis không hợp lệ')\n                line['factor'] = None if raw.get('factor') in ('',None) else number(raw['factor'], 'hệ số', True)\n                line['kind'] = raw.get('kind', 'product' if side=='outputs' else 'external')\n                allowed = ('product','rework','reject','sample','loss','stock') if side=='outputs' else ('external','linked','opening')\n                if line['kind'] not in allowed:\n                    raise Problem('Loại dòng không hợp lệ')\n                if side=='inputs' and line['kind']=='linked':\n                    line['sourceEvent'] = raw.get('sourceEvent','')\n                    line['sourceLine'] = raw.get('sourceLine','')\n                    src = output_map.get((line['sourceEvent'],line['sourceLine']))\n                    if not src or src['kind'] not in ('product','rework','stock'):\n                        raise Problem('Nguồn chưa tồn tại hoặc không được cấp tiếp')\n                    for k in ('material','batch','sscc','unit'):\n                        if line[k] != src[k]:\n                            raise Problem('Định danh/đơn vị khác nguồn; chọn lại nguồn')\n                d[side].append(line)\n        contexts = data.get('contexts', [])\n        if not isinstance(contexts,list) or any(x not in existing or existing[x]['data']['stage']!='utility' for x in contexts):\n            raise Problem('Chọn phiếu Utility / CIP hợp lệ')\n        d['contexts'] = list(dict.fromkeys(contexts))\n        all_events = list(existing.values()) + [{'id':ident,'data':d}]\n        if d['stage']!='utility' and any(ident in e['data'].get('contexts',[]) for e in existing.values()):\n            raise Problem('Phiếu Utility đang được tham chiếu; không thể đổi công đoạn',409)\n        outputs = {(e['id'],x['id']): x for e in all_events for x in e['data']['outputs']}\n        allocated = {}\n        adjacency = {}\n        for e in all_events:\n            for line in e['data']['inputs']:\n                if line['kind'] != 'linked':\n                    continue\n                key = (line['sourceEvent'],line['sourceLine'])\n                src = outputs.get(key)\n                if not src:\n                    raise Problem('Đầu ra đang được sử dụng; không thể xóa hoặc đổi ID',409)\n                if any(line[k]!=src[k] for k in ('material','batch','sscc','unit')):\n                    raise Problem('Nguồn đã có bên nhận; không thể đổi định danh/đơn vị',409)\n                allocated[key] = allocated.get(key,0) + line['qty']\n                if allocated[key] > src['qty'] + 1e-8:\n                    raise Problem('Tổng lượng cấp vượt đầu ra nguồn: '+src['batch'],409)\n                adjacency.setdefault(key[0],set()).add(e['id'])\n        def visit(node, stack, done):\n            if node in stack:\n                raise Problem('Liên kết vòng: rework phải tạo một lần phát sinh mới')\n            if node in done:\n                return\n            stack.add(node)\n            for target in adjacency.get(node,[]):\n                visit(target,stack,done)\n            stack.remove(node)\n            done.add(node)\n        done=set()\n        for node in adjacency:\n            visit(node,set(),done)\n        return d\n\n    def save_event(self, user, payload):\n        case_id = payload.get('caseId')\n        ident = payload.get('id') or uuid.uuid4().hex\n        with self.transaction() as db:\n            case = db.execute('SELECT * FROM cases WHERE id=?',(case_id,)).fetchone()\n            if not case or case['status']!='open':\n                raise Problem('Đợt không tồn tại hoặc đã đóng',409)\n            events = self.events(db,case_id)\n            old = next((e for e in events if e['id']==ident),None)\n            if not old and db.execute('SELECT 1 FROM events WHERE id=?',(ident,)).fetchone():\n                raise Problem('ID thuộc đợt khác',409)\n            if old and old['version'] != payload.get('version'):\n                raise Problem('Có người vừa cập nhật phiếu. Tải lại rồi đối chiếu trước khi lưu.',409)\n            if old and old['status']=='verified':\n                raise Problem('QA cần mở lại phiếu trước khi sửa',409)\n            users = [self.public_user(r) for r in db.execute('SELECT * FROM users')]\n            d = self.validate(payload.get('data'),ident,events,users)\n            if user['role']=='operator' and (d['stage'] not in user['stages'] or (old and old['data']['stage'] not in user['stages'])):\n                raise Problem('Bạn không được sửa công đoạn này',403)\n            version = old['version']+1 if old else 1\n            now=time.time()\n            db.execute('INSERT INTO events VALUES(?,?,?,?,?,?,?) ON CONFLICT(id) DO UPDATE SET version=excluded.version,status=excluded.status,data=excluded.data,updated=excluded.updated',\n                (ident,case_id,version,'draft',user['id'],encoded(d),now))\n            new={'id':ident,'data':d,'version':version,'status':'draft'}\n            self.audit(db,user,'Lưu phiếu',ident,old,new)\n            self.invalidate(db,user,events,ident)\n            return new\n\n    def invalidate(self, db, user, events, source):\n        pending=[source]; visited={source}\n        while pending:\n            current=pending.pop()\n            for e in events:\n                dependencies={x.get('sourceEvent') for x in e['data']['inputs']} | set(e['data'].get('contexts',[]))\n                if current not in dependencies or e['id'] in visited:\n                    continue\n                visited.add(e['id']); pending.append(e['id'])\n                if e['status'] in ('verified','submitted'):\n                    db.execute(\"UPDATE events SET status='needs_review',version=version+1,updated=? WHERE id=?\",(time.time(),e['id']))\n                    self.audit(db,user,'Nguồn thay đổi; cần xác minh lại',e['id'],e,{'source':source})\n\n    def transition(self,user,payload):\n        ident=payload.get('id'); action=payload.get('action')\n        with self.transaction() as db:\n            row=db.execute('SELECT * FROM events WHERE id=?',(ident,)).fetchone()\n            if not row:\n                raise Problem('Không tìm thấy phiếu',404)\n            e=self.event(row)\n            case=db.execute('SELECT * FROM cases WHERE id=?',(e['caseId'],)).fetchone()\n            if case['status']!='open' or payload.get('version')!=e['version']:\n                raise Problem('Đợt đã đóng hoặc phiên bản đã thay đổi',409)\n            reason=text_field(payload.get('reason',''),'lý do',False)\n            d=e['data']; events=self.events(db,e['caseId'])\n            if action=='submit':\n                if user['role']=='operator' and d['stage'] not in user['stages']:\n                    raise Problem('Không có quyền công đoạn',403)\n                if e['status'] not in ('draft','needs_review'):\n                    raise Problem('Phiếu không ở trạng thái gửi được',409)\n                if not d['start'] or not d['end'] or not d['evidence']:\n                    raise Problem('Cần thời gian và chứng từ trước khi gửi')\n                if d['stage']!='utility' and (not d['inputs'] or not d['outputs']):\n                    raise Problem('Cần đầu vào và đầu ra trước khi gửi')\n                status='submitted'\n            elif action in ('verify','reopen'):\n                if user['role'] not in ('admin','qa'):\n                    raise Problem('Chỉ QA / quản trị xác minh hoặc mở lại',403)\n                if action=='verify':\n                    if e['status']!='submitted':\n                        raise Problem('Cần gửi xác nhận trước',409)\n                    if balance(d)['state'] not in ('ok','not_applicable') or (d['stage']!='utility' and not d['limitReason']):\n                        raise Problem('Cần balance trong ngưỡng và căn cứ ngưỡng')\n                    deps={x.get('sourceEvent') for x in d['inputs'] if x['kind']=='linked'} | set(d['contexts'])\n                    if any(x['id'] in deps and x['status']!='verified' for x in events):\n                        raise Problem('Nguồn / Utility liên quan chưa được xác minh')\n                    status='verified'\n                else:\n                    if not reason:\n                        raise Problem('Nhập lý do mở lại')\n                    status='needs_review'\n                    self.invalidate(db,user,events,ident)\n            else:\n                raise Problem('Thao tác không hợp lệ')\n            db.execute('UPDATE events SET status=?,version=version+1,updated=? WHERE id=?',(status,time.time(),ident))\n            self.audit(db,user,action,ident,e,{'status':status,'reason':reason,'version':e['version']+1})\n            return {'id':ident,'status':status}\n\n    def close_case(self,user,payload):\n        if user['role'] not in ('admin','qa'):\n            raise Problem('Chỉ QA đóng đợt',403)\n        with self.transaction() as db:\n            case=db.execute('SELECT * FROM cases WHERE id=?',(payload.get('id'),)).fetchone()\n            if not case or case['status']!='open' or case['version']!=payload.get('version'):\n                raise Problem('Đợt đã thay đổi',409)\n            events=self.events(db,case['id'])\n            if not events or any(e['status']!='verified' for e in events):\n                raise Problem('Cần xác minh tất cả phiếu trước khi đóng')\n            snapshot={'case':dict(case),'events':events,'closedAt':time.time(),'closedBy':user['name']}\n            db.execute(\"UPDATE cases SET status='closed',version=version+1,snapshot=? WHERE id=?\",(encoded(snapshot),case['id']))\n            self.audit(db,user,'Đóng đợt',case['id'],after=snapshot)\n            return {'id':case['id'],'status':'closed'}\n\n    def export(self,user,case_id):\n        with self.connect() as db:\n            case=db.execute('SELECT * FROM cases WHERE id=?',(case_id,)).fetchone()\n            if not case:\n                raise Problem('Không tìm thấy đợt',404)\n            return json.loads(case['snapshot']) if case['snapshot'] else {'case':dict(case),'events':self.events(db,case_id),'exportedAt':time.time()}\n\n\ndef handler(store):\n    class Handler(BaseHTTPRequestHandler):\n        server_version='iLD-Trace/1'\n        def log_message(self, fmt, *args):\n            # Avoid recording credentials, tokens, or request bodies.\n            pass\n\n        def send(self,status,content,kind='application/json; charset=utf-8'):\n            raw=content if isinstance(content,bytes) else encoded(content).encode()\n            self.send_response(status)\n            self.send_header('Content-Type',kind)\n            self.send_header('Content-Length',str(len(raw)))\n            self.send_header('Cache-Control','no-store')\n            self.send_header('X-Content-Type-Options','nosniff')\n            self.send_header('X-Frame-Options','SAMEORIGIN')\n            self.end_headers()\n            self.wfile.write(raw)\n\n        def user(self):\n            auth=self.headers.get('Authorization','')\n            if not auth.startswith('Bearer '):\n                raise Problem('Vui lòng đăng nhập',401)\n            return store.authenticate(auth[7:])\n\n        def do_GET(self):\n            try:\n                url=urlparse(self.path); q=parse_qs(url.query)\n                if url.path in ('/','/lan','/lan/'):\n                    return self.send(200,lan_document(),'text/html; charset=utf-8')\n                if url.path=='/legacy':\n                    page=(ROOT/'index.html').read_text(encoding='utf-8').replace('\u003chead>','\u003chead>\u003cscript>window.ILD_LAN=true;\u003c/script>',1)\n                    return self.send(200,page.encode(),'text/html; charset=utf-8')\n                user=self.user()\n                if url.path=='/api/state':\n                    return self.send(200,store.state(user,q.get('case',[''])[0]))\n                if url.path=='/api/export':\n                    return self.send(200,store.export(user,q.get('case',[''])[0]))\n                if url.path=='/api/audit':\n                    if user['role'] not in ('admin','qa'):\n                        raise Problem('Chỉ QA / quản trị xem nhật ký',403)\n                    with store.connect() as db:\n                        rows=[dict(r) for r in db.execute('SELECT h.*,u.name FROM history h LEFT JOIN users u ON u.id=h.user_id ORDER BY seq DESC LIMIT 200')]\n                    return self.send(200,rows)\n                raise Problem('Không tìm thấy',404)\n            except Problem as e:\n                self.send(e.status,{'error':str(e)})\n            except Exception:\n                self.send(500,{'error':'Lỗi server; dữ liệu chưa được xác nhận. Kiểm tra nhật ký máy chủ.'})\n\n        def do_POST(self):\n            try:\n                origin=self.headers.get('Origin')\n                if origin and urlparse(origin).netloc!=self.headers.get('Host'):\n                    raise Problem('Nguồn yêu cầu không hợp lệ',403)\n                if self.headers.get('Content-Type','').split(';')[0]!='application/json':\n                    raise Problem('Cần JSON',415)\n                size=int(self.headers.get('Content-Length','0'))\n                if size\u003c=0 or size>1024*1024:\n                    raise Problem('Yêu cầu quá lớn hoặc rỗng',413)\n                data=json.loads(self.rfile.read(size))\n                if not isinstance(data,dict):\n                    raise Problem('Cần đối tượng JSON')\n                path=urlparse(self.path).path\n                if path=='/api/login':\n                    return self.send(200,store.login(data,self.client_address[0]))\n                user=self.user()\n                routes={'/api/users':store.create_user,'/api/cases':store.create_case,\n                        '/api/events':store.save_event,'/api/transition':store.transition,'/api/close':store.close_case}\n                if path=='/api/logout':\n                    with store.transaction() as db:\n                        db.execute('DELETE FROM sessions WHERE token=?',(hashlib.sha256(self.headers['Authorization'][7:].encode()).hexdigest(),))\n                    return self.send(200,{'ok':True})\n                if path not in routes:\n                    raise Problem('Không tìm thấy',404)\n                return self.send(200,routes[path](user,data))\n            except Problem as e:\n                self.send(e.status,{'error':str(e)})\n            except (ValueError,TypeError,KeyError):\n                self.send(400,{'error':'Dữ liệu gửi lên không hợp lệ'})\n            except Exception:\n                import traceback\n                traceback.print_exc()\n                self.send(500,{'error':'Lỗi server; thao tác chưa được xác nhận.'})\n    return Handler\n\n\ndef main():\n    parser=argparse.ArgumentParser()\n    parser.add_argument('--db',default=str(ROOT/'data'/'traceability.sqlite3'))\n    parser.add_argument('--host',default='127.0.0.1')\n    parser.add_argument('--port',type=int,default=8080)\n    parser.add_argument('--init-admin',action='store_true')\n    parser.add_argument('--cert',help='PEM certificate for HTTPS')\n    parser.add_argument('--key',help='PEM private key for HTTPS')\n    parser.add_argument('--backup',metavar='PATH')\n    args=parser.parse_args(); store=Store(args.db)\n    if args.backup:\n        target=Path(args.backup).resolve()\n        if target.exists() or target==Path(args.db).resolve():\n            parser.error('Backup phải là file mới')\n        with store.connect() as source, sqlite3.connect(target) as dest:\n            source.backup(dest)\n        print('Backup:',target); return\n    if args.init_admin:\n        username=input('Username: ')\n        name=input('Ho ten: ')\n        password=getpass.getpass('Mat khau (>=12 ky tu): ')\n        if password!=getpass.getpass('Nhap lai: '):\n            parser.error('Mat khau khong khop')\n        store.create_user(None,{'username':username,'name':name,'password':password,'role':'admin','stages':[]})\n        print('Da tao quan tri.'); return\n    with store.connect() as db:\n        if not db.execute('SELECT 1 FROM users LIMIT 1').fetchone():\n            parser.error('Chay --init-admin truoc')\n    if bool(args.cert)!=bool(args.key):\n        parser.error('Cần cả --cert và --key')\n    if args.host not in ('127.0.0.1','localhost','::1') and not args.cert:\n        parser.error('Khi mở qua mạng LAN, dùng --cert và --key do IT cấp, hoặc reverse proxy HTTPS với server bind 127.0.0.1')\n    server=ThreadingHTTPServer((args.host,args.port),handler(store))\n    if args.cert:\n        context=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)\n        context.minimum_version=ssl.TLSVersion.TLSv1_2\n        context.load_cert_chain(args.cert,args.key)\n        server.socket=context.wrap_socket(server.socket,server_side=True)\n    print(f'iLD Process Flow: {\"https\" if args.cert else \"http\"}://{args.host}:{args.port}',flush=True)\n    try:\n        server.serve_forever()\n    except KeyboardInterrupt:\n        pass\n    finally:\n        server.server_close()\n\n\nif __name__=='__main__':\n    main()\n",
    "lan/README.md": "# iLD Process Flow Web — phiên bản pilot, HTML gộp 08/10/2026\n\nỨng dụng web có đăng nhập, dữ liệu tập trung trên máy chủ, dùng trình duyệt trên máy của từng đại diện. Python 3.12+; không cần cài thư viện bên ngoài hoặc truy cập Internet để chạy. Đã kiểm thử với Python 3.12 và Chrome trên Windows.\n\n## File HTML duy nhất\n\nToàn bộ giao diện ở `index.html`: phần legacy bên ngoài và giao diện LAN trong `\u003ctemplate id=\"ild-lan-template\">`. Server trích fragment giữa hai marker `BEGIN ILD LAN FRAGMENT` / `END ILD LAN FRAGMENT` để phục vụ `/` và `/lan/`. Tab Process Flow của legacy dùng iframe `srcdoc` từ cùng template. Không dùng `lan/app.html` nữa.\n\nNếu nhận bàn giao chỉ có HTML: mở `index.html`, bấm **Tải bộ server**, giải nén ZIP vào một thư mục và đặt bản `index.html` gốc cạnh `START_WEB.cmd`. Bộ nhúng chỉ chứa mã nguồn và tài liệu, không chứa DB hoặc tài khoản nhà máy. HTML tự thân không chạy Python hay chia sẻ LocalStorage giữa các máy.\n\n## Chạy trên máy này\n\n1. Mở `SETUP_ADMIN.cmd` tại thư mục dự án. Nhập tên đăng nhập, họ tên và mật khẩu ít nhất 12 ký tự. Mật khẩu được nhập ẩn và lưu dạng scrypt. Không có tài khoản mặc định.\n2. Mở `START_WEB.cmd`, giữ cửa sổ server đang chạy.\n3. Mở **http://127.0.0.1:8080** và đăng nhập.\n4. Trong Tài khoản, tạo QA và đại diện; chọn các công đoạn đại diện được phép sửa.\n5. QA tạo đợt. Các đại diện chọn công đoạn, tạo phiếu, nhập đầu vào/đầu ra, lưu rồi gửi xác nhận.\n\nCũng có thể chạy trong PowerShell tại thư mục dự án:\n\n```powershell\npython lan/server.py --init-admin\npython lan/server.py\n```\n\n`START_WEB.cmd` chạy thử ở localhost. Để các máy khác truy cập, IT cấu hình HTTPS và địa chỉ server theo mục tiếp theo. Đây là ứng dụng có backend; chỉ đưa HTML lên một web server tĩnh sẽ không có đăng nhập và dữ liệu dùng chung.\n\n## Triển khai qua mạng nội bộ\n\nChọn máy chủ luôn hoạt động, gán tên DNS nội bộ và chứng thư TLS do IT cấp. Hai cách triển khai:\n\n- Reverse proxy HTTPS của nhà máy chuyển tiếp đến `127.0.0.1:8080` trên cùng máy. Giữ nguyên Host gốc khi proxy, ví dụ `traceability.factory.local`. Chỉ proxy mới tiếp cận cổng backend. Giữ Origin và Authorization khi chuyển tiếp.\n- Với pilot nhỏ, Python có thể phục vụ HTTPS trực tiếp:\n\n```powershell\npython lan/server.py --host 0.0.0.0 --port 8443 --cert \"D:\\Certificates\\traceability.crt\" --key \"D:\\Certificates\\traceability.key\"\n```\n\nSau đó người dùng truy cập `https://\u003cten-server-trong-chung-thu>:8443`. Chứng thư phải được máy trạm tin cậy. Server từ chối bind LAN bằng HTTP thuần; thông tin đăng nhập cần HTTPS. Tên máy, chứng thư, firewall, tài khoản chạy dịch vụ và tự khởi động cùng Windows do IT cấu hình khi triển khai. Chưa thay đổi các thiết lập đó trên máy người dùng.\n\nSQLite nằm ở `data/traceability.sqlite3` trên đĩa cục bộ của server. Không đặt DB trên thư mục SMB dùng chung, không chạy nhiều bản server trên các máy khác nhau trỏ tới một file mạng. Một tiến trình server tiếp nhận nhiều máy trạm; giao dịch ghi được tuần tự hóa. Nếu tải sử dụng vượt phạm vi pilot, chuyển DB/server sau đo tải thực tế.\n\n## Luồng thao tác\n\n- **Process Flow:** chọn khối công đoạn, chọn hoặc tạo phiếu. Mỗi phiếu là một mẻ/lần chạy/PO; có nhiều dòng input/output.\n- **Liên kết:** tại đầu vào chọn “Nhận từ phiếu nguồn”, chọn đúng đầu ra. App kế thừa material, batch, SSCC và đơn vị. Nhập lượng sử dụng cho mẻ này. Server kiểm tra tổng phân bổ mọi mẻ không vượt lượng nguồn, kể cả khi hai người lưu đồng thời.\n- **Mass balance:** chọn basis và hệ số nhân cho từng dòng. Khai căn cứ, kể cả hệ số 1 khi đã cùng basis. Server đánh giá riêng từng basis. Số liệu thiếu không được xem là cân bằng. Ngưỡng và căn cứ phải được QA kiểm tra.\n- **Truy xuất:** tìm thông tin đã biết hoặc chọn “Truy xuất từ mẻ này”. Chọn ngược/xuôi/cả hai. Kết quả dựa trên quan hệ input/output theo ID. Truy cả hai là hợp của truy ngược và truy xuôi từ cùng điểm, không tự lan sang mọi lô cùng dùng một tổ tiên. Muốn điều tra nguồn nghi ngờ, chọn tổ tiên làm điểm bắt đầu mới.\n- **Phê duyệt:** Nháp → Gửi xác nhận → QA xác minh. QA chỉ xác minh khi đủ thời gian/chứng từ, balance trong ngưỡng và nguồn liên quan đã xác minh. Utility không tính mass balance.\n- **Sửa nguồn:** phiếu đã xác minh phải được QA mở lại với lý do. Phiếu phụ thuộc được chuyển sang Cần xem lại. Không thể xóa/đổi định danh một đầu ra đang được sử dụng hoặc giảm lượng xuống dưới tổng đã cấp.\n- **Utility/CIP:** tạo phiếu thiết bị/thời gian/chứng từ; đại diện chọn rõ phiếu đó trong mẻ liên quan. Liên kết điều kiện có nét riêng. App chưa tự suy ra khoảng thời gian ảnh hưởng.\n- **Đóng đợt:** chỉ QA/quản trị, khi mọi phiếu đã xác minh. Server lưu snapshot và khóa sửa. Không có mở lại đợt đã đóng trong phiên bản này.\n- **Báo cáo:** dữ liệu chung từ các phiếu, in/PDF bằng trình duyệt và xuất JSON theo đợt. Đây là báo cáo Process Flow mới, chưa phải thay thế đã nghiệm thu cho mẫu QA.F.029/030.\n\nTrình duyệt kiểm tra dữ liệu mới mỗi 15 giây khi không đang nhập. Khi đang nhập, giữ bản đang làm việc. Nếu người khác đã sửa cùng phiếu, lưu trả lỗi xung đột, giữ nội dung trong form để đối chiếu; bấm Tải lại sẽ hỏi trước khi bỏ bản chưa lưu. Phiên đăng nhập tồn tại 8 giờ, token chỉ trong bộ nhớ trang. Tải lại cả trang cần đăng nhập lại; hãy lưu trước khi đóng trang.\n\n## Dữ liệu cũ\n\n`index.html` giữ ứng dụng offline. Mở `/legacy` qua server rồi chọn tab Process Flow sẽ nhúng màn hình web mới. Các tab khác vẫn dùng LocalStorage riêng và không đồng bộ với DB của server. Không tự nhập dữ liệu legacy vào các liên kết mới vì nguồn cũ chưa có ID quan hệ và phân bổ đủ tin cậy.\n\nKhông di chuyển file HTML cũ hoặc coi cùng tên batch là cùng một đối tượng đã xác minh. Bản pilot dùng kho sự kiện riêng trong mỗi đợt, chưa chia sẻ genealogy giữa các đợt. Khi đưa dữ liệu thật vào phải xác định phạm vi và nhập/đối chiếu nguồn trước.\n\n## Backup và phục hồi\n\nXuất JSON đợt là bản dữ liệu tham khảo, không phải backup toàn bộ tài khoản/nhật ký. Dùng SQLite backup API để tạo backup đầy đủ trong lúc server chạy:\n\n```powershell\npython lan/server.py --backup \"D:\\Backups\\traceability-2026-10-07.sqlite3\"\n```\n\nThư mục đích cần tồn tại, file đích phải mới. IT bảo vệ quyền truy cập DB, backup và khóa TLS. Bản backup chứa dữ liệu nghiệp vụ và hash tài khoản. Khôi phục an toàn bằng cách dừng server, giữ DB đang dùng, rồi chạy `--db` trỏ tới bản sao được phục hồi và kiểm tra trước khi chuyển người dùng sang đó. Không ghi đè DB đang mở. Không copy đơn lẻ file `.sqlite3` đang chạy mà bỏ các file WAL; dùng lệnh backup ở trên.\n\n## Phạm vi và giới hạn pilot\n\n- Đã có đăng nhập, tạo tài khoản, quyền theo công đoạn, kiểm soát phiên bản, nhật ký server và khóa phiếu/đợt.\n- UI hiện chưa có chức năng đổi/reset mật khẩu hoặc vô hiệu hóa tài khoản; cần hoàn thiện quản trị vòng đời tài khoản trước khi vận hành rộng.\n- Chứng từ hiện là mã/tham chiếu file; chưa upload file đính kèm, tích hợp SAP, tự đối chiếu Utility hay quét mã.\n- Input “Nguồn ngoài / chưa liên kết” là ranh giới truy xuất cần QA kiểm chứng; không được diễn giải là genealogy đã hoàn chỉnh.\n- Liên kết cấp liệu lưu lượng dùng và kiểm tra lượng khả dụng; chưa có quy trình bàn giao hai bên với lượng xuất và lượng thực nhận độc lập.\n- Sơ đồ công đoạn tổng hợp các mẻ; kết quả truy từ Batch/SSCC được neo vào mẻ có chứa đối tượng đó, phạm vi có thể bao gồm các đầu ra khác của cùng mẻ. Chưa có phân bổ chính xác từng phần vật chất qua quá trình trộn.\n- Các hệ số và ngưỡng pilot do người nhập khai báo, QA xác minh. Chưa xác nhận công thức với Excel mass balance gốc của nhà máy. Không coi nhãn Trong ngưỡng là đạt toàn bộ yêu cầu truy xuất.\n- Đã thử chức năng và một số ghi đồng thời, chưa kiểm thử tải sản xuất, SSO, vận hành dịch vụ Windows hoặc kết nối qua máy trạm thật.\n\n## Kiểm thử\n\n```powershell\npython -m unittest discover -s tests -p test_lan.py -v\n```\n\n11 kiểm thử server: đăng nhập/phân quyền, ghi đồng thời/xung đột, phân bổ đồng thời, chia lô, bảo vệ nguồn đang dùng, chu trình rework, balance riêng basis/dữ liệu thiếu, xác minh phụ thuộc, Utility, snapshot/backup, API và bảo vệ đường dẫn dữ liệu.\n\n`tests/serve_fixture.py` chỉ mở fixture trên `127.0.0.1:8097` với DB mới trong `.test-output`. Tài khoản trong file đó chỉ dành cho kiểm thử. Không dùng fixture làm server nhà máy. `tests/browser_lan.cjs` dùng Playwright/Chrome để kiểm tra tương tác web; đặt `PLAYWRIGHT_MODULE` tới module Playwright có sẵn trước khi chạy. Không cần Playwright để chạy ứng dụng.\n\nĐã kiểm tra bằng Chrome headless: đăng nhập, lưu/xác minh, chọn nguồn, truy ngược/xuôi, giữ dữ liệu chưa lưu, tìm kiếm, báo cáo, nhật ký, tạo tài khoản, quyền đại diện, màn hình nhỏ và tab legacy. Các file ảnh kiểm tra ở `.test-output` không được đưa vào Git.\n",
