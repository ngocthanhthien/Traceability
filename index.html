<html lang="vi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLD Coffee — Hệ thống Truy xuất Nguồn gốc (Traceability)</title>
<!--
  ============================================================================
  iLD COFFEE VIETNAM — TRACEABILITY SYSTEM (single-file, offline, LocalStorage)
  Chuẩn tham chiếu: FSSC 22000 v5.1 / BRC issue 9 / IFS Food v7
  Tác giả seed: QA Hygiene & FS. Chạy tốt trên Chrome/Windows.
  Kiến trúc theo module (comment vùng mã):
    [CONFIG]   Hằng số, ngưỡng
    [SEED]     Dữ liệu Annex 1 (Backward/Forward) + danh bạ PIC
    [STORE]    LocalStorage: load/save/backup/restore
    [STATE]    Trạng thái ứng dụng
    [UI]       Render từng tab
    [LOGIC]    Đợt truy xuất, email, checklist, mass balance, báo cáo
    [UTILS]    Tiện ích chung
  ============================================================================
-->
<style>
/* ===================== [THEME] Industrial Dashboard - Light ================ */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f7f9fc; --ink:#1a2230; --ink-soft:#5b6676;
  --line:#d9dfe8; --brand:#0b5cab; --brand-2:#0a4a8a; --brand-soft:#e5f0fb;
  --ok:#1a8a4a; --ok-soft:#e2f5ea; --warn:#c67a00; --warn-soft:#fdf2dd;
  --bad:#c0392b; --bad-soft:#fbe6e3; --na:#7a869a; --na-soft:#eef1f5;
  --shadow:0 1px 3px rgba(16,32,64,.08),0 4px 14px rgba(16,32,64,.06);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{margin:0}
.hidden{display:none!important}

/* ---- Layout ---- */
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;height:100vh}
header#topbar{grid-column:1/3;background:linear-gradient(90deg,var(--brand-2),var(--brand));
  color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:var(--shadow);z-index:5}
#topbar .logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:16px}
#topbar h1{font-size:16px;font-weight:700;letter-spacing:.2px}
#topbar .sub{font-size:11px;opacity:.85;font-weight:400}
#topbar .spacer{flex:1}
#topbar .pill{background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px;font-size:12px}
#topbar button.mini{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:6px 12px;border-radius:7px;font-size:12px}
#topbar button.mini:hover{background:rgba(255,255,255,.28)}

nav#side{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
nav#side .navbtn{width:100%;text-align:left;background:transparent;border:0;color:var(--ink-soft);
  padding:11px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:2px}
nav#side .navbtn .ico{width:20px;text-align:center}
nav#side .navbtn:hover{background:var(--panel-2);color:var(--ink)}
nav#side .navbtn.active{background:var(--brand-soft);color:var(--brand-2)}
nav#side .navbtn .badge{margin-left:auto;background:var(--brand);color:#fff;border-radius:12px;
  font-size:11px;padding:1px 7px;font-weight:700}
nav#side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--na);
  padding:12px 12px 4px}

main#view{overflow:auto;padding:18px 22px}
.page{max-width:1180px;margin:0 auto}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.page-h h2{font-size:20px}
.page-h .desc{color:var(--ink-soft);font-size:13px}
.page-h .spacer{flex:1}

/* ---- Common ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.fld{display:block;margin-bottom:10px}
label.fld .lb{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
input.in,select.in,textarea.in{width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink)}
textarea.in{resize:vertical;min-height:74px}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.tag.b{background:var(--brand-soft);color:var(--brand-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.na{background:var(--na-soft);color:var(--na)}
.muted{color:var(--ink-soft)}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

/* ---- KPI ---- */
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .n{font-size:30px;font-weight:800;line-height:1}
.kpi .l{color:var(--ink-soft);font-size:12.5px;margin-top:6px;font-weight:600}
.kpi .ic{position:absolute;right:12px;top:12px;font-size:26px;opacity:.18}

/* ---- Table ---- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tbl th{background:var(--panel-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);position:sticky;top:0}
table.tbl tr:hover td{background:#fafbfe}
.stage-row td{background:var(--brand-soft)!important;font-weight:700;color:var(--brand-2)}

/* ---- Progress ---- */
.bar{height:8px;background:var(--na-soft);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.bar.warn>i{background:var(--warn)}

/* ---- Countdown ---- */
.count{font-variant-numeric:tabular-nums;font-weight:800;font-size:26px;letter-spacing:1px}
.count.ok{color:var(--ok)} .count.warn{color:var(--warn)} .count.bad{color:var(--bad)}

/* ---- Segmented ---- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:8px 16px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--brand);color:#fff}

/* ---- Toast ---- */
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast .t{background:var(--ink);color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);
  font-size:13px;opacity:0;transform:translateY(8px);animation:tin .25s forwards}
#toast .t.ok{background:var(--ok)} #toast .t.bad{background:var(--bad)} #toast .t.warn{background:var(--warn)}
@keyframes tin{to{opacity:1;transform:none}}

/* ---- Modal ---- */
#modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:80}
#modal .box{background:#fff;border-radius:12px;max-width:520px;width:92%;padding:20px;box-shadow:var(--shadow)}
#modal h3{font-size:17px;margin-bottom:8px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ---- Empty ---- */
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
.empty .big{font-size:40px;opacity:.4;margin-bottom:8px}

/* ---- Print ---- */
@media print{
  #topbar,nav#side,#tab-dashboard,.noprint{display:none!important}
  #app{display:block}
  main#view{overflow:visible;padding:0}
  .card{box-shadow:none;border:1px solid #bbb}
}
</style>
<style id="ild-theme-style">
/* ===================== [ILD-THEME] ILD Crafted — design tokens ===================== */
/* Sáng · tương phản tiêu chuẩn (mặc định) */
:root{
  color-scheme:light;
  --bg:#F7F0E6; --panel:#FFFFFF; --panel-2:#FBF4E8; --ink:#2A2018; --ink-soft:#6B5842;
  --brand:#382E28; --brand-2:#514135; --brand-soft:#F6E8CF;
  --ok:#177A41; --ok-soft:#E2F5EA; --warn:#96590A; --warn-soft:#FDF2DD;
  --bad:#B42318; --bad-soft:#FBE6E3; --na:#6E6254; --na-soft:#EFE7DA;
  --radius:14px;
  --ild-nav-bg:#FBF4E8; --ild-field:#FFFFFF; --ild-btn-bg:#FFFFFF; --ild-btn-hover:#FBF4E8; --ild-raised:#FFFFFF;
  --ild-on-brand:#FFFFFF; --ild-row-hover:#FDF9F1; --ild-accent:#8A5A2F; --ild-red:#E30613;
  --ild-focus:#2563EB; --ild-focus-w:2px; --ild-sel-ring:0 0 0 0 transparent;
  --ild-info:#1D4ED8; --ild-info-soft:#E3ECFD;
  --ild-ok-solid:#177A41; --ild-warn-solid:#96590A; --ild-bad-solid:#B42318;
  --ild-toast-bg:#382E28; --ild-toast-fg:#FFFFFF;
  --ild-line-soft:#EFE3CE; --ild-line-std:#E6D6BA; --ild-line-strong:#D2BD99;
  --ild-fb-std:#99897A; --ild-fb-strong:#7A6B5D;
  --ild-btnb-soft:#DCCDB4; --ild-btnb-std:#CDBBA0; --ild-btnb-strong:#A8957B;
  --ild-shadow-soft:0 0 0 0 transparent; --ild-shadow-std:0 1px 2px rgba(56,46,40,.06); --ild-shadow-strong:0 1px 3px rgba(56,46,40,.16);
  /* Độ đậm tiêu chuẩn */
  --line:var(--ild-line-std); --ild-field-border:var(--ild-fb-std); --ild-btn-border:var(--ild-btnb-std);
  --shadow:var(--ild-shadow-std); --ild-w-body:400; --ild-w-strong:600;
}
/* Tối · tương phản tiêu chuẩn (hệ nâu ấm) */
:root[data-ild-scheme="dark"]{
  color-scheme:dark;
  --bg:#1F1A17; --panel:#2A231F; --panel-2:#342B25; --ink:#F5EEE5; --ink-soft:#C7B8A8;
  --brand:#E5D8C8; --brand-2:#F3EADF; --brand-soft:#4A3A2A;
  --ok:#7DD3A0; --ok-soft:#1F3A2B; --warn:#F0B95C; --warn-soft:#453414;
  --bad:#F58B7E; --bad-soft:#4A211C; --na:#B9AB9B; --na-soft:#3A312A;
  --ild-nav-bg:#241E1A; --ild-field:#1F1A17; --ild-btn-bg:#342B25; --ild-btn-hover:#40352D; --ild-raised:#342B25;
  --ild-on-brand:#382E28; --ild-row-hover:#302822; --ild-accent:#D2A679;
  --ild-focus:#8AB4FF;
  --ild-info:#9DBFFF; --ild-info-soft:#1E2F4D;
  --ild-toast-bg:#F5EEE5; --ild-toast-fg:#2A2018;
  --ild-line-soft:#40362E; --ild-line-std:#54483E; --ild-line-strong:#756658;
  --ild-fb-std:#8C7B6B; --ild-fb-strong:#A99885;
  --ild-btnb-soft:#5E5146; --ild-btnb-std:#756658; --ild-btnb-strong:#94836F;
  --ild-shadow-soft:0 0 0 0 transparent; --ild-shadow-std:0 1px 2px rgba(0,0,0,.35); --ild-shadow-strong:0 2px 6px rgba(0,0,0,.5);
}
/* Sáng · tương phản cao */
:root[data-ild-contrast="high"]{
  --ink:#1A120B; --ink-soft:#4A3A2A; --brand:#241C17; --brand-2:#3D3028; --brand-soft:#EFD9B0;
  --ok:#0F5F30; --warn:#734200; --bad:#8F1D12; --na:#4F453A;
  --ild-btn-hover:#F6E8CF; --ild-accent:#6E4521; --ild-info:#1E3FA8;
  --ild-ok-solid:#0F5F30; --ild-warn-solid:#734200; --ild-bad-solid:#8F1D12; --ild-toast-bg:#241C17;
  --ild-focus-w:3px; --ild-sel-ring:inset 0 0 0 2px var(--brand);
  --ild-line-soft:#D9C7A6; --ild-line-std:#C4AE88; --ild-line-strong:#A8916B;
  --ild-fb-std:#5E5044; --ild-fb-strong:#3F342B;
  --ild-btnb-soft:#A8957B; --ild-btnb-std:#8A7862; --ild-btnb-strong:#6B5A48;
}
/* Tối · tương phản cao */
:root[data-ild-scheme="dark"][data-ild-contrast="high"]{
  --bg:#161210; --panel:#211B17; --panel-2:#2C241F; --ink:#FFFFFF; --ink-soft:#E6DACB;
  --brand:#F5ECE0; --brand-2:#FFFFFF; --brand-soft:#5A4630;
  --ok:#9BE8BB; --warn:#FFD080; --bad:#FFA69B; --na:#D6C9B9;
  --ild-nav-bg:#1B1613; --ild-field:#161210; --ild-btn-bg:#2C241F; --ild-btn-hover:#3A3029; --ild-raised:#2C241F;
  --ild-row-hover:#2A221D; --ild-accent:#E8C198; --ild-focus:#A9C8FF; --ild-info:#BBD3FF;
  --ild-ok-solid:#177A41; --ild-warn-solid:#96590A; --ild-bad-solid:#B42318; --ild-toast-bg:#FFFFFF; --ild-toast-fg:#1A120B;
  --ild-line-soft:#6A5C4F; --ild-line-std:#8A7A6A; --ild-line-strong:#A99885;
  --ild-fb-std:#C7B8A8; --ild-fb-strong:#E0D3C4;
  --ild-btnb-soft:#94836F; --ild-btnb-std:#B3A290; --ild-btnb-strong:#CDBDAA;
}
/* Độ đậm hiển thị: chỉ đổi nét viền, bóng và weight — không đổi cỡ chữ/kích thước */
:root[data-ild-emphasis="light"]{
  --line:var(--ild-line-soft); --ild-btn-border:var(--ild-btnb-soft); --shadow:var(--ild-shadow-soft);
}
:root[data-ild-emphasis="bold"]{
  --line:var(--ild-line-strong); --ild-field-border:var(--ild-fb-strong); --ild-btn-border:var(--ild-btnb-strong);
  --shadow:var(--ild-shadow-strong); --ild-w-body:500; --ild-w-strong:700;
}

/* ===================== [ILD-THEME] Áp nhận diện lên thành phần hiện có ============== */
body{font:14px/1.5 "Segoe UI",Arial,sans-serif;font-weight:var(--ild-w-body)}
h1,h2,h3,h4{font-weight:var(--ild-w-strong)}
header#topbar{background:var(--ild-nav-bg);color:var(--ink);box-shadow:none;border-bottom:1px solid var(--line)}
#topbar .logo{width:auto;height:auto;padding:7px 10px;border-radius:8px;background:#FFFFFF;border:1px solid var(--line)}
#topbar .logo .ild-theme-logo{display:block;height:28px;width:auto}
#topbar h1{font-weight:var(--ild-w-strong)}
#topbar .sub{opacity:1;color:var(--ink-soft)}
#topbar .pill{background:var(--brand-soft);color:var(--ink)}
#topbar button.mini{background:var(--ild-btn-bg);border:1px solid var(--ild-btn-border);color:var(--ink);border-radius:6px}
#topbar button.mini:hover{background:var(--ild-btn-hover)}
nav#side{background:var(--ild-nav-bg)}
nav#side .navbtn{border-radius:6px;font-weight:var(--ild-w-strong)}
nav#side .navbtn:hover{background:var(--na-soft);color:var(--ink)}
nav#side .navbtn.active{background:var(--brand-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--ild-red),var(--ild-sel-ring)}
nav#side .navbtn .badge{color:var(--ild-on-brand)}
nav#side .grp{color:var(--ild-accent)}
.page-h h2{font-size:22px}
label.fld .lb{font-weight:var(--ild-w-strong)}
input.in,select.in,textarea.in{border:1px solid var(--ild-field-border);border-radius:6px;background:var(--ild-field);color:var(--ink)}
input.in:focus,select.in:focus,textarea.in:focus{outline:var(--ild-focus-w) solid var(--ild-focus);outline-offset:0;border-color:var(--ild-focus);box-shadow:none}
.btn{border:1px solid var(--ild-btn-border);background:var(--ild-btn-bg);color:var(--ink);border-radius:6px;font-weight:var(--ild-w-strong)}
.btn:hover{background:var(--ild-btn-hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--ild-on-brand)}

.btn.ok{background:var(--ild-ok-solid);border-color:var(--ild-ok-solid);color:#FFFFFF}
.btn.danger{background:var(--ild-btn-bg);border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible{outline:var(--ild-focus-w) solid var(--ild-focus);outline-offset:2px}
.tag.b{background:var(--ild-info-soft);color:var(--ild-info)}
table.tbl th{font-weight:var(--ild-w-strong)}
table.tbl tr:hover td{background:var(--ild-row-hover)}
.seg{border:1px solid var(--ild-btn-border);border-radius:6px}
.seg button{background:var(--ild-btn-bg);font-weight:var(--ild-w-strong)}
.seg button.on{background:var(--brand);color:var(--ild-on-brand);box-shadow:var(--ild-sel-ring)}
#toast .t{background:var(--ild-toast-bg);color:var(--ild-toast-fg);border-radius:8px}
#toast .t.ok{background:var(--ild-ok-solid);color:#FFFFFF}
#toast .t.bad{background:var(--ild-bad-solid);color:#FFFFFF}
#toast .t.warn{background:var(--ild-warn-solid);color:#FFFFFF}
#modal .box{background:var(--ild-raised);color:var(--ink);border-radius:18px}

/* ===================== [ILD-THEME] Thanh tab nằm ngang phía trên ==================== */

header#topbar{grid-column:1}
nav#side{display:flex;align-items:center;gap:4px;min-width:0;padding:6px 18px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
nav#side .navbtn{flex:0 0 auto;width:auto;margin-bottom:0;padding:8px 12px}
nav#side .navbtn.active{box-shadow:inset 0 -3px 0 var(--ild-red),var(--ild-sel-ring)}
nav#side .navbtn .badge{margin-left:6px}

/* ===================== [ILD-THEME] Bảng tùy chỉnh giao diện ========================= */
.ild-theme-overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(31,26,23,.5)}

.ild-theme-group legend{padding:0;margin-bottom:8px;font-size:12px;font-weight:var(--ild-w-strong);color:var(--ild-accent);text-transform:uppercase;letter-spacing:.5px}
.ild-theme-opts{display:flex;flex-wrap:wrap;gap:8px}
.ild-theme-presets{display:grid;grid-template-columns:1fr 1fr}

.ild-theme-opt input:checked+span{background:var(--brand-soft);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.ild-theme-opt input:checked+span::before{content:"✓ "}
.ild-theme-opt input:focus-visible+span{outline:var(--ild-focus-w) solid var(--ild-focus);outline-offset:2px}
.ild-theme-acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){
  .bar>i{transition:none}
  #toast .t{animation:none;opacity:1;transform:none}
}
@media print{
  #ild-theme-open,.ild-theme-overlay{display:none!important}
  body{background:#FFFFFF}
}

<script id="ild-theme-script">
/* ===================== [ILD-THEME] Mô-đun giao diện (độc lập với nghiệp vụ) ========= */
(function(){
  'use strict';
  var KEY='ild-crafted-appearance-v1';
  var OPTIONS={appearance:['light','dark','system'],contrast:['standard','high'],emphasis:['light','standard','bold']};
  var FIELDS=['appearance','contrast','emphasis'];
  var DEFAULTS={appearance:'light',contrast:'standard',emphasis:'standard'};
  var PRESETS={
    standard:{name:'Crafted tiêu chuẩn',appearance:'light',contrast:'standard',emphasis:'standard'},
    soft:{name:'Crafted dịu',appearance:'light',contrast:'standard',emphasis:'light'},
    dark:{name:'Crafted tối',appearance:'dark',contrast:'standard',emphasis:'standard'},
    sharp:{name:'Crafted rõ nét',appearance:'light',contrast:'high',emphasis:'bold'}
  };
  var root=document.documentElement;
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  var printing=false, state=read(), overlay=null, opener=null;

  function read(){
    var s={appearance:DEFAULTS.appearance,contrast:DEFAULTS.contrast,emphasis:DEFAULTS.emphasis};
    try{
      var o=JSON.parse(window.localStorage.getItem(KEY)||'null');
      if(o&&o.v===1) FIELDS.forEach(function(k){ if(OPTIONS[k].indexOf(o[k])>=0) s[k]=o[k]; });
    }catch(e){}
    return s;
  }
  function write(){
    try{ window.localStorage.setItem(KEY,JSON.stringify({v:1,appearance:state.appearance,contrast:state.contrast,emphasis:state.emphasis})); }catch(e){}
  }
  function scheme(){
    if(printing) return 'light';
    if(state.appearance==='system') return mq&&mq.matches?'dark':'light';
    return state.appearance;
  }
  function apply(){
    root.setAttribute('data-ild-appearance',state.appearance);
    root.setAttribute('data-ild-scheme',scheme());
    root.setAttribute('data-ild-contrast',state.contrast);
    root.setAttribute('data-ild-emphasis',state.emphasis);
  }
  function presetKey(){
    for(var k in PRESETS){ var p=PRESETS[k];
      if(p.appearance===state.appearance&&p.contrast===state.contrast&&p.emphasis===state.emphasis) return k; }
    return '';
  }
  function sync(){
    if(!overlay) return;
    var pk=presetKey();
    overlay.querySelectorAll('input[type="radio"]').forEach(function(r){
      var f=r.name.replace('ild-theme-','');
      r.checked = f==='preset' ? r.value===pk : state[f]===r.value;
    });
    var cur=document.getElementById('ild-theme-current');
    if(cur) cur.textContent = pk?PRESETS[pk].name:'Tùy chỉnh';
  }
  function update(){ apply(); write(); sync(); }

  apply();   // áp dụng sớm, trước khi vẽ trang

  if(mq){
    var onSystem=function(){ if(state.appearance==='system') apply(); };
    if(mq.addEventListener) mq.addEventListener('change',onSystem); else if(mq.addListener) mq.addListener(onSystem);
  }
  // Bản in luôn dùng bảng màu sáng
  window.addEventListener('beforeprint',function(){ printing=true; apply(); });
  window.addEventListener('afterprint',function(){ printing=false; apply(); });

  function focusables(){
    return Array.prototype.slice.call(overlay.querySelectorAll('button,input')).filter(function(el){ return !el.disabled; });
  }
  function open(){
    if(!overlay||!overlay.hidden) return;
    opener=document.activeElement; sync(); overlay.hidden=false;
    var c=document.getElementById('ild-theme-close'); if(c) c.focus();
  }
  function close(){
    if(!overlay||overlay.hidden) return;
    overlay.hidden=true;
    if(opener&&opener.focus) opener.focus();
    opener=null;
  }
  function init(){
    overlay=document.getElementById('ild-theme-overlay');
    var btn=document.getElementById('ild-theme-open');
    if(!overlay||!btn) return;
    btn.addEventListener('click',open);
    document.getElementById('ild-theme-close').addEventListener('click',close);
    document.getElementById('ild-theme-done').addEventListener('click',close);
    document.getElementById('ild-theme-reset').addEventListener('click',function(){
      state={appearance:DEFAULTS.appearance,contrast:DEFAULTS.contrast,emphasis:DEFAULTS.emphasis};
      update();
    });
    overlay.addEventListener('mousedown',function(e){ if(e.target===overlay) close(); });
    overlay.addEventListener('change',function(e){
      var r=e.target; if(!r||r.type!=='radio'||!r.checked) return;
      var f=r.name.replace('ild-theme-','');
      if(f==='preset'){ var p=PRESETS[r.value]; if(!p) return;
        state={appearance:p.appearance,contrast:p.contrast,emphasis:p.emphasis}; }
      else if(OPTIONS[f]&&OPTIONS[f].indexOf(r.value)>=0) state[f]=r.value;
      else return;
      update();
    });
    // Phím chỉ xử lý bên trong bảng giao diện
    overlay.addEventListener('keydown',function(e){
      if(e.key==='Escape'){ e.preventDefault(); close(); return; }
      if(e.key!=='Tab') return;
      var f=focusables(); if(!f.length) return;
      var first=f[0], last=f[f.length-1], a=document.activeElement;
      if(e.shiftKey&&a===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&a===last){ e.preventDefault(); first.focus(); }
    });
    sync();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>

// Xây/đồng bộ checklist cho một đợt theo chiều truy xuất từ catalog
function buildChecklist(dir){
  const src = dir==='forward'?DB.catalog.forward:DB.catalog.backward;
  return src.map(g=>({ stage:g.stage, pic:g.pic,
    items:g.forms.map(f=>({ id:uid(), form:f, status:'', receivedAt:null, remark:'' })) }));
}
// Thống kê tiến độ checklist 1 đợt
function checklistStats(ex){
  let total=0,done=0,na=0,miss=0;
  (ex.checklist||[]).forEach(g=>g.items.forEach(it=>{
    total++;
    if(it.status==='yes')done++;
    else if(it.status==='na')na++;
    else if(it.status==='no')miss++;
  }));
  const base=total-na;
  const pct= base>0?Math.round(done/base*100):0;
  return {total,done,na,miss,pct};
}
// Tiến độ theo bộ phận (PIC)
function picProgress(ex){
  const map={};
  (ex.checklist||[]).forEach(g=>{
    if(!map[g.pic])map[g.pic]={done:0,base:0};
    g.items.forEach(it=>{ if(it.status==='na')return; map[g.pic].base++; if(it.status==='yes')map[g.pic].done++; });
  });
  return map;
}
// Trạng thái thời gian 4h
function timeStatus(ex){
  if(!ex.startAt) return {state:'idle',text:'Chưa bắt đầu',remainMs:null};
  const max=(DB.settings.maxHours||4)*3600000;
  const end=ex.startAt+max;
  if(ex.finishAt){
    const used=ex.finishAt-ex.startAt;
    return {state: used<=max?'done-ok':'done-late',
      text:(used<=max?'Hoàn thành đúng hạn':'Hoàn thành trễ')+' ('+fmtDur(used)+')', remainMs:0};
  }
  const remain=end-Date.now();
  return {state: remain>0?'running':'overdue', remainMs:remain,
    text: remain>0?'Còn lại '+fmtDur(remain):'Quá hạn '+fmtDur(-remain)};
}
function fmtDur(ms){ const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }

/* ---- Mass Balance theo logic ILD (2 stage + quy đổi basis) ----
   Mỗi công đoạn: INPUT, Downgrade, Thất thoát(loss), Lấy mẫu(sampling), In stock,
   Output lý thuyết = INPUT − Downgrade − Loss − Sampling − Instock,
   Tỉ lệ thu hồi = Output thực tế / Output lý thuyết, Gap = 1 − Tỉ lệ thu hồi.
   STAGE 1 quy về GC: công đoạn sau rang (roasted=true) chia hệ số rang (÷0.84).
   STAGE 2 quy về Total Solid: FGs (isFG=true) nhân hệ số solid (×0.97).
   Overall = N1 × N9 × N2 ; Unknown deviation = |1 − N1×N2| (mục tiêu <0.5%).            */
function mkStageRow(stage,flags){ return Object.assign(
  {stage,batch:'',nsx:'',po:'',input:'',downgrade:'',loss:'',sampling:'',instock:'',actualOut:'',record:'',remark:''}, flags||{}); }
function newMass(){
  return {
    factors:{ roastYield:0.84, fgSolid:0.97 },
    solidFromExtraction:'',   // M9 — Tổng Solid từ Extraction thực tế (kg)
    reworkAddSolid:'',        // cộng thêm vào Output thực tế FGs (nếu có), basis solid
    unknownLimit:0.5,         // % ngưỡng unknown deviation
    stage1:[ mkStageRow('Nhập hàng',{roasted:false}), mkStageRow('Tipping',{roasted:false}),
             mkStageRow('Roaster',{roasted:true}),     mkStageRow('Grinder',{roasted:true}) ],
    stage2:[ mkStageRow('Extraction',{isFG:false}), mkStageRow('Evaporation',{isFG:false}),
             mkStageRow('FMT',{isFG:false}),         mkStageRow('FGs',{isFG:true}) ],
    note:''
  };
}
// Tính tổng hợp 1 nhóm stage với hệ số quy đổi từng dòng
function stageSummary(rows,convFn){
  const s={input:+rows[0].input||0, dg:0, loss:0, samp:0, stock:0};
  rows.forEach(r=>{ const k=convFn(r);
    s.dg+=(+r.downgrade||0)*k; s.loss+=(+r.loss||0)*k; s.samp+=(+r.sampling||0)*k; s.stock+=(+r.instock||0)*k; });
  s.theo = s.input - (s.dg+s.loss+s.samp) - s.stock;   // Output lý thuyết
  return s;
}
function massCalc(ex){
  const m=ex.mass&&ex.mass.stage1 ? ex.mass : (ex.mass=newMass());
  const RY=+m.factors.roastYield||0.84, FG=+m.factors.fgSolid||0.97;
  const conv1=r=>r.roasted?(RY?1/RY:0):1;   // quy về GC
  const conv2=r=>r.isFG?FG:1;               // quy về Total Solid
  // Stage 1 (GC)
  const s1=stageSummary(m.stage1,conv1);
  const lastG=m.stage1[m.stage1.length-1];
  s1.actual=(+lastG.actualOut||0)*conv1(lastG);
  s1.recovery=s1.theo? s1.actual/s1.theo : 0;
  s1.gap=1-s1.recovery;
  // GC -> Solid
  const M9=+m.solidFromExtraction||0;
  const N9= s1.actual? M9/s1.actual : 0;
  // Stage 2 (Total Solid)
  const s2=stageSummary(m.stage2,conv2);
  const lastF=m.stage2[m.stage2.length-1];
  s2.actual=((+lastF.actualOut||0)+(+m.reworkAddSolid||0))*conv2(lastF);
  s2.recovery=s2.theo? s2.actual/s2.theo : 0;
  s2.gap=1-s2.recovery;
  // Tổng hợp
  const overall = s1.recovery * N9 * s2.recovery;              // hệ số chuyển đổi tổng
  const hasData = (+m.stage1[0].input||0)>0 && (+lastG.actualOut||0)>0;
  const unknownDev = Math.abs(1 - s1.recovery*s2.recovery)*100; // %
  const limit=+m.unknownLimit||0.5;
  return {RY,FG,s1,N9,M9,s2,overall,unknownDev,limit,hasData};
}

// Đánh giá kết quả đợt (đạt/không) theo 4 tiêu chí BRC
function evalExercise(ex){
  const cs=checklistStats(ex);
  const ts=timeStatus(ex);
  const mc=massCalc(ex);
  const onTime = ts.state==='done-ok';
  const complete = cs.miss===0 && cs.done>0;
  const massOk = mc.hasData && mc.unknownDev<=mc.limit;
  const pass = onTime && complete && massOk;
  return {onTime,complete,massOk,pass,cs,ts,mc};
}

  const passed=ex.filter(e=>e.status==='closed'&&evalExercise(e).pass).length;
  const running=ex.filter(e=>e.startAt&&!e.finishAt&&e.status!=='closed').length;
  const thisYear=ex.filter(e=>new Date(e.createdAt).getFullYear()===new Date().getFullYear()).length;
  const passRate= total?Math.round(passed/total*100):0;

  $('#tab-dashboard').innerHTML=`
    <div class="page-h"><h2>Dashboard</h2>
      <span class="desc">Tổng quan hoạt động truy xuất — mục tiêu ≥ 2 đợt/năm, hoàn thành ≤ ${DB.settings.maxHours}h.</span>
      <span class="spacer"></span>
      <button class="btn pri" onclick="Ex.create()">+ Đợt truy xuất mới</button></div>

    <div class="grid g4">
      <div class="card kpi"><span class="ic">▶</span><div class="n">${total}</div><div class="l">Tổng số đợt</div></div>
      <div class="card kpi"><span class="ic">✓</span><div class="n" style="color:var(--ok)">${passed}</div><div class="l">Đạt yêu cầu (đã đóng)</div></div>
      <div class="card kpi"><span class="ic">⧗</span><div class="n" style="color:var(--warn)">${running}</div><div class="l">Đang thực hiện</div></div>
      <div class="card kpi"><span class="ic">📅</span><div class="n">${thisYear}</div><div class="l">Đợt trong năm ${new Date().getFullYear()}</div></div>
    </div>

    <div class="grid g2" style="margin-top:14px">
      <div class="card pad">
        <h3>Tỷ lệ đạt</h3>
        <div style="display:flex;align-items:center;gap:16px;margin-top:12px">
          <div style="font-size:38px;font-weight:800;color:${passRate>=80?'var(--ok)':passRate>=50?'var(--warn)':'var(--bad)'}">${passRate}%</div>
          <div style="flex:1"><div class="bar ${passRate>=80?'ok':passRate>=50?'warn':''}"><i style="width:${passRate}%"></i></div>
          <div class="muted" style="font-size:12px;margin-top:6px">${passed}/${total} đợt đã đóng đạt cả 3 tiêu chí (đúng hạn · đủ hồ sơ · cân bằng khối)</div></div>
        </div>
      </div>
      <div class="card pad">
        <h3>Nhắc việc</h3>
        <div style="margin-top:10px">${dashReminders(ex)}</div>
      </div>
    </div>

    <div class="card pad" style="margin-top:14px">
      <div class="row" style="justify-content:space-between"><h3>Các đợt truy xuất gần đây</h3></div>
      ${ex.length? dashTable(ex): emptyBox('Chưa có đợt truy xuất nào','Bấm “+ Đợt truy xuất mới” để bắt đầu.')}
    </div>`;
  $('#bg-ex').textContent=total;
}
function dashReminders(ex){
  const items=[];
  const yr=new Date().getFullYear();
  const inYear=ex.filter(e=>new Date(e.createdAt).getFullYear()===yr).length;
  if(inYear<2) items.push(`<div class="row"><span class="tag warn">Tần suất</span> Năm ${yr} mới có <b>${inYear}</b> đợt — yêu cầu tối thiểu <b>2 đợt/năm</b>.</div>`);
  ex.filter(e=>e.startAt&&!e.finishAt&&e.status!=='closed').forEach(e=>{
    const ts=timeStatus(e);
    if(ts.state==='overdue') items.push(`<div class="row"><span class="tag bad">Quá hạn 4h</span> ${esc(e.batch||'(chưa có batch)')} — ${ts.text}.</div>`);
    else items.push(`<div class="row"><span class="tag b">Đang chạy</span> ${esc(e.batch||'(batch)')} — ${ts.text}.</div>`);
  });
  const openMiss=ex.filter(e=>e.status!=='closed'&&checklistStats(e).miss>0);
  openMiss.forEach(e=>items.push(`<div class="row"><span class="tag warn">Thiếu hồ sơ</span> ${esc(e.batch||'(batch)')} — còn <b>${checklistStats(e).miss}</b> biểu mẫu chưa có.</div>`));
  return items.length?items.slice(0,6).map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${x}</div>`).join(''):'<div class="muted">Không có nhắc việc. 👍</div>';
}
function dashTable(ex){
  const rows=[...ex].sort((a,b)=>b.createdAt-a.createdAt).slice(0,12).map(e=>{
    const cs=checklistStats(e),ev=evalExercise(e);
    const st = e.status==='closed'?(ev.pass?'<span class="tag ok">Đạt</span>':'<span class="tag bad">Không đạt</span>')
      : e.startAt?'<span class="tag b">Đang chạy</span>':'<span class="tag na">Nháp</span>';
    return `<tr style="cursor:pointer" onclick="Ex.open('${e.id}')">
      <td><b>${esc(e.batch||'—')}</b><div class="muted" style="font-size:12px">${esc(e.material||'')}</div></td>
      <td>${e.dir==='forward'?'<span class="tag b">Forward</span>':'<span class="tag b">Backward</span>'}</td>
      <td>${esc(e.purpose||'—')}</td>
      <td>${fmtDay(e.createdAt)}</td>
      <td><div class="bar ${cs.pct>=100?'ok':''}" style="width:90px"><i style="width:${cs.pct}%"></i></div><span class="muted" style="font-size:12px">${cs.pct}%</span></td>
      <td>${st}</td></tr>`;
  }).join('');
  return `<table class="tbl" style="margin-top:8px"><thead><tr>
    <th>Batch / Material</th><th>Chiều</th><th>Mục đích</th><th>Ngày tạo</th><th>Hồ sơ</th><th>Trạng thái</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}
function emptyBox(t,s){ return `<div class="empty"><div class="big">▦</div><div style="font-weight:700">${esc(t)}</div><div class="muted">${esc(s)}</div></div>`; }

/* ---------------------------- ĐỢT TRUY XUẤT ------------------------------ */
const Ex = {
  create(){
    const ex={ id:uid(), createdAt:Date.now(), status:'draft',
      batch:'', material:'', matNo:'', purpose:'Bài tập định kỳ', scenario:'',
      dir:'backward', startAt:null, finishAt:null,
      checklist:buildChecklist('backward'),
      mass:newMass(),
      trace:newTrace(),
      capa:'', conclusion:'' };
    DB.exercises.push(ex); DB.current=ex.id; logAct('Tạo đợt truy xuất mới');
    Store.save(); Nav.go('exercise');
  },
  open(id){ DB.current=id; Store.save(); Nav.go('exercise'); },
  del(id){ confirmBox('Xóa đợt truy xuất','Toàn bộ dữ liệu đợt này sẽ bị xóa vĩnh viễn.',()=>{
      DB.exercises=DB.exercises.filter(e=>e.id!==id);
      if(DB.current===id)DB.current=DB.exercises[0]?.id||null;
      logAct('Xóa 1 đợt truy xuất'); Store.save(); Nav.go('exercise'); toast('Đã xóa','ok');
    },'Xóa','danger'); },
  duplicate(id){ const s=DB.exercises.find(e=>e.id===id); if(!s)return;
    const c=JSON.parse(JSON.stringify(s)); c.id=uid(); c.createdAt=Date.now(); c.status='draft';
    c.startAt=null; c.finishAt=null; c.batch=(s.batch||'')+' (copy)';
    // reset trạng thái checklist
    c.checklist.forEach(g=>g.items.forEach(it=>{it.status='';it.receivedAt=null;it.remark='';}));
    DB.exercises.push(c); DB.current=c.id; Store.save(); Nav.go('exercise'); toast('Đã nhân bản đợt','ok');
  },
  setDir(id,dir){ const e=DB.exercises.find(x=>x.id===id); if(!e)return;
    if(e.dir===dir)return;
    confirmBox('Đổi chiều truy xuất','Đổi chiều sẽ dựng lại checklist theo danh mục '+(dir==='forward'?'Forward':'Backward')+'. Trạng thái checklist hiện tại sẽ bị đặt lại. Tiếp tục?',()=>{
      e.dir=dir; e.checklist=buildChecklist(dir); Store.save(); Nav.go('exercise'); toast('Đã đổi chiều & dựng lại checklist','ok');
    });
  },
  start(id){ const e=DB.exercises.find(x=>x.id===id); if(!e)return;
    if(!e.batch){toast('Nhập Batch no. trước khi bắt đầu','warn');return;}
    e.startAt=Date.now(); e.finishAt=null; e.status='running'; logAct('Bắt đầu đếm giờ truy xuất '+e.batch);
    Store.save(); Nav.go('exercise'); toast('Đã bắt đầu — đồng hồ 4h chạy','ok'); },
  finish(id){ const e=DB.exercises.find(x=>x.id===id); if(!e)return;
    e.finishAt=Date.now(); logAct('Kết thúc thu thập '+e.batch); Store.save(); Nav.go('exercise'); toast('Đã ghi mốc hoàn thành','ok'); },
  close(id){ const e=DB.exercises.find(x=>x.id===id); if(!e)return;
    const ev=evalExercise(e);
    confirmBox('Đóng đợt truy xuất', 'Kết quả đánh giá: '+(ev.pass?'ĐẠT':'KHÔNG ĐẠT')+'. Sau khi đóng bạn vẫn có thể mở lại để chỉnh.',()=>{
      e.status='closed'; if(!e.finishAt)e.finishAt=Date.now(); Store.save(); Nav.go('report'); toast('Đã đóng đợt','ok');
    },'Đóng đợt'); },
  reopen(id){ const e=DB.exercises.find(x=>x.id===id); if(!e)return; e.status='running'; Store.save(); Nav.go('exercise'); },
  field(id,k,v){ const e=DB.exercises.find(x=>x.id===id); if(!e)return; e[k]=v; Store.save(); }
};

function qUpd(){ $('#bg-ex') && ($('#bg-ex').textContent=DB.exercises.length); }

function startCountdown(ex){
  stopCountdown();
  const tick=()=>{ const ts=timeStatus(ex); const cd=$('#cd'),tx=$('#cdTxt');
    if(!cd){stopCountdown();return;}
    cd.textContent=fmtDur(Math.abs(ts.remainMs));
    cd.className='count '+(ts.state==='overdue'?'bad':'warn');
    tx.textContent=ts.text;
  };
  tick(); countdownTimer=setInterval(tick,1000);
}
function stopCountdown(){ if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;} }

  return 'QA - DIỄN TẬP TRUY XUẤT NGUỒN GỐC - BATCH: '+b;
}

/* ---- Tạo file email .eml (RFC822) mở sẵn trong Outlook (X-Unsent:1) ---- */
const Email = {
  b64(s){ return btoa(unescape(encodeURIComponent(s))); },   // base64 chuẩn UTF-8
  fold(s){ return s.replace(/(.{76})/g,'$1\r\n'); },          // gấp dòng base64 76 ký tự
  buildEML(subject,to,cc,body){
    let h='';
    h+='X-Unsent: 1\r\n';                 // Outlook mở như thư nháp CHƯA gửi -> chỉ bấm Send
    h+='To: '+to+'\r\n';
    if(cc) h+='Cc: '+cc+'\r\n';
    h+='Date: '+new Date().toUTCString()+'\r\n';
    h+='Subject: =?UTF-8?B?'+this.b64(subject)+'?=\r\n';
    h+='MIME-Version: 1.0\r\n';
    h+='Content-Type: text/plain; charset="UTF-8"\r\n';
    h+='Content-Transfer-Encoding: base64\r\n';
    h+='\r\n';
    h+=this.fold(this.b64(body))+'\r\n';
    return h;
  },
  eml(){
    const eml=this.buildEML($('#emSubj').value, $('#emTo').value.trim(), $('#emCc').value.trim(), $('#emBody').value);
    const blob=new Blob([eml],{type:'message/rfc822'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='QA_TruyXuat_'+((currentEx()&&currentEx().batch)||'batch')+'.eml';
    a.click(); URL.revokeObjectURL(a.href);
    logAct('Tạo email .eml truy xuất'); toast('Đã tạo file .eml — mở bằng Outlook rồi bấm Send','ok');
  },
  mailto(){ const to=$('#emTo').value.split(/[;,]/).map(s=>s.trim()).filter(Boolean).join(',');
    const cc=$('#emCc').value.split(/[;,]/).map(s=>s.trim()).filter(Boolean).join(',');
    const s=encodeURIComponent($('#emSubj').value), b=encodeURIComponent($('#emBody').value);
    window.location.href=`mailto:${to}?cc=${cc}&subject=${s}&body=${b}`; }
};

function clRows(ex){
  let n=0,html='';
  (ex.checklist||[]).forEach((g,gi)=>{
    const visItems=g.items.filter(it=> clFilter==='all' || (clFilter==='miss'&&it.status!=='yes'&&it.status!=='na') || (clFilter==='done'&&it.status==='yes'));
    if(!visItems.length)return;
    html+=`<tr class="stage-row"><td colspan="5">${esc(g.stage)} <span class="tag na" style="margin-left:6px">${esc(g.pic)}</span></td></tr>`;
    g.items.forEach((it,ii)=>{
      if(clFilter==='miss'&&(it.status==='yes'||it.status==='na'))return;
      if(clFilter==='done'&&it.status!=='yes')return;
      n++;
      const stTag = it.status==='yes'?'<span class="tag ok">Có sẵn</span>'
        : it.status==='no'?'<span class="tag bad">Không có</span>'
        : it.status==='na'?'<span class="tag na">N/A</span>'
        : '<span class="tag na">— chưa —</span>';
      html+=`<tr>
        <td>${n}</td>
        <td>${esc(it.form)}</td>
        <td><button class="btn sm" style="padding:3px 8px" onclick="Cl.cycle('${ex.id}',${gi},${ii})">${stTag}</button></td>
        <td>${it.receivedAt?fmtDate(it.receivedAt):'<span class="muted">—</span>'}</td>
        <td><input class="in" style="padding:5px 8px" value="${esc(it.remark)}" oninput="Cl.remark('${ex.id}',${gi},${ii},this.value)"></td>
      </tr>`;
    });
  });
  return html || `<tr><td colspan="5"><div class="empty"><div class="muted">Không có mục nào khớp bộ lọc.</div></div></td></tr>`;
}
const Cl = {
  filter(f){ clFilter=f; renderChecklist(); },
  cycle(id,gi,ii){ const e=DB.exercises.find(x=>x.id===id); const it=e.checklist[gi].items[ii];
    const order=['', 'yes','no','na'];
    let cur=order.indexOf(it.status); it.status=order[(cur+1)%order.length];
    it.receivedAt = it.status==='yes'?Date.now():null;
    Store.save(); renderChecklist(); },
  remark(id,gi,ii,v){ const e=DB.exercises.find(x=>x.id===id); e.checklist[gi].items[ii].remark=v; Store.save(); },
  setAll(id,st){ const e=DB.exercises.find(x=>x.id===id);

  exportCSV(id){ const e=DB.exercises.find(x=>x.id===id);

};

function sectionTotals(rows){
  let inS=0,outS=0; rows.forEach(r=>{inS+=(+r.inQty||0);outS+=(+r.outQty||0);});
  return {inS,outS,gap:inS-outS,pct: inS>0?(inS-outS)/inS*100:0};
}

function traceSection(ex,sec,no){
  const spec=TRACE_SPEC[sec]; const rows=ex.trace[sec]||[];
  const hasGap=spec.kind==='io';
  // Header 2 tầng cho io: nhóm INPUT / OUTPUT
  let head='';
  if(hasGap){
    const inCols=spec.cols.filter(c=>c.t==='in'), outCols=spec.cols.filter(c=>c.t==='out'), other=spec.cols.filter(c=>!c.t);
    head=`<tr>
      <th rowspan="2" style="width:40px">#</th>
      ${other.filter(c=>c.k==='po').map(c=>`<th rowspan="2">${c.l}</th>`).join('')}
      <th colspan="${inCols.length}" style="text-align:center;background:var(--brand-soft)">INPUT</th>
      <th colspan="${outCols.length}" style="text-align:center;background:var(--ok-soft)">OUTPUT</th>
      <th rowspan="2">Gap</th>
      ${other.filter(c=>c.k!=='po').map(c=>`<th rowspan="2">${c.l}</th>`).join('')}
      <th rowspan="2" style="width:34px"></th></tr>
      <tr>${inCols.map(c=>`<th>${c.l}</th>`).join('')}${outCols.map(c=>`<th>${c.l}</th>`).join('')}</tr>`;
  }else{
    head=`<tr><th style="width:40px">#</th>${spec.cols.map(c=>`<th>${c.l}</th>`).join('')}<th style="width:34px"></th></tr>`;
  }
  const body=rows.map((r,i)=>{
    let cells='';
    if(hasGap){
      const po=spec.cols.find(c=>c.k==='po');
      const inCols=spec.cols.filter(c=>c.t==='in'), outCols=spec.cols.filter(c=>c.t==='out'), other=spec.cols.filter(c=>!c.t&&c.k!=='po');
      const gap=(+r.inQty||0)-(+r.outQty||0);
      cells=`<td>${cellInput(ex.id,sec,i,po)}</td>`
        + inCols.map(c=>`<td>${cellInput(ex.id,sec,i,c)}</td>`).join('')
        + outCols.map(c=>`<td>${cellInput(ex.id,sec,i,c)}</td>`).join('')
        + `<td><b style="color:${Math.abs(gap)<0.0001?'var(--ok)':'var(--warn)'}">${fmtNum(gap)}</b></td>`
        + other.map(c=>`<td>${cellInput(ex.id,sec,i,c)}</td>`).join('');
    }else{
      cells=spec.cols.map(c=>`<td>${cellInput(ex.id,sec,i,c)}</td>`).join('');
    }
    return `<tr><td>${i+1}</td>${cells}<td><button class="btn sm danger" style="padding:3px 7px" onclick="Tr.del('${ex.id}','${sec}',${i})">✕</button></td></tr>`;
  }).join('');
  let foot='';
  if(hasGap){ const t=sectionTotals(rows);
    foot=`<tr class="stage-row"><td colspan="99">Total input: <b>${fmtNum(t.inS)}</b> · Total output: <b>${fmtNum(t.outS)}</b> · Gap: <b>${fmtNum(t.gap)}</b> (${t.pct.toFixed(3)}%)</td></tr>`; }
  return `<div class="card pad" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between">
      <h3>${no}. ${esc(spec.title)}</h3>
      <button class="btn sm" onclick="Tr.add('${ex.id}','${sec}')">+ Dòng</button></div><hr class="hr">
    <div style="overflow:auto">
      <table class="tbl" style="min-width:${hasGap?'1000px':'900px'}">
        <thead>${head}</thead>
        <tbody>${body||`<tr><td colspan="99" class="muted">Chưa có dòng nào — bấm “+ Dòng”.</td></tr>`}</tbody>
        ${foot?`<tfoot>${foot}</tfoot>`:''}
      </table>
    </div></div>`;
}
function cellInput(id,sec,i,col){
  const ex=DB.exercises.find(x=>x.id===id); const v=ex.trace[sec][i][col.k]??'';
  return `<input class="in" style="padding:4px 6px;min-width:${col.w||90}px" ${col.num?'type="number" step="any"':''}
    value="${esc(v)}" oninput="Tr.cell('${id}','${sec}',${i},'${col.k}',this.value)" ${col.num?`onchange="renderTrace()"`:''}>`;
}
const Tr = {
  reason(id,v){ const e=DB.exercises.find(x=>x.id===id); e.trace.reason=v; Store.save(); },
  part(id,i,k,v){ const e=DB.exercises.find(x=>x.id===id); e.trace.participants[i][k]=v; Store.save(); },
  add(id,sec){ const e=DB.exercises.find(x=>x.id===id); e.trace[sec].push(newTraceRow(sec)); Store.save(); renderTrace(); },
  del(id,sec,i){ const e=DB.exercises.find(x=>x.id===id); e.trace[sec].splice(i,1); Store.save(); renderTrace(); },
  cell(id,sec,i,k,v){ const e=DB.exercises.find(x=>x.id===id); e.trace[sec][i][k]=v; Store.save(); }
  // Gap & totals cập nhật khi rời ô số lượng (onchange -> renderTrace) để không mất focus
};

function reportTraceSection(ex,sec,no){
  const spec=TRACE_SPEC[sec]; const rows=ex.trace[sec]||[];
  if(spec.kind==='flat'){
    const head=`<tr>${spec.cols.map(c=>`<th>${c.l}</th>`).join('')}</tr>`;
    const body=rows.length?rows.map(r=>`<tr>${spec.cols.map(c=>`<td>${c.num?fmtNum(r[c.k]):esc(r[c.k]||'')}</td>`).join('')}</tr>`).join('')

      <div style="overflow:auto"><table class="tbl" style="min-width:800px"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }
  // io section
  const inCols=spec.cols.filter(c=>c.t==='in'), outCols=spec.cols.filter(c=>c.t==='out'), other=spec.cols.filter(c=>!c.t);
  const po=other.find(c=>c.k==='po'); const rest=other.filter(c=>c.k!=='po');

      <th colspan="${outCols.length}" style="text-align:center;background:var(--ok-soft)">OUTPUT</th>

    <tr>${inCols.map(c=>`<th>${c.l}</th>`).join('')}${outCols.map(c=>`<th>${c.l}</th>`).join('')}</tr>`;

      ${outCols.map(c=>`<td>${c.num?fmtNum(r[c.k]):esc(r[c.k]||'')}</td>`).join('')}

  return `<h4 style="margin:14px 0 6px">6.${no}. ${esc(spec.title)}</h4>
    <div style="overflow:auto"><table class="tbl" style="min-width:950px"><thead>${head}</thead><tbody>${body}</tbody>${foot}</table></div>`;
}

const Xlsx = (function(){
  const enc=new TextEncoder();
  // ---- CRC32 ----
  const CRC=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc32(b){let c=0^-1;for(let i=0;i<b.length;i++)c=(c>>>8)^CRC[(c^b[i])&255];return (c^-1)>>>0;}

    const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
    let local=[], central=[], offset=0;
    files.forEach(f=>{
      const name=enc.encode(f.name), data=f.data, crc=crc32(data);
      const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
      local.push(new Uint8Array(lh),name,data);
      const ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
      central.push(new Uint8Array(ch),name);
      offset+=lh.length+name.length+data.length;
    });
    let cenSize=central.reduce((a,x)=>a+x.length,0);
    const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(offset),u16(0)));
    const all=[...local,...central,end]; let total=all.reduce((a,x)=>a+x.length,0);
    let out=new Uint8Array(total),p=0; all.forEach(x=>{out.set(x,p);p+=x.length;}); return out;
  }
  const xmlEsc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const colLetter=n=>{let s='';n++;while(n>0){let m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;};
  // ---- Builder: matrix rows of cells {v, s, num} ----

  Sheet.prototype.merge=function(r0,c0,r1,c1){ this.merges.push(colLetter(c0)+(r0)+':'+colLetter(c1)+(r1)); };
  function cell(v,s,num){ return {v,s:s||0,num:!!num}; }
  function sheetXML(sh){
    let rowsXml='';

        if(c.num && c.v!=='' && c.v!=null && !isNaN(+c.v))

    });

    const mg = sh.merges.length? `<mergeCells count="${sh.merges.length}">${sh.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:'';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews>${colsXml}<sheetData>${rowsXml}</sheetData>${mg}</worksheet>`;
  }

    $('#flowDel').disabled=!e; $('#flowDash').disabled=!e;
    $('#flowLink').classList.toggle('pri',this.linking);
    const nm=id=>(this.node(id)||{label:'?'}).label.replace('\n',' ');
    $('#flowHint').textContent = this.linking ? (this.linkFrom?'Bấm khối ĐÍCH (kết quả) của mũi tên.':'Bấm khối NGUỒN (nguyên nhân) của mũi tên.')
      : e ? `Đang chọn: ${nm(e.from)} → ${nm(e.to)}. Kéo chấm tròn để gắn đầu mũi tên sang khối/cạnh khác; kéo ô vuông để dời điểm gãy.`
      : 'Kéo khối để di chuyển — mũi tên tự bám theo. Bấm vào mũi tên để chọn.';
  },
  refresh(){ this.fit(); this.draw(); this.bar(); },
  down(ev){
    const t=ev.target, p=this.pt(ev), g=t.closest('[data-node]');
    if(t.dataset.h) this.drag={type:t.dataset.h};
    else if(g){ const id=g.dataset.node;
      if(this.linking){
        if(!this.linkFrom) this.linkFrom=id;
        else if(id!==this.linkFrom){ const a=this.node(this.linkFrom), b=this.node(id);
          const dx=(b.x+b.w/2)-(a.x+a.w/2), dy=(b.y+b.h/2)-(a.y+a.h/2), hz=Math.abs(dx)>Math.abs(dy);
          this.data().edges.push({from:a.id,fs:hz?(dx>0?'R':'L'):(dy>0?'B':'T'),ft:.5,to:b.id,ts:hz?(dx>0?'L':'R'):(dy>0?'T':'B'),tt:.5,mid:.5,dash:false});
          this.sel=this.data().edges.length-1; this.linking=false; this.linkFrom=null; Store.save(); }
        this.refresh(); return; }
      const n=this.node(id); this.sel=-1; this.drag={type:'node',id,dx:p.x-n.x,dy:p.y-n.y}; }
    else if(t.dataset.edge!=null) this.sel=+t.dataset.edge;
    else this.sel=-1;
    if(this.drag) ev.currentTarget.setPointerCapture(ev.pointerId);
    this.draw(); this.bar();
  },
  move(ev){
    const d=this.drag; if(!d)return; const p=this.pt(ev), e=this.data().edges[this.sel];
    if(d.type==='node'){ const n=this.node(d.id); n.x=Math.max(0,Math.round(p.x-d.dx)); n.y=Math.max(0,Math.round(p.y-d.dy)); }
    else if(!e) return;
    else if(d.type==='m'){ const a=this.anchor(this.node(e.from),e.fs,e.ft), b=this.anchor(this.node(e.to),e.ts,e.tt);
      const hz=e.fs==='L'||e.fs==='R', span=hz?b.x-a.x:b.y-a.y;
      if(span) e.mid=Math.min(.95,Math.max(.05,((hz?p.x-a.x:p.y-a.y)/span))); }
    else{ const n=this.hit(p); if(!n)return; const s=this.sideAt(n,p);
      if(d.type==='s'){ if(n.id===e.to)return; e.from=n.id; e.fs=s.s; e.ft=s.t; }
      else{ if(n.id===e.from)return; e.to=n.id; e.ts=s.s; e.tt=s.t; } }
    this.draw();
  },
  up(){ if(!this.drag)return; this.drag=null; Store.save(); this.refresh(); },
  key(ev){
    if((ev.key==='Delete'||ev.key==='Backspace')&&this.sel>=0){ ev.preventDefault(); this.del(); }
    else if(ev.key==='Escape'){ this.linking=false; this.linkFrom=null; this.sel=-1; this.refresh(); }
  },
  toggleLink(){ this.linking=!this.linking; this.linkFrom=null; this.sel=-1; this.refresh(); },
  dash(){ const e=this.data().edges[this.sel]; if(!e)return; e.dash=!e.dash; Store.save(); this.refresh(); },
  del(){ if(this.sel<0)return; this.data().edges.splice(this.sel,1); this.sel=-1; Store.save(); this.refresh(); },
  reset(){ confirmBox('Khôi phục sơ đồ mặc định','Vị trí các khối và toàn bộ mũi tên sẽ trở về sơ đồ ban đầu.',()=>{
    DB.flow=newFlow(); this.sel=-1; this.linking=false; this.linkFrom=null; logAct('Khôi phục Process Flow mặc định'); Store.save(); renderFlow(); toast('Đã khôi phục sơ đồ','ok'); },'Khôi phục'); }
};

function downloadCSV(rows,name){
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  URL.revokeObjectURL(a.href); toast('Đã xuất CSV','ok');
}

function boot(){
  DB = Store.load() || Store.defaults();
  // vá dữ liệu thiếu (khi nâng cấp)
  DB.settings ||= {maxHours:CFG.MAX_HOURS,devLimit:CFG.DEV_LIMIT};
  DB.log ||= []; DB.contacts ||= JSON.parse(JSON.stringify(SEED_CONTACTS));
  DB.ccContacts ||= JSON.parse(JSON.stringify(SEED_CC));
  DB.settings.sender ||= defaultSender();   // migration: thông tin người gửi
  if(!DB.flow || !DB.flow.nodes || !DB.flow.edges) DB.flow=newFlow();   // migration: sơ đồ Process Flow
  // migration: thành phẩm nhánh Freeze Drying là dạng bột (sơ đồ đã lưu trước đó ghi Liquid)
  DB.flow.nodes.forEach(n=>{ if(n.id==='fg2' && n.label==='FGs (Liquid)') n.label='FGs (Powder)'; });
  // Bổ sung các liên hệ mẫu còn thiếu (Grasso/WTP) cho DB cũ
  SEED_CONTACTS.forEach(sc=>{ if(!DB.contacts.some(c=>c.email===sc.email)) DB.contacts.push(JSON.parse(JSON.stringify(sc))); });
  // Migration: bổ sung trace + mass model mới cho đợt tạo trước khi có tính năng này
  DB.exercises.forEach(e=>{ if(!e.trace) e.trace=newTrace();
    ['incoming','tipping','process','packing','fgs'].forEach(s=>e.trace[s]||=[]);
    e.trace.participants ||= Array.from({length:8},()=>({name:'',dept:''}));
    if(!e.mass || !e.mass.stage1) e.mass=newMass(); });
  $$('.navbtn').forEach(b=>b.onclick=()=>Nav.go(b.dataset.tab));
  Nav.go('dashboard');
}

.tabs .active{background:var(--brand);color:white}.workspace{display:grid;grid-template-columns:minmax(500px,1.1fr) minmax(450px,1fr);gap:16px;padding:16px 24px}.left{min-width:0}.graph{overflow:auto;margin-top:12px}.graph svg{width:100%;min-width:600px;display:block}.node{cursor:pointer}.node:hover rect{stroke:#a83222;stroke-width:2}.node.selected rect{stroke:#a83222;stroke-width:3}.node.dim{opacity:.35}.node text{pointer-events:none}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}.line-example{display:inline-block;width:22px;border-top:2px solid #888;vertical-align:middle}.line-example.actual{border-color:#245a9c;border-top-width:3px}.line-example.context{border-color:#925caf;border-top-style:dashed}.list{margin-top:12px;max-height:340px;overflow:auto}.event{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px}.event.chosen{border:2px solid var(--accent);background:#fff8ef}.event .row{justify-content:space-between}.event small{display:block;margin-top:4px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid.three{grid-template-columns:repeat(3,1fr)}.full{grid-column:1/-1}.editor{min-width:0;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:12px}.editor-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.form-section{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.material{border:1px solid var(--line);border-radius:8px;margin-top:10px;padding:12px;background:#fffcf7}.material .grid{margin-top:8px}.material .remove{padding:4px 8px}.material.source{border-left:3px solid var(--blue)}.actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.sticky-actions{position:sticky;bottom:-16px;background:#fff;padding:12px 0;border-top:1px solid var(--line)}.notice{padding:10px 12px;background:#fff4dc;border-left:3px solid #b27a20;font-size:12px;margin:10px 0}.balance-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.balance-table th,.balance-table td{padding:7px;text-align:right;border-bottom:1px solid var(--line)}.balance-table th:first-child,.balance-table td:first-child{text-align:left}.empty{padding:32px 16px;color:var(--muted);text-align:center}#message{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 20px;background:var(--brand);color:white;border-radius:8px;z-index:99;box-shadow:0 4px 20px #0003}#message.error{background:#a12b20}#login{max-width:430px;margin:10vh auto;padding:28px}#login form{display:grid;gap:16px;margin-top:20px}#login-error{color:var(--bad)}.view{padding:16px 24px}.audit-item{padding:12px;border-bottom:1px solid var(--line)}.audit-item pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:250px;overflow:auto;font-size:11px}.account-list{margin-top:16px}table.data{border-collapse:collapse;width:100%;font-size:12px}table.data td,table.data th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.check{display:flex;align-items:center;gap:8px;padding:4px}.check input{width:auto;margin:0}.print-only{display:none}.report-event{margin-top:14px;break-inside:avoid}.status-bar{margin:10px 0;font-size:12px}.status-bar.error{color:var(--bad)}.filter-count{margin-top:10px;color:var(--muted);font-size:12px}.direction.active{background:#e7eef9;border-color:#245a9c;color:#245a9c}.search-result{max-height:220px;overflow:auto;margin-top:10px}.result-button{display:block;text-align:left;width:100%;margin-top:5px}.result-button small{display:block;color:var(--muted)}
